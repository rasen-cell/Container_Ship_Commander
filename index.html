/* ======================================================================
   座標ヘルパ
   ====================================================================== */
function localOf(s, wx, wy) {
  const dx = wx - s.x, dy = wy - s.y, c = Math.cos(-s.hdg), sn = Math.sin(-s.hdg);
  return { lx: dx * c - dy * sn, ly: dx * sn + dy * c };
}
function worldOf(s, lx, ly, lz) {
  const c = Math.cos(s.hdg), sn = Math.sin(s.hdg);
  return { x: s.x + lx * c - ly * sn, y: s.y + lx * sn + ly * c, z: lz || 0 };
}
const batPos = (s, b) => worldOf(s, b.px, b.py, b.pz);
const velOf = s => ({ vx: Math.cos(s.hdg) * s.spd, vy: Math.sin(s.hdg) * s.spd });
const quadHealth = s => QUADS.reduce((a, q) => a + clamp(s.quads[q].hp / s.quads[q].max, 0, 1), 0) / 4;
const worstQuad = s => QUADS.slice().sort((a, b) => s.quads[a].hp - s.quads[b].hp)[0];

/* ======================================================================
   操艦
   ====================================================================== */
/** 座礁 — 島に乗り上げれば押し戻され、足が止まり、船底が削れる */
function groundCheck(s, dt) {
  if (!s.alive || s.air) return;
  const margin = s.len * 0.30;
  for (const isl of G.islands) {
    const h = islandPush(isl, s.x, s.y, margin);
    if (!h) continue;
    s.x += h.nx * h.over; s.y += h.ny * h.over;
    const was = Math.abs(s.spd);
    /* 前進は殺すが、後進はほぼ残す。乗り上げたら後進で降ろすのが手順で、
       ここを強く殺すと後進が立ち上がらず、離礁そのものができなくなる */
    s.spd *= s.spd < 0 ? 0.97 : 0.25;
    s.grounded = (s.grounded || 0) + dt;
    /* 船底が擦れる被害は 1 秒に 1 度まで。毎フレーム重ねると一瞬で沈む */
    if (was > 1.5 && (s.groundHit || 0) <= 0) {
      s.groundHit = 1;
      applyDamage(s, was * 9, 9999, s.x + Math.cos(s.hdg) * s.len * 0.4, s.y + Math.sin(s.hdg) * s.len * 0.4,
        s.hdg, { fireChance: 0, showDmg: s === G.player });
      if (s === G.player) {
        shakeAdd(3);
        if ((s.groundWarn || 0) <= 0) { s.groundWarn = 2.5; warn('座礁', '後進で離脱せよ', true); SFX.ng(); }
      }
    }
    return;
  }
  s.grounded = 0;
}

/** いま出せる最大速力(m/s)。設計値 × 損傷。HUD もこれを読む */
function maxSpeedNow(s) {
  return s.maxSpd
    * engineFactor(s.quads.stern.hp / s.quads.stern.max, s.flood)
    * bowDragFactor(s.quads.bow.hp / s.quads.bow.max);
}

function updateShipPhysics(s, dt) {
  if (s.course !== null && s.course !== undefined) {
    /* AI の針路だけ島を避けて曲げる。自艦の操舵は艦長の責任 */
    const e = angN((s.ai ? avoidIslands(s, s.course) : s.course) - s.hdg);
    s.rudder = clamp(e * 3.2, -2, 2);
    if (Math.abs(e) < 0.012) s.rudder = 0;
  }
  const tele = TELEGRAPH[clamp(s.tele, 0, TELEGRAPH.length - 1)];
  /* 損傷: 艦尾が抜けると足が落ち、舵も鈍る */
  const stern = clamp(s.quads.stern.hp / s.quads.stern.max, 0, 1);
  const want = tele.f * maxSpeedNow(s);
  const rate = (want > s.spd ? 0.55 : 1.15) * s.maxSpd * 0.13;
  s.spd += clamp(want - s.spd, -rate * dt, rate * dt);

  const tr = turnRate(s.spd, s.rudder * rudderFactor(stern), s.maxSpd, s.agility);
  s.hdg = (s.hdg + tr * dt) % TAU;
  s.x += Math.cos(s.hdg) * s.spd * dt;
  s.y += Math.sin(s.hdg) * s.spd * dt;
  groundCheck(s, dt);

  /* 傾斜(旋回横傾斜 + 片舷損傷) */
  const asym = (clamp(s.quads.star.hp / s.quads.star.max, 0, 1) - clamp(s.quads.port.hp / s.quads.port.max, 0, 1));
  const wantList = clamp(-tr * (s.spd / Math.max(1, s.maxSpd)) * 130 + asym * 16, -50, 50);
  s.listV += (wantList - s.list) * 2.2 * dt;
  s.listV *= Math.pow(0.02, dt);
  s.list += s.listV * dt;

  /* 航跡 */
  s.wakeT -= dt;
  if (s.spd > 1.4 && s.wakeT <= 0 && s.dive < 0.6) {
    s.wakeT = 0.22;
    const st = worldOf(s, -s.len * 0.5, 0, 0);
    G.wakes.push({ x: st.x, y: st.y, r: s.beam * 0.42, life: 5.5, max: 5.5, grow: s.beam * 0.30 });
    if (G.wakes.length > 300) G.wakes.shift();
  }

  /* 区画の火災・浸水 */
  let flood = 0;
  for (const q of QUADS) {
    const k = s.quads[q];
    /* 火災: 延焼している間は広がり、燃え尽きれば消し止められる。
       新たに被弾すれば延焼時間も燃勢も戻るので、撃たれ続ける限りは危険なまま */
    if (k.fire > 0) {
      const dcm = (s.dc && s.dc.dcMult) || 1;
      if (k.fireT > 0) { k.fireT -= dt * dcm; k.fire = clamp(k.fire + FIRE_GROW * dt, 0, 1.1); }
      else k.fire -= FIRE_DECAY * dcm * dt;
      if (k.fire < 0.04) { k.fire = 0; k.fireT = 0; }
      k.hp -= k.fire * k.max * FIRE_DMG * dt;
      if (k.fire > 0 && Math.random() < dt * k.fire * 0.9) {
        const w = quadWorld(s, q, 8);
        smoke(w.x, w.y, w.z, 1, '#4a4038');
      }
    }
    /* 浸水: 同じく、排水が追いつけば引く */
    if (k.flood > 0) {
      const dcm2 = (s.dc && s.dc.dcMult) || 1;
      if (k.floodT > 0) { k.floodT -= dt * dcm2; k.flood = clamp(k.flood + FLOOD_GROW * dt, 0, 1.0); }
      else k.flood -= FLOOD_DECAY * dcm2 * dt;
      if (k.flood < 0.03) { k.flood = 0; k.floodT = 0; }
      k.hp -= k.flood * k.max * FLOOD_DMG * dt;
    }
    /* 応急班による復旧。設計に応急設備を積んでいれば速くなる。
       敵艦は応急班を持たない（s.dc が無い）ので、ここは自艦だけの規則 */
    if (k.hitT > 0) k.hitT -= dt;
    if (s.dc && canRegen(k, dt)) {
      k.hp = Math.min(k.max * REGEN_CAP, k.hp + k.max * REGEN_RATE * s.dc.dcMult * dt);
      k.regen = 1;
    } else k.regen = 0;
    flood += k.flood;
    if (k.hp <= 0) k.hp = 0;
  }
  s.flood = clamp(flood / 3, 0, 1);
  if (s.hitFlash > 0) s.hitFlash -= dt;
  if (s.groundWarn > 0) s.groundWarn -= dt;
  if (s.groundHit > 0) s.groundHit -= dt;

  /* 潜航 */
  if (s.sub) updateSub(s, dt);

  if (isSunkByQuad(s.quads) && s.alive) sinkShip(s);
}
function quadWorld(s, q, z) {
  const L = s.len / 2, Bm = s.beam / 2;
  const m = { bow: [L * 0.62, 0], stern: [-L * 0.62, 0], port: [0, -Bm * 0.7], star: [0, Bm * 0.7] }[q];
  return worldOf(s, m[0], m[1], z || 6);
}

/** 潜水艦: 一定周期で浮上して換気・砲撃する。潜航中は砲弾が通らない */
function updateSub(s, dt) {
  /* 段階変化: 追い込まれた超兵器潜水艦は潜っていられなくなり、砲撃戦に移行する */
  if (s.superweapon && !s.forcedUp && quadHealth(s) < 0.5) {
    s.forcedUp = true; s.surfacing = true;
    warn(s.name + ' 浮上', '潜航不能 — 砲撃戦に移行');
    pushLog('◆ ' + s.name + ' が浮上した。もう潜航能力はない', '#ffb43c');
  }
  if (s.forcedUp) { s.dive = Math.max(0, s.dive - dt * 0.5); s.z = -s.dive * 8; return; }
  s.subT = (s.subT === undefined ? rnd(3, 9) : s.subT) - dt;
  if (s.subT <= 0) {
    s.surfacing = !s.surfacing;
    /* 潜航中は互いに撃てない。窓が短すぎると勝負にならないので半々に近づける */
    const big = s.superweapon;
    s.subT = s.surfacing ? (big ? rnd(13, 18) : rnd(8, 12)) : (big ? rnd(11, 15) : rnd(14, 20));
    if (s.surfacing && s.side === 'enemy' && G.player &&
        dist2(s.x, s.y, G.player.x, G.player.y) < 3000) {
      warn(s.name + ' 浮上', '攻撃の機会を逃すな', true);
      pushLog('▲ ' + s.name + ' 浮上', '#ffb43c');
    }
  }
  const wantDive = s.surfacing ? 0 : 1;
  s.dive += clamp(wantDive - s.dive, -dt * 0.5, dt * 0.5);
  s.z = -s.dive * 8;
}

/* ======================================================================
   被弾 — 4区画。1区画でも 0 で沈没
   ====================================================================== */
function applyDamage(s, dmg, pen, wx, wy, shotDir, opt) {
  if (!s.alive) return null;
  opt = opt || {};
  const { lx, ly } = localOf(s, wx, wy);
  const q = quadrantAt(lx, ly, s.len);
  const k = s.quads[q];
  const obliq = Math.abs(angN(shotDir - s.hdg));
  const impactAngle = Math.abs(Math.PI / 2 - Math.min(obliq, Math.PI - obliq));
  const armor = s.armor || 0;
  const res = opt.underwater ? { mult: 1, kind: 'pen' } : penetrate(pen, armor, impactAngle);
  const d = dmg * res.mult * (opt.mult || 1);
  /* 直撃区画に 75%、隣接2区画に 18% ずつ。構造を伝わる被害 */
  k.hp = Math.max(0, k.hp - d * 0.75);
  k.hitT = REGEN_WAIT;                                   // 撃たれている間は復旧できない
  for (const n of adjacentQuads(q)) {
    s.quads[n].hp = Math.max(0, s.quads[n].hp - d * QUAD_SPREAD);
    s.quads[n].hitT = REGEN_WAIT;
  }
  s.hitFlash = 0.14;
  if (res.kind !== 'ric') {
    if (Math.random() < (opt.fireChance !== undefined ? opt.fireChance : 0.14) * (d / 120)) {
      k.fire = Math.max(k.fire, 0.3); k.fireT = Math.max(k.fireT || 0, FIRE_SPREAD);
    }
    if (opt.underwater || Math.random() < 0.05 * (d / 200)) {
      k.flood = Math.max(k.flood, opt.underwater ? 0.5 : 0.18);
      k.floodT = Math.max(k.floodT || 0, FLOOD_SPREAD);
    }
  }
  /* 兵装の損傷 */
  if (res.kind === 'pen' && Math.random() < 0.16) {
    const near = s.batteries.filter(b => b.hp > 0 && Math.abs(b.px - lx) < s.len * 0.20);
    if (near.length) {
      const b = pick(near);
      b.hp -= 0.6;
      if (b.hp <= 0 && s === G.player) { warn(b.name + ' 損傷', '使用不能'); pushLog('▼ ' + b.name + ' 大破', '#ff5a47'); }
    }
  }
  const wz = 8;
  if (res.kind === 'ric') {
    SFX.ric();
    fx({ k: 'ring', x: wx, y: wy, r: 3, max: 16, life: 0.3, col: '#cdd6db' });
    floatText(wx, wy, wz, '弾かれた', '#8fa6b2', 0.8);
  } else {
    explode(wx, wy, wz, res.kind === 'pen' ? 12 : 7, d > 260);
    floatText(wx, wy, wz + 6, Math.round(d) + (res.kind === 'part' ? ' 半徹' : ''),
      s === G.player ? '#ff8a6a' : (res.kind === 'pen' ? '#ffd28a' : '#c9d4da'), d > 260 ? 1.25 : 0.9);
    SFX.hit();
  }
  if (s === G.player) {
    shakeAdd(clamp(d * 0.02, 0.8, 5));
    if (d > 120) {
      warn(QUAD_JA[q] + ' 被弾', k.hp / k.max < 0.3 ? '危険 — 応急修理を回せ' : null, true);
      SFX.quadHit(q);
    }
  }
  if (isSunkByQuad(s.quads)) sinkShip(s);
  return res;
}

function sinkShip(s) {
  if (!s.alive) return;
  s.alive = false; s.deathT = 3.2;
  explode(s.x, s.y, 6, s.len > 150 ? 60 : 30, true);
  for (let i = 0; i < (s.len > 150 ? 6 : 3); i++)
    setTimeout(() => { if (G.state === 'battle') explode(s.x + rnd(-s.len * .3, s.len * .3), s.y + rnd(-s.beam, s.beam), 4, 18, true); }, i * 210);
  smoke(s.x, s.y, 12, 6, '#2c343c');
  if (s === G.player) { warn('本艦 沈没', '作戦失敗'); return; }
  if (s.side === 'enemy' || s.side === 'civil') {
    const d = s.def;
    G.money += d.score; G.merit += d.merit; G.kills++;
    G.sunk[s.kind] = (G.sunk[s.kind] || 0) + 1;
    floatText(s.x, s.y, 24, '撃沈  ￥' + d.score.toLocaleString(), '#ffb43c', 1.4);
    pushLog('■ ' + s.name + ' 撃沈  <b>￥' + d.score.toLocaleString() + ' / 功績+' + d.merit + '</b>', '#5fe3a1');
    /* 漂流兵 */
    const n = clamp(Math.round(s.len / 14), 3, 26);
    for (let i = 0; i < n; i++)
      G.survivors.push({ x: s.x + rnd(-s.len * .4, s.len * .4), y: s.y + rnd(-s.beam, s.beam), life: SURVIVOR_LIFE, max: SURVIVOR_LIFE, bob: rnd(0, TAU) });
    /* ドロップ */
    if (d.drop && Math.random() < (d.dropRate || 1)) dropPart(s.x, s.y, d.drop);
    if (d.superweapon) {
      for (let i = 0; i < 8; i++) setTimeout(() => { if (G.state === 'battle') explode(s.x + rnd(-s.len * .4, s.len * .4), s.y + rnd(-s.beam * 2, s.beam * 2), 6, 26, true); }, i * 180);
      if (d.final) {
        /* 撃沈時に暴走した砲弾をばら撒く */
        for (let i = 0; i < 16; i++) {
          const a = i / 16 * TAU;
          G.shells.push({
            x0: s.x, y0: s.y, z0: 10, x1: s.x + Math.cos(a) * 900, y1: s.y + Math.sin(a) * 900,
            t: 0, tt: 1.4, arc: 0, dmg: 260, pen: 400, side: 'enemy', dir: a, big: true, beam: true
          });
        }
        warn('道連れ', '砲弾が撒かれる — 離脱せよ');
      }
    }
  } else if (s.side === 'friend') {
    pushLog('▼ 味方 ' + s.name + ' 喪失', '#ff5a47');
  }
  if (G.targetId === s.id) G.targetId = null;
}
function dropPart(x, y, partId) {
  G.drops.push({ x, y, partId, life: DROP_LIFE, max: DROP_LIFE, bob: rnd(0, TAU) });
  floatText(x, y, 20, '◆ 兵装を投棄', '#7fd4ff', 1.1);
}

/* ======================================================================
   射撃管制 — 手動 / 自動 / 停止
   ====================================================================== */
function validTargetsFor(s) {
  const out = [];
  for (const o of G.ships) {
    if (!o.alive || o === s) continue;
    if (s.side === 'player' && (o.side === 'enemy' || o.side === 'civil')) out.push(o);
    else if (s.side === 'enemy' && (o.side === 'player' || o.side === 'friend')) out.push(o);
  }
  return out;
}
function canSee(s, o) {
  const d = dist2(s.x, s.y, o.x, o.y);
  if (o.dive > 0.6) return d < (s.detectSub || 0);       // 潜航中はソナーだけ
  return d < (s.detect || 3000) + 1200;
}
/** 迎撃能力を持つ兵装か。機銃・CIWS・対空噴進弾がこれに当たる */
const isAAMount = b => (b.def.intercept || 0) > 0;
/** 空の目標（敵機と噴進弾）。近いものから 1 つ返す。射界と射程も見る */
function airTarget(s, b) {
  const bp = batPos(s, b);
  let best = null, bs = 1e9;
  const consider = (o, kind) => {
    const d = dist2(bp.x, bp.y, o.x, o.y);
    if (d > b.range) return;
    if (!inArc(angTo(bp.x, bp.y, o.x, o.y), s.hdg, b.arcC, b.arcH)) return;
    /* 噴進弾は当たれば痛い。同じ距離なら航空機より先に落とす */
    const score = kind === 'missile' ? d * 0.6 : d;
    if (score >= bs) return;
    bs = score;
    best = { x: o.x, y: o.y, z: o.z, kind, ref: o,
             vx: Math.cos(o.hdg) * (o.spd || 0), vy: Math.sin(o.hdg) * (o.spd || 0) };
  };
  for (const pl of G.planes) if (!pl.dead && pl.side !== s.side) consider(pl, 'plane');
  for (const m of G.missiles) if (m.side !== s.side) consider(m, 'missile');
  return best;
}

function autoTarget(s, b) {
  let best = null, bd = 1e9;
  const bp = batPos(s, b);
  for (const o of validTargetsFor(s)) {
    if (!canSee(s, o)) continue;
    const d = dist2(bp.x, bp.y, o.x, o.y);
    if (d > b.range) continue;
    if (!inArc(angTo(bp.x, bp.y, o.x, o.y), s.hdg, b.arcC, b.arcH)) continue;
    let score = d;
    if (b.cat === 'torp' && o.len < 90) score *= 3;
    if (isAAMount(b)) score *= o.len > 120 ? 4 : 2;        // 迎撃兵装は対艦に向かない
    if ((b.cat === 'gun' || b.cat === 'rocket') && (o.armor || 0) > b.pen) score *= 2.2;
    if (o.dive > 0.6) score *= 4;
    if (score < bd) { bd = score; best = o; }
  }
  return best;
}
/** 照準点の近くにいる敵（手動射撃の偏差計算用） */
function shipNear(x, y, r) {
  let best = null, bd = r;
  for (const o of G.ships) {
    if (!o.alive || (o.side !== 'enemy' && o.side !== 'civil')) continue;
    const d = dist2(x, y, o.x, o.y);
    if (d < bd + o.len * 0.5) { bd = d; best = o; }
  }
  return best;
}
/** 射撃指揮装置による偏差補正の効き（レーダーで上がる） */
function leadAssistOf(s) {
  if (!s.design) return 1;
  let a = 0.15;
  for (const p of s.design.parts) {
    const d = PARTS[p.id];
    if (d.cat === 'radar') a = Math.max(a, d.id === 'radar2' ? 0.85 : 0.45);
  }
  return a;
}

function updateBatteries(s, dt) {
  const isPlayer = s === G.player;
  /* 潜航中は撃てない(撃たれもしない)。浮上の瞬間が唯一の交戦機会 */
  if (s.dive > 0.6) return;
  const fcHealth = clamp(0.4 + 0.6 * (s.quads.bow.hp / s.quads.bow.max), 0.3, 1);
  for (const b of s.batteries) {
    if (b.hp <= 0) { b.target = null; b.why = 'dead'; continue; }
    if (b.reload > 0) b.reload -= dt * (0.6 + 0.4 * fcHealth);

    let aimAt = null, tgt = null, manual = false;
    /* 迎撃兵装は空の目標を最優先で狙う。これが機銃の本業。
       手動のときは照準に従う — 自動にしておけば勝手に落とす、が原則 */
    let air = null;
    if (isAAMount(b) && (isPlayer ? b.mode === 'auto' : s.ai.alerted)) air = airTarget(s, b);
    if (isPlayer) {
      if (b.mode === 'hold') { b.target = null; b.why = 'hold'; continue; }
      if (b.mode === 'manual') {
        manual = true;
        /* 発射管は未来位置に向けて撃つので、照準の近くに目標が要る。
           HUD の雷撃解表示と同じ 400m で拾う */
        const near = shipNear(G.aim.x, G.aim.y, b.cat === 'torp' ? 400 : 260);
        if (near && b.cat !== 'torp') {
          const tv = velOf(near);
          const lp = leadPoint(batPos(s, b).x, batPos(s, b).y, near.x, near.y, tv.vx, tv.vy, b.shellSpeed, 4);
          const k = leadAssistOf(s);
          aimAt = { x: lerp(G.aim.x, lp.x, k), y: lerp(G.aim.y, lp.y, k) };
        } else aimAt = { x: G.aim.x, y: G.aim.y };
        tgt = near;
      } else {
        tgt = autoTarget(s, b);
      }
    } else {
      if (!s.ai.alerted) continue;
      tgt = (s.target && s.target.alive && canSee(s, s.target)) ? s.target : autoTarget(s, b);
    }
    if (air) { tgt = null; manual = false; }
    if (!air && !manual && !tgt) { b.target = null; b.why = 'notgt'; continue; }
    b.target = tgt;                                      // 射界表示などが読むのは水上目標だけ

    const bp = batPos(s, b);
    let want, dist, lp = null;
    if (air) {
      /* 空の目標は未来位置へ。弾道は直射（放物線を描かない） */
      lp = leadPoint(bp.x, bp.y, air.x, air.y, air.vx, air.vy, b.shellSpeed, 3);
      lp.z = air.z;
      want = angTo(bp.x, bp.y, lp.x, lp.y);
      dist = dist2(bp.x, bp.y, lp.x, lp.y);
    } else if (b.cat === 'torp') {
      /* 発射管は舷に据えてあるが、その中で首を振れる（arcH）。
         以前はここで正横に固定していたため、目標を正横 ±7° に入れないと
         永久に撃てなかった。狙うのは砲と同じく未来位置 */
      if (!tgt) { b.why = 'notgt'; b.ang = approachAng(b.ang, s.hdg + b.arcC, b.traverse * dt); continue; }
      const sol = torpSolution(s, b, tgt);
      want = sol.want; dist = sol.d;
    } else if (manual) {
      want = angTo(bp.x, bp.y, aimAt.x, aimAt.y);
      dist = dist2(bp.x, bp.y, aimAt.x, aimAt.y);
    } else {
      const tv = velOf(tgt);
      lp = leadPoint(bp.x, bp.y, tgt.x, tgt.y, tv.vx, tv.vy, b.shellSpeed, 4);
      want = angTo(bp.x, bp.y, lp.x, lp.y);
      dist = dist2(bp.x, bp.y, lp.x, lp.y);
    }
    b.want = want;
    b.ang = approachAng(b.ang, want, b.traverse * (0.5 + 0.5 * fcHealth) * dt);

    const aimed = Math.abs(angN(b.ang - want)) < (b.cat === 'gun' || b.cat === 'sec' || b.cat === 'rocket' ? 0.085 : 0.05);
    const arcOk = inArc(want, s.hdg, b.arcC, b.arcH);
    const rangeOk = dist < b.range;
    /* 撃てない理由をそのまま残す。兵装リストがこれを読んで出す */
    if (b.ammo <= 0) { b.why = 'ammo'; continue; }
    if (b.reload > 0) { b.why = 'reload'; continue; }
    if (!arcOk) { b.why = 'arc'; continue; }
    if (!rangeOk) { b.why = 'range'; continue; }
    if (!aimed) { b.why = 'train'; continue; }
    if (b.cat === 'torp') {
      /* 当たる見込みが薄くても、手動なら撃たせる — 撃つかどうかは艦長の判断。
         自動に任せるときだけ、見込みのある雷撃解を待つ */
      const sol = torpSolution(s, b, tgt);
      if (!manual && !sol.ok) { b.why = 'lead'; continue; }
    }
    /* 手動は引き金を引いている間だけ撃つ */
    if (manual && !G.fire) { b.why = 'trigger'; continue; }
    b.why = 'fire';
    fireBattery(s, b, tgt, manual ? aimAt : (lp || { x: tgt.x, y: tgt.y }), air);
  }
}

/** 雷撃解 — HUD 表示と発射条件で同じ判定を使う。
    `ok` は「当たる見込みがある」であって「撃てる」ではない。
    撃てるかどうかは射界と射程で決まり、見込みは自動射撃だけが待つ */
function torpSolution(s, b, tgt) {
  const bp = batPos(s, b);
  const tv = velOf(tgt);
  const lp = leadPoint(bp.x, bp.y, tgt.x, tgt.y, tv.vx, tv.vy, b.shellSpeed, 5);
  const want = angTo(bp.x, bp.y, lp.x, lp.y);
  const off = angN(want - (s.hdg + b.arcC));          // 舷の正横からの振れ
  const d = dist2(bp.x, bp.y, tgt.x, tgt.y);
  const inArcOk = Math.abs(off) <= b.arcH;
  /* 魚雷が着くまでに相手が進む距離が、相手自身の長さで吸収できる範囲かどうか。
     遅い大物には当たり、速い小物には当たらない — 雷撃の本来の性格そのもの。
     予測が外れる主因は相手の変針で、変針の影響は「進んだ距離」に比例する */
  const run = d / Math.max(1, b.shellSpeed);
  const travel = Math.abs(tgt.spd) * run;
  const catchW = tgt.len * 1.6;
  return { ok: inArcOk && d <= b.range && travel <= catchW,
           want, off, d, inArcOk, travel, catchW, run, lp, bp, dir: want };
}

function fireBattery(s, b, tgt, aimPt, air) {
  const bp = batPos(s, b);
  const isPlayer = s === G.player;
  b.reload = b.reloadMax;
  if (tgt) {
    if (b.lastTgt !== tgt.id || Math.abs(angN((b.lastHdg || 0) - tgt.hdg)) > 0.20) b.salvos = 0;
    b.lastTgt = tgt.id; b.lastHdg = tgt.hdg;
    b.salvos++;
  } else b.salvos = 0;
  if (isPlayer) G.shotCount = (G.shotCount || 0) + 1;

  if (b.cat === 'gun' || b.cat === 'sec' || b.cat === 'rocket' || b.cat === 'aa' || b.cat === 'sam' || b.cat === 'laser') {
    const range = dist2(bp.x, bp.y, aimPt.x, aimPt.y);
    const fq = (isPlayer ? (s.fc || 1) : 0.85);
    const spotted = isPlayer && G.spotTarget && tgt && G.spotTarget === tgt.id;
    const sig = b.cat === 'laser' ? b.disp : dispersion(range, b.disp, fq, b.salvos, spotted);
    if (b.ammo !== Infinity) b.ammo -= b.barrels;
    for (let i = 0; i < b.barrels; i++) {
      const ix = aimPt.x + gauss() * sig, iy = aimPt.y + gauss() * sig;
      const d = dist2(bp.x, bp.y, ix, iy);
      G.shells.push({
        x0: bp.x, y0: bp.y, z0: bp.z, x1: ix, y1: iy,
        z1: air ? aimPt.z : 0,                               // 対空弾は空中で終わる
        t: 0, tt: Math.max(0.12, d / b.shellSpeed),
        arc: (b.cat === 'laser' || air) ? 0 : clamp(d * 0.10, 8, 110),
        dmg: b.dmg, pen: b.pen, side: s.side, owner: s.id, tgtId: tgt ? tgt.id : null,
        big: b.dmg > 200, dir: angTo(bp.x, bp.y, ix, iy), beam: b.cat === 'laser',
        aa: isAAMount(b), air: !!air, intercept: b.def.intercept || 0.5,
        aaR: b.def.aaR || 45
      });
    }
    fx({ k: 'muzzle', x: bp.x, y: bp.y, z: bp.z, a: b.ang, life: 0.14, max: 0.14, big: b.dmg > 200 });
    if (isPlayer) shakeAdd(b.dmg > 400 ? 3 : b.dmg > 120 ? 1.6 : 0.6);
    (b.cat === 'laser' ? SFX.laser : b.dmg > 400 ? SFX.gunL : b.dmg > 60 ? SFX.gunM : isAAMount(b) ? SFX.aa : SFX.gunS)();
  }
  else if (b.cat === 'missile') {
    b.ammo -= 1;
    for (let i = 0; i < b.barrels; i++) {
      G.missiles.push({
        x: bp.x, y: bp.y, z: bp.z + 4, hdg: b.ang + (i - (b.barrels - 1) / 2) * 0.14, spd: 90,
        tgtId: tgt ? tgt.id : null, dmg: b.dmg, pen: b.pen, side: s.side, life: 26, hp: 1, trail: 0
      });
    }
    SFX.ssm();
    if (!isPlayer) warn('噴進弾 接近', '機銃で迎撃せよ');
  }
  else if (b.cat === 'torp') {
    b.ammo -= b.barrels;
    /* 発射管がいま向いている方向へ出す。まとめて 1 本の線にすると
       当たるときは全部当たり、外すときは全部外す。扇に開いて機会を作る */
    const dir = b.ang;
    const n = b.barrels;
    const fan = tgt ? torpFanHalf(tgt.len, dist2(bp.x, bp.y, tgt.x, tgt.y)) : 0.06;
    for (let i = 0; i < n; i++) {
      const t = n > 1 ? (i - (n - 1) / 2) / ((n - 1) / 2) : 0;
      const along = (i - (n - 1) / 2) * 7;
      const st = worldOf(s, b.px + along, (s.beam / 2) * (b.side || 1), 2);
      G.torps.push({
        x: st.x, y: st.y, hdg: dir + t * fan + rnd(-0.01, 0.01), spd: b.shellSpeed,
        dmg: b.dmg, side: s.side, life: b.range / b.shellSpeed, wake: 0, armT: 0.5
      });
    }
    SFX.torp();
    if (isPlayer) { shakeAdd(2); pushLog('雷跡 — ' + (b.side > 0 ? '右舷' : '左舷') + '発射', '#7fd4b0'); }
    else warn('雷跡発見', '回避せよ');
  }
}

/* ======================================================================
   投射体
   ====================================================================== */
function shellPos(sh) {
  const u = clamp(sh.t / sh.tt, 0, 1);
  return {
    x: lerp(sh.x0, sh.x1, u), y: lerp(sh.y0, sh.y1, u),
    z: lerp(sh.z0, sh.z1 || 0, u) + sh.arc * 4 * u * (1 - u)
  };
}
function updateShells(dt) {
  for (let i = G.shells.length - 1; i >= 0; i--) {
    const sh = G.shells[i];
    sh.t += dt;
    /* 機銃弾は飛行中に航空機と噴進弾を落とす。これが機銃の本業 */
    if (sh.aa) {
      const p = shellPos(sh);
      let killed = false;
      for (const pl of G.planes) {
        if (pl.side === sh.side || pl.dead) continue;
        if (Math.hypot(pl.x - p.x, pl.y - p.y) < (sh.aaR || 45) && Math.abs(pl.z - p.z) < (sh.aaR || 45)) {
          if (Math.random() < sh.intercept) {
            pl.hp -= 1;
            if (pl.hp <= 0) {
              pl.dead = true; explode(pl.x, pl.y, pl.z, 10, false);
              if (sh.side === 'player') {
              floatText(pl.x, pl.y, pl.z + 8, '撃墜', '#7fd4ff', 1.0);
              G.money += 60; G.planeKills = (G.planeKills || 0) + 1;
            }
            }
          }
          killed = true; break;
        }
      }
      if (!killed) for (let mi = G.missiles.length - 1; mi >= 0; mi--) {
        const m = G.missiles[mi];
        if (m.side === sh.side) continue;
        if (Math.hypot(m.x - p.x, m.y - p.y) < (sh.aaR || 45) && Math.abs(m.z - p.z) < (sh.aaR || 45)) {
          if (Math.random() < sh.intercept) {
            explode(m.x, m.y, m.z, 10, false);
            if (sh.side === 'player') { floatText(m.x, m.y, m.z + 8, '迎撃', '#7fd4ff', 1.0); G.money += 40; }
            G.missiles.splice(mi, 1);
          }
          killed = true; break;
        }
      }
      if (killed) { G.shells.splice(i, 1); continue; }
    }
    if (sh.t < sh.tt) continue;
    G.shells.splice(i, 1);
    /* 対空弾は空中で自爆する。海面の艦には当たらない */
    if (sh.air) { fx({ k: 'spark', x: sh.x1, y: sh.y1, z: sh.z1 || 0, life: 0.25, max: 0.25, r: 5, col: '#cfe6f2' }); continue; }
    let hit = null;
    for (const o of G.ships) {
      if (!o.alive || o.side === sh.side) continue;
      if (o.dive > 0.6) continue;                       // 潜航中には当たらない
      const { lx, ly } = localOf(o, sh.x1, sh.y1);
      if (hitsHull(lx, ly, o.len * 1.02, o.beam * 1.25)) { hit = o; break; }
    }
    if (hit) applyDamage(hit, sh.dmg * (sh.aa ? AA_SHIP_MULT : 1), sh.pen, sh.x1, sh.y1, sh.dir,
      sh.fireChance !== undefined ? { fireChance: sh.fireChance } : {});
    else if (onLand(G.islands, sh.x1, sh.y1)) {
      /* 島に落ちた弾は土煙を上げるだけ。島は遮蔽になる */
      explode(sh.x1, sh.y1, 4, sh.big ? 16 : 9, false);
      smoke(sh.x1, sh.y1, 6, 1, '#4a4038');
    } else {
      splash(sh.x1, sh.y1, sh.big);
      /* 至近弾: 舷側で炸裂した弾片と水中衝撃 */
      let near = null, nd = 1e9;
      for (const o of G.ships) {
        if (!o.alive || o.side === sh.side || o.dive > 0.6) continue;
        const d = dist2(o.x, o.y, sh.x1, sh.y1);
        if (d < o.beam * 1.3 + 10 && d < nd) { nd = d; near = o; }
      }
      if (near) applyDamage(near, sh.dmg * 0.25 * (sh.aa ? AA_SHIP_MULT : 1), 999, sh.x1, sh.y1, sh.dir,
        { fireChance: 0.05, showDmg: false });
      /* 至近弾は潜航中の目標にも効く */
      for (const o of G.ships) {
        if (!o.alive || o.side === sh.side || o.dive <= 0.6) continue;
        if (dist2(o.x, o.y, sh.x1, sh.y1) < 45)
          applyDamage(o, sh.dmg * 0.25, 999, sh.x1, sh.y1, sh.dir, { underwater: true, showDmg: false });
      }
      const t = G.ships.find(o => o.id === sh.tgtId);
      if (t && t.alive && sh.side === 'player' && dist2(sh.x1, sh.y1, t.x, t.y) < t.len * 0.75)
        floatText(sh.x1, sh.y1, 4, '挟叉', '#7fd4ff', 0.75);
    }
  }
}
function updateMissiles(dt) {
  for (let i = G.missiles.length - 1; i >= 0; i--) {
    const m = G.missiles[i];
    m.life -= dt;
    if (m.life <= 0) { G.missiles.splice(i, 1); continue; }
    m.spd = Math.min(300, m.spd + 260 * dt);
    if (m.z < 22) m.z += 12 * dt;
    const tgt = G.ships.find(o => o.id === m.tgtId && o.alive);
    if (tgt) {
      const tv = velOf(tgt);
      const lp = leadPoint(m.x, m.y, tgt.x, tgt.y, tv.vx, tv.vy, m.spd, 3);
      m.hdg = approachAng(m.hdg, angTo(m.x, m.y, lp.x, lp.y), 1.5 * dt);
    }
    m.x += Math.cos(m.hdg) * m.spd * dt;
    m.y += Math.sin(m.hdg) * m.spd * dt;
    m.trail -= dt;
    if (m.trail <= 0) { m.trail = 0.05; smoke(m.x, m.y, m.z, 1, '#5a6570'); }
    /* 島に突っ込めばそこで終わり。低空を這う弾なので山は越えない */
    if (onLand(G.islands, m.x, m.y)) {
      explode(m.x, m.y, 6, 18, false);
      smoke(m.x, m.y, 8, 1, '#4a4038');
      G.missiles.splice(i, 1); continue;
    }
    for (const o of G.ships) {
      if (!o.alive || o.side === m.side || o.dive > 0.6) continue;
      const { lx, ly } = localOf(o, m.x, m.y);
      if (hitsHull(lx, ly, o.len, o.beam * 1.2)) {
        applyDamage(o, m.dmg, m.pen, m.x, m.y, m.hdg, { fireChance: 0.5 });
        explode(m.x, m.y, 8, 22, true);
        G.missiles.splice(i, 1);
        break;
      }
    }
  }
}
function updateTorps(dt) {
  for (let i = G.torps.length - 1; i >= 0; i--) {
    const tp = G.torps[i];
    tp.life -= dt; tp.armT -= dt;
    if (tp.life <= 0) { G.torps.splice(i, 1); continue; }
    tp.x += Math.cos(tp.hdg) * tp.spd * dt;
    tp.y += Math.sin(tp.hdg) * tp.spd * dt;
    tp.wake -= dt;
    if (tp.wake <= 0) {
      tp.wake = 0.16;
      G.wakes.push({ x: tp.x, y: tp.y, r: 2.5, life: 3.2, max: 3.2, grow: 3.4, torp: true });
      if (G.wakes.length > 320) G.wakes.shift();
    }
    /* 島は遮蔽。砲弾が抜けないのに魚雷だけ通り抜けるのはおかしい */
    if (onLand(G.islands, tp.x, tp.y)) {
      splash(tp.x, tp.y, false);
      smoke(tp.x, tp.y, 4, 1, '#4a4038');
      G.torps.splice(i, 1); continue;
    }
    if (tp.armT > 0) continue;
    for (const o of G.ships) {
      if (!o.alive || o.side === tp.side) continue;
      const { lx, ly } = localOf(o, tp.x, tp.y);
      if (hitsHull(lx, ly, o.len, o.beam * 1.1)) {
        applyDamage(o, tp.dmg, 999, tp.x, tp.y, tp.hdg, { underwater: true });
        explode(tp.x, tp.y, 0, 34, true);
        fx({ k: 'column', x: tp.x, y: tp.y, h: 70, life: 1.6, max: 1.6, r: 20 });
        if (o === G.player) warn('魚雷命中', '浸水 — 区画を確認');
        else if (tp.side === 'player') { floatText(tp.x, tp.y, 30, '雷撃命中!', '#7fd4b0', 1.4); G.torpHits = (G.torpHits || 0) + 1; }
        G.torps.splice(i, 1);
        break;
      }
    }
  }
}

/* ======================================================================
   艦載機 — プレイヤーが出せる命令は「発艦」と「着艦」だけ
   ====================================================================== */
function launchPlanes(s) {
  if (!s.catapult || s.planesReady <= 0) { SFX.ng(); return; }
  const n = s.planesReady;
  for (let i = 0; i < n; i++) {
    const w = worldOf(s, s.catapult.px, s.catapult.py, 14);
    G.planes.push({
      /* 1 発で落ちると、迎撃兵装の優劣が「撃てるか」だけになって差が出ない。
         数発を要するようにして、弾幕の厚さ＝迎撃率×発射速度 が効くようにする */
      x: w.x, y: w.y, z: 14, hdg: s.hdg, spd: 60, side: s.side, hp: PLANE_HP,
      state: 'out', t: 0, orbit: rnd(0, TAU), home: s, dead: false, bombT: rnd(2, 5)
    });
  }
  s.planesReady = 0;
  SFX.plane();
  pushLog('◆ 艦載機 ' + n + ' 機 発艦', '#7fd4ff');
}
function recallPlanes(s) {
  let n = 0;
  for (const p of G.planes) if (p.home === s && !p.dead && p.state !== 'return') { p.state = 'return'; n++; }
  if (n) { pushLog('艦載機 ' + n + ' 機 帰投指示', '#7fd4ff'); SFX.sel(); } else SFX.ng();
}
function updatePlanes(dt) {
  G.spotTarget = null;
  for (let i = G.planes.length - 1; i >= 0; i--) {
    const p = G.planes[i];
    if (p.dead) { G.planes.splice(i, 1); continue; }
    p.t += dt;
    /* 母艦を失った機は帰る場所がない。しばらくで力尽きる */
    if (!p.home || !p.home.alive) {
      p.orphan = (p.orphan || 0) + dt;
      if (p.orphan > 12) { p.dead = true; smoke(p.x, p.y, p.z, 3, '#4a4038'); continue; }
    }
    p.z = lerp(p.z, p.state === 'return' ? 20 : 90, clamp(dt * 0.6, 0, 1));
    let tx, ty;
    if (p.state === 'return') {
      if (!p.home || !p.home.alive) { p.dead = true; continue; }
      tx = p.home.x; ty = p.home.y;
      if (dist2(p.x, p.y, tx, ty) < 90) {
        p.dead = true;
        if (p.home.planesReady !== undefined) p.home.planesReady++;
        if (p.home === G.player) pushLog('艦載機 着艦', '#7fd4ff');
        continue;
      }
    } else {
      /* 目標に貼り付いて弾着観測 + 爆撃 */
      const foes = G.ships.filter(o => o.alive && o.side !== p.side && o.side !== 'friend' && o.dive < 0.6);
      let best = null, bd = 1e9;
      for (const o of foes) { const d = dist2(p.x, p.y, o.x, o.y); if (d < bd) { bd = d; best = o; } }
      if (!best) { if (!p.home) { p.dead = true; continue; } tx = p.home.x; ty = p.home.y; }
      else {
        /* 旋回する照準点は、機が追いつける速さで回さないといけない。
           0.8rad/s × 半径 170m は接線速度 136m/s — 62m/s の機は永久に追いつけず、
           結果として投弾距離 260m まで一度も寄れなかった */
        p.orbit += dt * (p.spd * 0.55) / 170;
        tx = best.x + Math.cos(p.orbit) * 170; ty = best.y + Math.sin(p.orbit) * 170;
        if (p.side === 'player' && bd < 330) G.spotTarget = best.id;
        p.bombT -= dt;
        if (p.bombT <= 0 && bd < 260) {
          p.bombT = rnd(6, 10);
          const tv = velOf(best);
          const lp = leadPoint(p.x, p.y, best.x, best.y, tv.vx, tv.vy, 120, 3);
          G.shells.push({
            x0: p.x, y0: p.y, z0: p.z, x1: lp.x + gauss() * 22, y1: lp.y + gauss() * 22,
            /* 落とし損ねた 1 機が痛い、という重さでないと防空を積む理由が出ない */
            t: 0, tt: 1.6, arc: 20, dmg: 260, pen: 55, side: p.side, dir: p.hdg, big: true,
            fireChance: 0.4
          });
        }
      }
    }
    const a = angTo(p.x, p.y, tx, ty);
    p.hdg = approachAng(p.hdg, a, 1.9 * dt);
    p.x += Math.cos(p.hdg) * p.spd * dt;
    p.y += Math.sin(p.hdg) * p.spd * dt;
    /* 燃料 */
    if (p.t > 150 && p.state !== 'return') p.state = 'return';
  }
  /* 敵空母の発艦 */
  for (const s of G.ships) {
    if (!s.alive || !s.carrier || !s.ai || !s.ai.alerted) continue;
    s.planeT -= dt;
    if (s.planeT <= 0 && G.planes.filter(p => p.home === s).length < s.carrier) {
      s.planeT = rnd(14, 22);
      const w = worldOf(s, s.len * 0.2, 0, 14);
      G.planes.push({ x: w.x, y: w.y, z: 14, hdg: s.hdg, spd: 62, side: 'enemy', hp: PLANE_HP, state: 'out', t: 0, orbit: rnd(0, TAU), home: s, bombT: rnd(3, 7) });
    }
  }
}

/* ======================================================================
   漂流兵 / 応急修理 / ドロップ回収
   ====================================================================== */
/** 応急班の再編成。撃沈に頼らずとも、待てば必ず 1 回は戻ってくる */
function updateDamageControl(s, dt) {
  if (!s || !s.alive) return;
  const dc = s.dc || { cooldown: REPAIR_COOLDOWN, maxRepairs: REPAIR_MAX, dcMult: 1 };
  if (s.repairs >= dc.maxRepairs) { s.repairT = dc.cooldown; return; }
  s.repairT = (s.repairT === undefined ? dc.cooldown : s.repairT) - dt;
  if (s.repairT <= 0) {
    s.repairs++;
    s.repairT = dc.cooldown;
    if (s === G.player) { SFX.repair(); pushLog('◆ 応急班 再編成 — 応急修理 +1', '#5fe3a1'); }
  }
}

function updatePickups(dt) {
  const p = G.player;
  if (!p || !p.alive) return;
  updateDamageControl(p, dt);
  for (let i = G.survivors.length - 1; i >= 0; i--) {
    const s = G.survivors[i];
    s.life -= dt; s.bob += dt * 2;
    if (s.life <= 0) { G.survivors.splice(i, 1); continue; }
    const d = dist2(s.x, s.y, p.x, p.y);
    if (d < SURVIVOR_R) {
      G.survivors.splice(i, 1);
      p.survivors++;
      SFX.rescue();
      /* 収容した瞬間に少しだけ塞がる。前に出て拾う行為が即座に報われる */
      const q = worstQuad(p), k = p.quads[q];
      const heal = k.max * SURVIVOR_HEAL;
      if (k.hp > 0 && k.hp < k.max) {
        k.hp = Math.min(k.max, k.hp + heal);
        floatText(s.x, s.y, 8, '+' + Math.round(heal) + ' ' + QUAD_JA[q], '#7fd4b0', 0.8);
      } else floatText(s.x, s.y, 8, '救助', '#7fd4ff', 0.8);
      /* 収容した乗員はそのまま応急班に加わる。次の修理までの待ちが縮む */
      p.repairT = Math.max(0, (p.repairT || 0) - SURVIVOR_COOLDOWN_CUT);
      if (p.survivors % SURVIVORS_PER_REPAIR === 0 && p.repairs < (p.dc ? p.dc.maxRepairs : REPAIR_MAX)) {
        p.repairs++;
        warn('応急修理 +1', '漂流兵 ' + p.survivors + ' 名 収容', true);
        SFX.repair();
      }
    }
  }
  for (let i = G.drops.length - 1; i >= 0; i--) {
    const d = G.drops[i];
    d.life -= dt; d.bob += dt * 3;
    if (d.life <= 0) { G.drops.splice(i, 1); continue; }
    if (dist2(d.x, d.y, p.x, p.y) < DROP_R) {
      G.drops.splice(i, 1);
      G.gotParts.push(d.partId);
      SFX.pick();
      floatText(p.x, p.y, 26, '◆ ' + PARTS[d.partId].name + ' 入手', '#ffb43c', 1.2);
      pushLog('◆ 非売品 <b>' + PARTS[d.partId].name + '</b> を回収', '#ffb43c');
    }
  }
}
/** 応急修理。区画を指定しなければ最も傷んだ区画を直す */
function doRepair(quad) {
  const p = G.player;
  if (!p || !p.alive) return;
  if (p.repairs <= 0) {
    SFX.ng();
    pushLog('応急班が戻るまで あと ' + Math.ceil(p.repairT || 0) + ' 秒', '#ff5a47');
    return;
  }
  const q = quad && p.quads[quad] ? quad : worstQuad(p);
  const k = p.quads[q];
  if (k.hp >= k.max && !k.fire && !k.flood) { SFX.ng(); pushLog(QUAD_JA[q] + ' は健在', '#ff5a47'); return; }
  p.repairs--;
  k.hp = Math.min(k.max, k.hp + k.max * 0.42);
  k.fire = 0; k.fireT = 0; k.flood = Math.max(0, k.flood - 0.6); k.floodT = 0;
  SFX.repair();
  floatText(p.x, p.y, 30, QUAD_JA[q] + ' 応急修理', '#5fe3a1', 1.2);
  pushLog('◆ ' + QUAD_JA[q] + ' 応急修理（残り ' + p.repairs + ' 回）', '#5fe3a1');
}

/* ======================================================================
   敵AI
   ====================================================================== */
const AI_RANGE = {
  torpboat: 380, destroyer: 1100, clight: 1400, cheavy: 1700, battleship: 2000,
  carrier: 2600, submarine: 1200, transport: 2600,

  }

       痩せた向きでは沖にいるのに後進を続けてしまう */

      s.tele = 3;
    }
    return;
  }

  if (!foes.length) { s.tele = 3; return; }
  let tg = s.target && s.target.alive && foes.includes(s.target) ? s.target : null;
  if (!tg || a.think <= 0) {

  if (hp < 0.22 && !s.superweapon) { s.course = angN(brg + Math.PI); s.tele = 5; return; }

  a.orbitT = (a.orbitT || 0) - dt;
  if (a.orbitT <= 0) { a.orbitT = rnd(6, 12); if (Math.random() < 0.3) a.orbit *= -1; }

    }
  }
  for (const m of G.missiles) {
    const p = P(m.x, m.y, m.z), t = P(m.x - Math.cos(m.hdg) * 26, m.y - Math.sin(m.hdg) * 26, m.z);
    ctx.strokeStyle = m.side === 'player' ? '#ffcf8a' : '#ff8a6a';
    ctx.lineWidth = 2.4;
    ctx.beginPath(); ctx.moveTo(t.x, t.y); ctx.lineTo(p.x, p.y); ctx.stroke();
  }
  for (const tp of G.torps) {
    const p = P(tp.x, tp.y, 0.5);
    ctx.fillStyle = tp.side === 'player' ? '#7fd4b0' : '#ff9a7a';
    ctx.save(); ctx.translate(p.x, p.y);
    ctx.beginPath(); ctx.ellipse(0, 0, 4.5 * cam.zoom * 2.2 + 1.5, 2 * cam.zoom * 2.2 + 1, 0, 0, TAU); ctx.fill();
    ctx.restore();
  }
}
function drawTexts() {
  ctx.textAlign = 'center';
  for (const x of G.texts) {
    const a = clamp(x.life * 1.4, 0, 1);
    const p = P(x.x, x.y, x.z + (1.2 - x.life) * 26);
    ctx.globalAlpha = a;
    ctx.fillStyle = x.col;
    ctx.font = '700 ' + Math.round(13 * x.scale) + 'px Oxanium, Rajdhani, system-ui, sans-serif';
    ctx.fillText(x.txt, p.x, p.y);
  }
  ctx.globalAlpha = 1; ctx.textAlign = 'left';
}

/* ======================================================================
   艦の描画
   ====================================================================== */
const CONT_COLS = ['#8a5535', '#37607d', '#4a6b4a', '#7d6a3a', '#5c4a63', '#6d3f3a', '#3f5f6d'];
const CAT_COL = {
  gun: '#8e9aa2', sec: '#9aa6ae', rocket: '#c08058', aa: '#a8bcc6', sam: '#b6c8d6', torp: '#7fd4b0', missile: '#c9a86a',
  laser: '#9fd8ff', boiler: '#6b5a4a', turbine: '#7a6a52', bridge: '#b7c4cb',
  radar: '#8fbfd0', sonar: '#7fa0b8', catapult: '#7f93a0', hangar: '#66757f', dc: '#7fb8a0', cargo: null
};

function drawTurret(cx, cy, ang, dz, heel, size, col, barrels, blen) {
  const oct = [];
  for (let i = 0; i < 8; i++) oct.push({ x: Math.cos(i / 8 * TAU) * size, y: Math.sin(i / 8 * TAU) * size });
  const h = size * 0.85;
  prism(cx, cy, ang, oct, dz, dz + h, tint(col, 1.12), col, heel);
  const n = Math.min(barrels || 1, 3), bl = blen || size * 2.4;
  for (let i = 0; i < n; i++) {
    const off = (i - (n - 1) / 2) * size * 0.42;
    const c = Math.cos(ang), sn = Math.sin(ang);
    const bx = cx + (size * 0.2) * c - off * sn, by = cy + (size * 0.2) * sn + off * c;
    prism(bx + Math.cos(ang) * bl / 2, by + Math.sin(ang) * bl / 2, ang,
      [{ x: bl / 2, y: -size * 0.13 }, { x: bl / 2, y: size * 0.13 }, { x: -bl / 2, y: size * 0.13 }, { x: -bl / 2, y: -size * 0.13 }],
      dz + h * 0.45, dz + h * 0.75, '#aab6bd', '#7d8a92', heel);
  }
}

function drawShip(s) {
  const heel = s.list * Math.PI / 180 * 0.55;
  const hullH = clamp(s.beam * 0.42, 5, 20);
  const dead = !s.alive;
  const sinkZ = (dead ? -clamp((3.2 - s.deathT) * 4, 0, 16) : 0) + (s.z || 0);
  const flash = s.hitFlash > 0;
  const submerged = s.dive > 0.55;

  if (submerged && s.side !== 'player') {
    /* 潜航中: ソナー圏内だけ影として見える */
    const seen = G.player && G.player.detectSub && dist2(s.x, s.y, G.player.x, G.player.y) < G.player.detectSub;
    if (!seen) return;
    ctx.globalAlpha = 0.34;
  }

  const outline = hullOutline(s.len, s.beam);
  fillWorldPoly(toWorld(s.x, s.y, s.hdg, hullOutline(s.len * 1.10, s.beam * 1.55)), 0, 'rgba(2,9,13,.42)');
  if (s.alive && !submerged) {
    const foam = 0.10 + clamp(s.spd / Math.max(1, s.maxSpd), 0, 1) * 0.26;
    fillWorldPoly(toWorld(s.x, s.y, s.hdg, hullOutline(s.len * 1.06, s.beam * 1.32)), 0, null, 'rgba(178,220,238,' + foam + ')', 1.4);
  }

  const base = s.side === 'player' ? { side: '#3f4c56', top: '#5b6a75' }
    : s.side === 'civil' ? { side: '#42484c', top: '#585f63' }
      : s.superweapon ? { side: '#2b3a34', top: '#3d5049' }
        : { side: '#333f47', top: '#47555e' };
  const topPts = prism(s.x, s.y, s.hdg, outline, sinkZ, sinkZ + hullH,
    flash ? '#c9d4da' : base.top, flash ? '#aebac2' : base.side, heel);
  ctx.beginPath();
  for (let i = 0; i < topPts.length; i++) {
    const p = P(topPts[i].x, topPts[i].y, sinkZ + hullH);
    i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y);
  }
  ctx.closePath(); ctx.strokeStyle = 'rgba(8,14,18,.85)'; ctx.lineWidth = 1.2; ctx.stroke();

  const dz = sinkZ + hullH;
  if (s.side === 'player') drawDesignDeck(s, dz, heel);
  else drawEnemyDeck(s, dz, heel);

  /* 火災 */
  for (const q of QUADS) {
    const k = s.quads[q];
    if (k.fire > 0.05 && s.alive) {
      const w = quadWorld(s, q, dz + 4);
      const p = P(w.x, w.y, w.z);
      const r = (6 + k.fire * 14) * cam.zoom * 2.2;
      const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, r);
      g.addColorStop(0, 'rgba(255,220,140,.85)'); g.addColorStop(0.5, 'rgba(255,130,50,.55)');
      g.addColorStop(1, 'rgba(255,80,30,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, TAU); ctx.fill();
    }
  }
  if (s.spd > 2 && s.alive && !submerged) {
    const bw = worldOf(s, s.len * 0.46, 0, 0), p = P(bw.x, bw.y, 0);
    ctx.globalAlpha *= clamp(s.spd / s.maxSpd, 0, 1) * 0.5;
    ctx.strokeStyle = '#bfe4f2'; ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.moveTo(p.x - 9 * cam.zoom * 3, p.y + 2); ctx.lineTo(p.x, p.y - 2); ctx.lineTo(p.x + 9 * cam.zoom * 3, p.y + 2);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

/** 自艦: 設計グリッドのとおりに積荷と兵装を描く */
/* 船楼(アイランド)の高さ。ここに載る物はこのぶん持ち上がる */
const HOUSE_H = 3.4;

/** 設計から艦影を起こして、別のキャンバスへ 1 枚だけ描く。
    カメラは固定 — 艦の全長がちょうど収まる位置と縮尺を毎回計算する */
function drawShipPreview(canvas, design) {
  if (!canvas || validateDesign(design).length) return false;
  const hull = HULLS[design.hull];
  const w = canvas.clientWidth || 460, h = canvas.clientHeight || 200;
  if (!w || !h) return false;
  const dpr = Math.min(devicePixelRatio || 1, 2);
  canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);

  const s = buildPlayerShip(design, 0, 0, -Math.PI * 0.16);   // 斜め後方から見る向き
  s.spd = 0; s.list = 0; s.tele = TELE_STOP;
  for (const b of s.batteries) b.ang = s.hdg + 0.35;

  /* 全長・全幅・上部構造が枠に収まる縮尺 */
  const L = hull.len, B = hull.beam, Hh = 46;
  const spanX = (L + B) * ISO_SX, spanY = (L + B) * ISO_SY + Hh * ISO_SZ;
  const zoom = Math.min(w * 0.92 / spanX, h * 0.90 / spanY);

  const keep = { c: ctx, w: W, h: H, x: cam.x, y: cam.y, z: cam.zoom };
  ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  W = w; H = h;
  cam.x = 0; cam.y = 0; cam.zoom = zoom;
  ctx.clearRect(0, 0, w, h);
  const g = ctx.createLinearGradient(0, 0, 0, h);
  g.addColorStop(0, '#0a1d26'); g.addColorStop(1, '#050f16');
  ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
  /* 上部構造のぶん絵が上に寄るので、その半分だけ下げて枠の中央に置く */
  ctx.translate(0, Hh * ISO_SZ * zoom * 0.42);
  /* 海面のあたりを薄く敷いて、浮かんでいることが分かるようにする */
  ctx.strokeStyle = 'rgba(52,104,126,.16)'; ctx.lineWidth = 1;
  ctx.beginPath();
  for (let i = -6; i <= 6; i++) {
    const a = P(i * 40, -900, 0), b = P(i * 40, 900, 0);
    ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y);
    const c = P(-900, i * 40, 0), d = P(900, i * 40, 0);
    ctx.moveTo(c.x, c.y); ctx.lineTo(d.x, d.y);
  }
  ctx.stroke();
  drawShip(s);
  ctx = keep.c; W = keep.w; H = keep.h;
  cam.x = keep.x; cam.y = keep.y; cam.zoom = keep.z;
  return true;
}

/** 船体そのものの造作 — 船首楼・船尾楼・船楼の基部・ハッチコーミング・煙突 */
function drawHullStructure(s, dz, heel) {
  const hull = HULLS[s.design.hull];
  const cellL = hull.len * DECK_L / hull.cols, cellW = hull.beam * DECK_W / hull.rows;
  const colX = c => (c - hull.cols / 2) * cellL;      // 列 c の艦尾側の端
  const halfW = hull.rows * cellW / 2;
  const bowX = hull.len * 0.46, sternX = -hull.len * 0.46;

  /* 船首楼 — グリッドより前は一段高い甲板。細くなる船首をここで表す */
  {
    const x0 = colX(hull.cols);
    box(s.x, s.y, s.hdg, (x0 + bowX) / 2, 0, (bowX - x0) / 2, halfW * 0.72, dz, dz + 2.4, '#5c6973', '#3c464e', heel);
    box(s.x, s.y, s.hdg, (x0 + bowX) / 2 + (bowX - x0) * 0.18, 0, (bowX - x0) * 0.24, halfW * 0.34,
      dz + 2.4, dz + 5.0, '#6b7883', '#46515a', heel);
  }
  /* 船尾楼 */
  {
    const x0 = colX(0);
    box(s.x, s.y, s.hdg, (x0 + sternX) / 2, 0, (x0 - sternX) / 2, halfW * 0.86, dz, dz + 2.2, '#57646e', '#39434b', heel);
  }

  for (const r of zoneRuns(hull)) {
    const x0 = colX(r.a), x1 = colX(r.b + 1);
    const cx = (x0 + x1) / 2, hl = (x1 - x0) / 2;
    if (r.z === 'C') {
      /* 積載区画: 舷側のハッチコーミングとベイ境界の横桁。船首の絞りに沿って狭まる */
      const wAt = px => Math.min(halfW, hullHalfBeam(hull.len, hull.beam, px) - 0.9);
      for (let c = r.a; c <= r.b; c++) {
        const a0 = colX(c), a1 = colX(c + 1), mid = (a0 + a1) / 2;
        const w = wAt(a1);
        if (w <= 0.6) continue;
        for (const sgn of [-1, 1])
          box(s.x, s.y, s.hdg, mid, sgn * (w + 0.7), (a1 - a0) / 2, 0.7, dz, dz + 1.8, '#5e6b76', '#3a444c', heel);
        box(s.x, s.y, s.hdg, a0, 0, 0.32, Math.max(0.6, wAt(a0)), dz, dz + 1.0, '#4d5964', '#333c44', heel);
      }
      const wEnd = wAt(colX(r.b + 1));
      if (wEnd > 0.6) box(s.x, s.y, s.hdg, colX(r.b + 1), 0, 0.32, wEnd, dz, dz + 1.0, '#4d5964', '#333c44', heel);
      continue;
    }
    /* 船楼: 全幅ひと続きの基部。艦橋も機関もこの上に載る */
    box(s.x, s.y, s.hdg, cx, 0, hl, halfW + 0.8, dz, dz + HOUSE_H, '#6a7681', '#414b53', heel);
    /* 舷側の通路 */
    for (const sgn of [-1, 1])
      box(s.x, s.y, s.hdg, cx, sgn * (halfW + 1.1), hl * 0.94, 0.5, dz + HOUSE_H, dz + HOUSE_H + 1.1,
        '#82909b', '#59636c', heel);
  }

  /* 煙突 — 積んだ機関の真上に 1 本だけ立てる。太さと高さは出力で決まる */
  const mach = s.design.parts.filter(q => PARTS[q.id].power);
  if (mach.length) {
    const power = mach.reduce((a, q) => a + PARTS[q.id].power, 0);
    const fx0 = mach.reduce((a, q) => a + cellToLocal(s.design, q).px, 0) / mach.length;
    const k = clamp(power / 6000, 0.55, 1.7);
    const fw = clamp(cellL * 0.42, 2.0, 5.2), fd = clamp(halfW * 0.26, 1.8, 4.4) * k;
    const h0 = dz + HOUSE_H, h1 = h0 + 9 + 7 * k;
    box(s.x, s.y, s.hdg, fx0, 0, fw, fd, h0, h1 - 2.6, '#5a5048', '#39322c', heel);
    box(s.x, s.y, s.hdg, fx0, 0, fw * 1.04, fd * 1.06, h1 - 2.6, h1 - 0.9, '#8f6a4a', '#5e4530', heel);
    box(s.x, s.y, s.hdg, fx0, 0, fw * 1.14, fd * 1.12, h1 - 0.9, h1 + 0.5, '#20262a', '#141a1d', heel);
    if (s.alive && s.spd > 1.2 && Math.random() < 0.03 + clamp(s.spd / Math.max(1, s.maxSpd), 0, 1) * 0.08) {
      const w = worldOf(s, fx0, 0, 0);
      smoke(w.x, w.y, h1 + 2, 1, '#39434b');
    }
    /* 無人運航船体は艦橋を持たない。機関区の上の一体型センサ塔がその代わり */
    if (hull.bridgeless) {
      const mx = fx0 + cellL * 1.1;
      box(s.x, s.y, s.hdg, mx, 0, cellL * 0.30, halfW * 0.22, dz + HOUSE_H, dz + HOUSE_H + 7, '#78848d', '#4b545b', heel);
      box(s.x, s.y, s.hdg, mx, 0, cellL * 0.16, halfW * 0.12, dz + HOUSE_H + 7, dz + HOUSE_H + 15, '#9db0bb', '#606c75', heel);
      const w = worldOf(s, mx, 0, 0);
      const c = P(w.x, w.y, dz + HOUSE_H + 16);
      ctx.strokeStyle = 'rgba(159,208,224,.75)'; ctx.lineWidth = 1.3;
      ctx.beginPath(); ctx.arc(c.x, c.y, 3.4 + Math.sin(G.t * 3) * 1.1, 0, TAU); ctx.stroke();
    }
  }
}

function drawDesignDeck(s, dz, heel) {
  const design = s.design, hull = HULLS[design.hull];
  const cellL = hull.len * DECK_L / hull.cols, cellW = hull.beam * DECK_W / hull.rows;
  drawHullStructure(s, dz, heel);
  for (const p of design.parts) {
    const d = PARTS[p.id];
    const loc = cellToLocal(design, p);
    const hl = d.w * cellL / 2 - 0.8, hw = d.h * cellW / 2 - 0.8;
    /* 船楼に載る物は基部のぶん持ち上がる */
    const dz0 = dz + (zoneAt(hull, p.x) === 'C' ? 0 : HOUSE_H);
    if (d.cat === 'cargo') {
      const seed = Math.abs(Math.round(p.x * 7 + p.y * 3)) % CONT_COLS.length;
      box(s.x, s.y, s.hdg, loc.px, loc.py, hl, hw, dz0, dz0 + 6.2, tint(CONT_COLS[seed], 1.25), CONT_COLS[seed], heel);
      continue;
    }
    const col = CAT_COL[d.cat] || '#5a666e';
    if (d.cat === 'bridge') {
      /* 居住区の段重ね。最上段が操舵室、その上に見張り所 */
      box(s.x, s.y, s.hdg, loc.px, loc.py, hl, hw, dz0, dz0 + 9, col, tint(col, 0.78), heel);
      box(s.x, s.y, s.hdg, loc.px, loc.py, hl * 0.86, hw * 0.9, dz0 + 9, dz0 + 14, tint(col, 1.08), tint(col, 0.84), heel);
      box(s.x, s.y, s.hdg, loc.px, loc.py, hl * 0.62, hw * 1.06, dz0 + 14, dz0 + 17.5, '#9fb2bd', '#5d6b75', heel);
      box(s.x, s.y, s.hdg, loc.px - hl * 0.5, loc.py, 1.6, 1.8, dz0 + 17.5, dz0 + 25, '#8d9aa2', '#66727a', heel);
      continue;
    }
    if (d.cat === 'boiler' || d.cat === 'turbine') {
      /* 煙突は船体側が 1 本にまとめて描く。ここは機械室の覆いだけ */
      box(s.x, s.y, s.hdg, loc.px, loc.py, hl, hw, dz0, dz0 + 4.2, tint(col, 1.2), col, heel);
      box(s.x, s.y, s.hdg, loc.px, loc.py, hl * 0.55, hw * 0.55, dz0 + 4.2, dz0 + 5.6, tint(col, 0.9), tint(col, 0.7), heel);
      continue;
    }
    if (d.cat === 'hangar' || d.cat === 'catapult') {
      box(s.x, s.y, s.hdg, loc.px, loc.py, hl, hw, dz0, dz0 + (d.cat === 'hangar' ? 8 : 3), tint(col, 1.15), col, heel);
      if (d.cat === 'catapult') {
        const w = worldOf(s, loc.px, loc.py, 0);
        const a = P(w.x, w.y, dz0 + 3), b2 = P(w.x + Math.cos(s.hdg) * hl * 1.6, w.y + Math.sin(s.hdg) * hl * 1.6, dz0 + 5);
        ctx.strokeStyle = '#9fb0bb'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b2.x, b2.y); ctx.stroke();
      }
      continue;
    }
    if (d.cat === 'radar' || d.cat === 'sonar') {
      box(s.x, s.y, s.hdg, loc.px, loc.py, hl * 0.6, hw * 0.6, dz0, dz0 + 8, tint(col, 1.2), col, heel);
      if (d.cat === 'radar') {
        const w = worldOf(s, loc.px, loc.py, 0);
        const c = P(w.x, w.y, dz0 + 10);
        ctx.strokeStyle = '#9fd0e0'; ctx.lineWidth = 1.4;
        ctx.beginPath(); ctx.arc(c.x, c.y, 4 + Math.sin(G.t * 3) * 1.2, 0, TAU); ctx.stroke();
      }
      continue;
    }
    /* 兵装: 天蓋を外したコンテナを架台にする。甲板はどこまでもコンテナ船に見える */
    const bat = s.batteries.find(b => b.gx === p.x && b.gy === p.y);
    drawWeaponPart(s, p, d, loc, bat, dz0, heel, hl, hw);
  }
}

/** 兵装 1 基を描く。どの兵装も「天蓋を外したコンテナ」から生えている */
function drawWeaponPart(s, p, d, loc, bat, dz, heel, hl, hw) {
  const hull = HULLS[s.design.hull];
  const cellW = hull.beam * DECK_W / hull.rows;
  const col = CAT_COL[d.cat] || '#5a666e';
  const ang = bat ? bat.ang : s.hdg;
  const dead = !!(bat && bat.hp <= 0);

  /* --- 架台となるコンテナ函体。積荷のコンテナと同じ寸法・同じ色調 --- */
  const cc = dead ? '#3b3330' : CONT_COLS[Math.abs(Math.round(p.x * 7 + p.y * 3)) % CONT_COLS.length];
  const WALL = 4.6, T = Math.min(0.55, Math.min(hl, hw) * 0.22);
  /* 函体の床（内部が見える） */
  box(s.x, s.y, s.hdg, loc.px, loc.py, hl, hw, dz, dz + 1.1, '#242c33', '#161d22', heel);
  /* 四方の側板。天蓋だけが無い */
  for (const sgn of [-1, 1]) {
    box(s.x, s.y, s.hdg, loc.px + sgn * (hl - T), loc.py, T, hw, dz, dz + WALL, tint(cc, 1.25), cc, heel);
    box(s.x, s.y, s.hdg, loc.px, loc.py + sgn * (hw - T), hl - T * 2, T, dz, dz + WALL, tint(cc, 1.25), cc, heel);
  }
  /* 隅金具 — コンテナらしさはここに出る */
  for (const sx of [-1, 1]) for (const sy of [-1, 1])
    box(s.x, s.y, s.hdg, loc.px + sx * (hl - T * 0.8), loc.py + sy * (hw - T * 0.8),
      T * 1.5, T * 1.5, dz, dz + WALL + 0.5, '#8b949a', '#4e575d', heel);

  const bz = dz + WALL;                       // 兵装は函体の縁から生える
  const w = worldOf(s, loc.px, loc.py, 0);
  if (d.cat === 'torp') {
    for (let i = 0; i < Math.min(d.barrels, 4); i++)
      box(s.x, s.y, s.hdg, loc.px + (i - 1.5) * 3.2, loc.py, 1.6, 1.5,
        dz + 1.1, dz + 1.1 + 4.6, dead ? '#4a5350' : '#8ee0bd', dead ? '#313836' : '#4e8f78', heel);
  } else if (d.cat === 'missile') {
    /* 函体そのものが発射筒。開口部から筒先が覗く */
    for (let i = 0; i < 4; i++)
      box(s.x, s.y, s.hdg, loc.px, loc.py + (i - 1.5) * (cellW * 0.22), hl * 0.72, 1.2,
        dz + 1.1, bz + 1.6, dead ? '#5a5346' : '#c9a86a', dead ? '#3a352d' : '#8a7444', heel);
  } else if (d.cat === 'laser') {

function drawArcSector(s, b, col, alpha) {
  const bp = batPos(s, b);
  const c0 = s.hdg + b.arcC, half = b.arcH, R = b.range;
  ctx.beginPath();
  const o = P(bp.x, bp.y, 0);
  ctx.moveTo(o.x, o.y);
  for (let i = 0; i <= 26; i++) {
    const a = c0 - half + (2 * half) * i / 26;
    const p = P(bp.x + Math.cos(a) * R, bp.y + Math.sin(a) * R, 0);
    ctx.lineTo(p.x, p.y);
  }
  ctx.closePath();
  ctx.fillStyle = col.replace('ALPHA', alpha); ctx.fill();
  ctx.strokeStyle = col.replace('ALPHA', alpha * 3); ctx.lineWidth = 1; ctx.stroke();
}
function drawGroundOverlay() {
  const p = G.player;
  if (!p || !p.alive) return;

  /* 針路 */
  const a = P(p.x, p.y, 0), b2 = P(p.x + Math.cos(p.hdg) * 2000, p.y + Math.sin(p.hdg) * 2000, 0);
  ctx.setLineDash([8, 10]); ctx.lineDashOffset = -G.t * 30;
  ctx.strokeStyle = 'rgba(95,227,161,.28)'; ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b2.x, b2.y); ctx.stroke();
  ctx.setLineDash([]);
  if (p.course !== null && p.course !== undefined) {
    const cq = P(p.x + Math.cos(p.course) * 1500, p.y + Math.sin(p.course) * 1500, 0);
    ctx.strokeStyle = 'rgba(255,180,60,.5)'; ctx.lineWidth = 1.2;
    ctx.setLineDash([4, 6]);
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(cq.x, cq.y); ctx.stroke(); ctx.setLineDash([]);
  }

  /* 選択中の兵装スロットの射界 — 同型は 1 スロットなので全基まとめて出す */
  const selG = G.wgrp[G.selGrp];
  const selBats = selG ? selG.bats.filter(b => b.hp > 0) : [];
  if (selBats.length && selBats[0].cat === 'torp') {
    const tgt = shipNear(G.aim.x, G.aim.y, 400);
    if (!tgt) {
      /* 何を狙っているのか分からないと、撃てない理由も分からない */
      const c0 = P(p.x, p.y, 40);
      ctx.font = '700 11px Oxanium, Rajdhani, system-ui, sans-serif'; ctx.textAlign = 'center';
      ctx.fillStyle = '#6f8a96';
      ctx.fillText('雷撃 — 照準を目標に重ねよ', c0.x, c0.y - 46);
      ctx.textAlign = 'left';
    }
    const sols = selBats.map(b => tgt ? torpSolution(p, b, tgt) : null);
    let li = sols.findIndex(x => x && x.ok); if (li < 0) li = 0;
    selBats.forEach((sel, i) => {
      const sol = sols[i];
      const bp = batPos(p, sel), dir = p.hdg + sel.arcC;
      const e = P(bp.x + Math.cos(dir) * sel.range, bp.y + Math.sin(dir) * sel.range, 0);
      const s0 = P(bp.x, bp.y, 2);
      const ready = sel.reload <= 0 && sel.ammo > 0;
      ctx.setLineDash([12, 12]); ctx.lineDashOffset = -G.t * 60;
      ctx.strokeStyle = sol && sol.ok && ready ? 'rgba(140,255,200,.95)' : ready ? 'rgba(127,212,176,.5)' : 'rgba(127,212,176,.16)';
      ctx.lineWidth = sol && sol.ok && ready ? 2.6 : 1.6;
      ctx.beginPath(); ctx.moveTo(s0.x, s0.y); ctx.lineTo(e.x, e.y); ctx.stroke(); ctx.setLineDash([]);
      if (sol && i === li) {
        const q = P(sol.lp.x, sol.lp.y, 0);
        ctx.strokeStyle = sol.ok ? 'rgba(140,255,200,.9)' : 'rgba(127,212,176,.35)';
        ctx.lineWidth = 1.4;
        ctx.beginPath(); ctx.arc(q.x, q.y, 7, 0, TAU); ctx.stroke();
        ctx.font = '700 11px Oxanium, Rajdhani, system-ui, sans-serif'; ctx.textAlign = 'center';
        ctx.fillStyle = sol.ok ? '#8cffc8' : '#6f8a96';
        /* 撃てるか（射界と射程）と、当たるか（雷撃解）を分けて出す。
           当たらないと分かっていても撃てる — 撃つかどうかは艦長が決める */
        ctx.fillText(
          !sol.inArcOk ? '舷が合わない'
            : sol.d > sel.range ? '遠い ' + (sol.d / 1000).toFixed(1) + 'km'
              : sol.ok ? '雷撃解 ○'
                : '命中は見込み薄（速い・遠い）',
          q.x, q.y - 12);
        ctx.textAlign = 'left';
      }
    });
  } else {
    for (const sel of selBats) {
      const col = sel.cat === 'missile' ? 'rgba(255,180,60,ALPHA)'
        : sel.cat === 'sam' ? 'rgba(159,216,255,ALPHA)'
        : sel.cat === 'aa' ? 'rgba(168,196,210,ALPHA)'
          : sel.cat === 'laser' ? 'rgba(159,216,255,ALPHA)' : 'rgba(255,217,138,ALPHA)';
      drawArcSector(p, sel, col, 0.035);
    }
  }

  /* 離脱海域 */
  const z = G.stage && G.stage.zone;
  if (z) {
    const ok = G.extractReady;
    worldEllipse(z.x, z.y, z.r, ok ? 'rgba(95,227,161,.6)' : 'rgba(255,90,71,.45)', 2, [14, 12]);
    const c = P(z.x, z.y, 0);
    ctx.fillStyle = ok ? 'rgba(95,227,161,.85)' : 'rgba(255,140,110,.7)';
    ctx.font = '700 12px Oxanium, Rajdhani, system-ui, sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(ok ? '離脱海域' : '離脱海域（目標未達成）', c.x, c.y);
    ctx.textAlign = 'left';
  }
}

function drawMarkers() {

  for (const s of G.ships) {
    if (!s.alive || s === p) continue;
    if (s.dive > 0.55 && !(p.detectSub && dist2(s.x, s.y, p.x, p.y) < p.detectSub)) continue;
    const hostile = s.side === 'enemy';
    const civ = s.side === 'civil';
    const col = hostile ? 'rgba(255,90,71,.8)' : civ ? 'rgba(143,166,178,.7)' : 'rgba(95,227,161,.7)';
    const top = P(s.x, s.y, s.beam * 0.45 + 26);
    const wdt = clamp(s.len * cam.zoom * 0.9, 24, 100);

    const qs = QUADS.map(q => clamp(s.quads[q].hp / s.quads[q].max, 0, 1));
    ctx.fillStyle = 'rgba(6,12,16,.75)';
    ctx.fillRect(top.x - wdt / 2, top.y - 5, wdt, 4);
    for (let i = 0; i < 4; i++) {
      const w4 = wdt / 4;
      ctx.fillStyle = qs[i] > 0.5 ? (hostile ? '#ff6a55' : '#5fe3a1') : qs[i] > 0.2 ? '#ffb43c' : '#7a2a22';
      ctx.fillRect(top.x - wdt / 2 + i * w4 + 0.5, top.y - 5, w4 * qs[i] - 1, 4);
    }
    if (cam.zoom > 0.22) {
      ctx.font = '9px "Share Tech Mono", ui-monospace, monospace';
      ctx.textAlign = 'center'; ctx.fillStyle = col;
      ctx.fillText(s.name + (s.superweapon ? ' ★' : ''), top.x, top.y - 9);
      ctx.textAlign = 'left';
    }
  }
  /* 照準 */
  if (G.state === 'battle' && p.alive) {
    const c = P(G.aim.x, G.aim.y, 0);
    const near = shipNear(G.aim.x, G.aim.y, 260);

    ctx.moveTo(c.x + 6, c.y); ctx.lineTo(c.x + 17, c.y);
    ctx.moveTo(c.x, c.y - 17); ctx.lineTo(c.x, c.y - 6);
    ctx.moveTo(c.x, c.y + 6); ctx.lineTo(c.x, c.y + 17);
    ctx.stroke();
    /* 偏差マーカ: どこを狙えばよいか */
    if (near) {
      const b = p.batteries.find(x => x.hp > 0 && (x.cat === 'gun' || x.cat === 'sec' || x.cat === 'rocket')) || p.batteries[0];
      if (b) {
        const bp = batPos(p, b), tv = velOf(near);
        const lp = leadPoint(bp.x, bp.y, near.x, near.y, tv.vx, tv.vy, b.shellSpeed, 4);
        const q = P(lp.x, lp.y, 0);
        ctx.strokeStyle = 'rgba(255,180,60,.85)'; ctx.lineWidth = 1.2;
        ctx.beginPath(); ctx.arc(q.x, q.y, 6, 0, TAU); ctx.stroke();
        ctx.setLineDash([3, 3]);
        ctx.beginPath(); ctx.moveTo(c.x, c.y); ctx.lineTo(q.x, q.y); ctx.stroke(); ctx.setLineDash([]);
        ctx.font = '9px "Share Tech Mono", ui-monospace, monospace';
        ctx.fillStyle = 'rgba(255,180,60,.9)'; ctx.textAlign = 'center';
        ctx.fillText('未来位置 ' + (dist2(p.x, p.y, near.x, near.y) / 1000).toFixed(1) + 'km', q.x, q.y - 10);
        ctx.textAlign = 'left';
      }
    }
  }
}

const $ = id => document.getElementById(id);
let teleBuilt = false, wpnBuilt = '';

function buildTelegraph() {
  const el = $('tele'); el.innerHTML = '';
  TELEGRAPH.forEach((t, i) => {
    const d = document.createElement('div');
    d.textContent = t.short;
    if (i === 0) d.className = 'astern';
    el.appendChild(d);
  });

const MODE_JA = { manual: '手動', auto: '自動', hold: '停止' };
/** 同じ兵装は 1 スロットにまとめる。以後の操作単位はこの群 */
function weaponGroups(s) {
  const out = [], byId = {};
  for (const b of s.batteries) {
    const id = b.def.id;
    if (!byId[id]) { byId[id] = { id, name: b.name, cat: b.cat, bats: [] }; out.push(byId[id]); }
    byId[id].bats.push(b);
  }
  return out;
}
function buildWeaponList() {
  const p = G.player, host = $('wpnList');
  G.wgrp = weaponGroups(p);
  G.selGrp = clamp(G.selGrp || 0, 0, Math.max(0, G.wgrp.length - 1));
  host.innerHTML = '';
  G.wgrp.forEach((g, i) => {
    const d = document.createElement('div');
    d.className = 'wrow'; d.id = 'wrow_' + i;
    d.innerHTML = `<span class="k">${i + 1}</span>`
      + `<span class="ic" style="color:${CAT_COLOR[g.cat] || '#8fa6b2'}">${partIcon(g.cat)}</span>`
      + `<span class="nm">${g.name}${g.bats.length > 1 ? ' ×' + g.bats.length : ''}</span>`
      + `<span class="st"></span><span class="am"></span><span class="md"></span><i class="rl"></i>`;
    d.onclick = () => cycleMode(i);
    host.appendChild(d);
  });
  wpnBuilt = G.wgrp.map(g => g.id + g.bats.length).join('|');
}
/* 撃てない理由の見出し。優先度の高い順に見て、群として一番前向きな状態を出す */
const WHY_JA = {
  fire: { t: '射撃', c: 'go' }, trigger: { t: 'クリックで発射', c: 'go' },
  train: { t: '旋回中', c: 'wait' }, reload: { t: '装填', c: 'wait' },
  lead: { t: '雷撃解なし', c: '' }, arc: { t: '射界外', c: '' },
  range: { t: '遠い', c: '' }, notgt: { t: '目標なし', c: '' },
  ammo: { t: '弾切れ', c: '' }, hold: { t: '', c: '' }, dead: { t: '', c: '' }
};
const WHY_ORDER = ['fire', 'trigger', 'train', 'reload', 'lead', 'arc', 'range', 'notgt', 'ammo', 'hold', 'dead'];
function grpWhy(g) {
  const live = g.bats.filter(b => b.hp > 0);
  if (!live.length) return 'dead';
  let best = 'dead';
  for (const b of live) {
    const w = b.why || 'notgt';
    if (WHY_ORDER.indexOf(w) < WHY_ORDER.indexOf(best)) best = w;
  }
  return best;
}
/** 自動に回している兵装スロット数（基数ではなく種類の数） */
function autoCount(s) {
  const seen = new Set();
  for (const b of s.batteries)
    if (b.hp > 0 && b.mode === 'auto' && usesAutoSlot(b)) seen.add(b.def.id);
  return seen.size;
}
const liveOf = g => g.bats.filter(b => b.hp > 0);
/** 群の代表モード（全基そろって切り替わるので先頭の生き残りで足りる） */
const grpMode = g => { const l = liveOf(g); return l.length ? l[0].mode : 'hold'; };
function cycleMode(i) {
  const p = G.player, g = G.wgrp[i];
  if (!g) return;
  const live = liveOf(g);
  if (!live.length) { SFX.ng(); return; }
  const cur = grpMode(g);
  const next = cur === 'manual' ? 'auto' : cur === 'auto' ? 'hold' : 'manual';
  if (next === 'auto' && usesAutoSlot(live[0])) {
    const cap = autoSlotCap(SAVE.tech.elec);
    /* このスロットが未だ自動でないなら、1 枠ぶん増える */
    const already = live.some(b => b.mode === 'auto');
    if (!already && autoCount(p) >= cap) {
      SFX.ng();
      pushLog('自動に回せるのは ' + cap + ' 種まで。ほかを停止か手動にせよ', '#ff5a47');
      return;
    }
  }
  for (const b of live) b.mode = next;
  G.selGrp = i;
  SFX.sel();
  pushLog(g.name + ' — ' + MODE_JA[next], next === 'hold' ? '#ff5a47' : next === 'manual' ? '#ffb43c' : '#5fe3a1');
}
function setAllModes(m) {
  const cap = autoSlotCap(SAVE.tech.elec);
  let n = 0;
  for (const g of G.wgrp) {
    const live = liveOf(g);
    if (!live.length) continue;
    if (m !== 'auto') { for (const b of live) b.mode = m; continue; }
    /* 近接防空は枠を食わない。それ以外は 1 種で 1 枠 */
    if (!usesAutoSlot(live[0])) { for (const b of live) b.mode = 'auto'; continue; }
    const ok = n < cap;
    for (const b of live) b.mode = ok ? 'auto' : 'manual';
    if (ok) n++;
  }
  pushLog(m === 'auto' ? '自動 ' + n + ' 種 / 残りは手動' : '全兵装 — ' + MODE_JA[m], '#ffb43c');
  SFX.ok();
}

function updateHUD() {
  const p = G.player; if (!p) return;
  if (!teleBuilt) buildTelegraph();

  /* 航行速度（時間圧縮）— 交戦距離に入ると自動で解ける */
  const tt = $('timeTag'), want = G.tScale || 1, now = timeScaleNow();
  if (want === 1) tt.style.display = 'none';
  else {
    tt.style.display = 'block';
    tt.className = now === want ? '' : 'held';
    tt.textContent = now === want ? '航行速度 ×' + want : '交戦中 — 航行速度 ×1';
  }

  $('shipName').textContent = p.name;
  $('shipClass').textContent = HULLS[p.design.hull].name + ' / 特設巡洋艦';
  /* 速力は「設計値」ではなく「いま出せる最大」と並べて出す。
     額面どおり出ない理由（令速の段・艦尾損傷・浸水）をここで明かす */
  const capKt = maxSpeedNow(p) * MPS_TO_KT, dsnKt = p.maxSpd * MPS_TO_KT;
  const ordKt = Math.abs(TELEGRAPH[clamp(p.tele, 0, TELEGRAPH.length - 1)].f) * capKt;
  $('navSpd').textContent = Math.round(Math.abs(p.spd) * MPS_TO_KT);
  $('navSpdMax').textContent = ' / ' + Math.round(ordKt);
  const hurt = capKt < dsnKt - 0.3;
  const why = hurt
    ? '機関 ' + Math.round(capKt / dsnKt * 100) + '%（'
      + [p.quads.stern.hp < p.quads.stern.max * 0.98 ? '艦尾損傷' : '',
         p.flood > 0.02 ? '浸水' : '',
         p.quads.bow.hp < p.quads.bow.max * 0.98 ? '艦首損傷' : ''].filter(Boolean).join('・')
      + '）最大 ' + Math.round(capKt) + 'kt / 設計 ' + Math.round(dsnKt) + 'kt'
      + (p.quads.stern.regen || p.quads.bow.regen ? '　▲ 応急班 復旧中' : '')
    : '令速 ' + TELEGRAPH[clamp(p.tele, 0, TELEGRAPH.length - 1)].name
      + ' ' + Math.round(ordKt) + 'kt / 全速 ' + Math.round(dsnKt) + 'kt';
  const sw = $('spdWhy');
  if (sw.textContent !== why) sw.textContent = why;
  sw.className = hurt ? 'hurt' : '';
  $('navCrs').textContent = compassStr(p.hdg);
  $('navList').textContent = Math.abs(p.list).toFixed(1);
  [...$('tele').children].forEach((d, i) => d.classList.toggle('on', i === p.tele));
  $('rudKnob').style.left = (50 + p.rudder * 22) + '%';
  $('rudTxt').textContent = Math.abs(p.rudder) < 0.15 ? '舵中央'
    : (p.rudder < 0 ? '取舵 ' : '面舵 ') + Math.round(Math.abs(p.rudder) * 17.5) + '°';

  /* 4区画 */
  for (const q of QUADS) {
    const k = p.quads[q], r = clamp(k.hp / k.max, 0, 1);
    const el = $('q_' + q);
    if (!el) continue;
    const bar = el.querySelector('i');
    bar.style.width = (r * 100) + '%';
    bar.style.background = r > 0.5 ? 'var(--sonar)' : r > 0.22 ? 'var(--amber)' : 'var(--warn)';
    el.querySelector('b').textContent = Math.max(0, Math.round(k.hp));
    el.className = 'quad' + (q === 'bow' || q === 'stern' ? ' wide' : '')
      + (r <= 0.22 ? ' crit' : '') + (k.fire > 0.05 ? ' fire' : '') + (k.flood > 0.05 ? ' flood' : '')
      + (k.regen ? ' regen' : '');
  }

  /* 応急修理 */
  $('survNum').textContent = (p.survivors % SURVIVORS_PER_REPAIR) + '/' + SURVIVORS_PER_REPAIR;
  $('repNum').textContent = p.repairs
    + (p.repairs < REPAIR_MAX ? '　（次まで ' + Math.ceil(Math.max(0, p.repairT || 0)) + 's）' : '');
  $('repBtn').className = 'repbtn' + (p.repairs > 0 ? ' on' : '');

  /* 艦載機 */
  const pl = $('planeRow');
  if (p.planeMax > 0) {
    pl.style.display = 'flex';
    const out = G.planes.filter(x => x.home === p && !x.dead).length;
    $('planeNum').textContent = p.planesReady + ' / 空中 ' + out;
  } else pl.style.display = 'none';

  /* 兵装 — 同型は 1 スロット */
  const wh = $('wpnHead');
  const cap = autoSlotCap(SAVE.tech.elec);
  const whTxt = '兵装 ' + G.wgrp.length + '/' + WEAPON_SLOT_MAX + '　自動 ' + autoCount(p) + '/' + cap + ' 種';
  if (wh.textContent !== whTxt) wh.textContent = whTxt;
  if (!G.wgrp.length || wpnBuilt !== G.wgrp.map(g => g.id + g.bats.length).join('|')) buildWeaponList();
  G.wgrp.forEach((g, i) => {
    const d = $('wrow_' + i); if (!d) return;
    const live = liveOf(g), dead = !live.length;
    d.className = 'wrow ' + grpMode(g) + (dead ? ' dead' : '') + (G.selGrp === i ? ' sel' : '');
    d.querySelector('.md').textContent = dead ? '大破'
      : MODE_JA[grpMode(g)] + (live.length < g.bats.length ? ' ' + live.length + '/' + g.bats.length : '');
    const am = g.bats.reduce((a, b) => a + b.ammo, 0);
    d.querySelector('.am').textContent = am === Infinity ? '∞' : am;
    const w = WHY_JA[grpWhy(g)] || WHY_JA.notgt;
    const st = d.querySelector('.st');
    if (st.textContent !== w.t) st.textContent = w.t;
    const sc = 'st ' + w.c;
    if (st.className !== sc) st.className = sc;
    /* 装填ゲージは群のうち最も早く撃てる 1 基を示す */
    const rd = dead ? 0 : Math.max(...live.map(b => clamp(1 - b.reload / Math.max(0.01, b.reloadMax), 0, 1)));
    d.querySelector('.rl').style.width = (rd * 100) + '%';
  });

  /* 作戦 — 画面上は数だけ。目標文と操作法は ESC のポーズ画面にまとめてある */
  $('moneyVal').textContent = '￥' + G.money.toLocaleString();
  $('meritVal').textContent = G.merit;
  const mains = G.objectives.filter(o => !o.sub), subs = G.objectives.filter(o => o.sub);
  setTxt('objCount', mains.filter(o => o.done).length + '/' + mains.length);
  setTxt('opsSub', subs.length ? '副目標 ' + subs.filter(o => o.done).length + '/' + subs.length : '');
  setTxt('opsGo', G.extractReady ? '▶ 離脱海域へ' : '');

  const lg = $('log');
  const lh = G.log.map(l => `<div style="opacity:${clamp(l.life / 3, 0.15, 1)};color:${l.col || ''}">${l.txt}</div>`).join('');
  if (lg.innerHTML !== lh) lg.innerHTML = lh;

  $('vign').style.opacity = quadHealth(p) < 0.3 ? 1 : 0;

  /* 離脱カウント */
  const ex = $('extract');
  if (G.extractT > 0) {
    ex.style.display = 'block';
    ex.textContent = (G.extractReady ? '離脱手続き ' : '⚠ 目標未達成のまま離脱 ') + G.extractT.toFixed(1);
    ex.style.color = G.extractReady ? 'var(--sonar)' : 'var(--warn)';
  } else ex.style.display = 'none';
}

/* ---------- レーダー ---------- */
function drawRadar() {
  const p = G.player; if (!p) return;
  const w = rdc.width, h = rdc.height, cxx = w / 2, cyy = h / 2;
  const R = G.radarRange;
  rctx.clearRect(0, 0, w, h);
  rctx.fillStyle = 'rgba(5,14,20,.92)'; rctx.fillRect(0, 0, w, h);
  rctx.strokeStyle = '#183038'; rctx.lineWidth = 2;
  for (const f of [0.33, 0.66, 1]) { rctx.beginPath(); rctx.arc(cxx, cyy, (w / 2 - 8) * f, 0, TAU); rctx.stroke(); }
  rctx.beginPath(); rctx.moveTo(cxx, 8); rctx.lineTo(cxx, h - 8); rctx.moveTo(8, cyy); rctx.lineTo(w - 8, cyy); rctx.stroke();
  rctx.save(); rctx.translate(cxx, cyy); rctx.rotate((G.t * 1.1) % TAU);
  const grad = rctx.createLinearGradient(0, 0, w / 2, 0);
  grad.addColorStop(0, 'rgba(95,227,161,.16)'); grad.addColorStop(1, 'rgba(95,227,161,0)');
  rctx.fillStyle = grad;
  rctx.beginPath(); rctx.moveTo(0, 0); rctx.arc(0, 0, w / 2 - 8, -0.5, 0); rctx.closePath(); rctx.fill();
  rctx.restore();

  const sc = (w / 2 - 10) / R;
  const pt = (x, y) => ({ x: cxx + (x - p.x) * sc, y: cyy + (y - p.y) * sc });
  /* 島 — 海図の目印。自分がどこを走っているかはこれで分かる */
  rctx.fillStyle = 'rgba(104,138,110,.55)';
  rctx.strokeStyle = 'rgba(150,190,150,.55)'; rctx.lineWidth = 1;
  for (const isl of G.islands) {
    const c = pt(isl.x, isl.y);
    if (Math.hypot(c.x - cxx, c.y - cyy) > w / 2 + isl.r * sc) continue;
    rctx.beginPath();
    for (let i = 0; i <= ISLAND_N; i++) {
      const a = (i % ISLAND_N) / ISLAND_N * TAU;
      const q = { x: c.x + Math.cos(a) * isl.pts[i % ISLAND_N] * sc, y: c.y + Math.sin(a) * isl.pts[i % ISLAND_N] * sc };
      i ? rctx.lineTo(q.x, q.y) : rctx.moveTo(q.x, q.y);
    }
    rctx.closePath(); rctx.fill(); rctx.stroke();
  }
  /* 漂流兵と投棄兵装。拾いに戻れるよう戦術図にも出す */
  for (const sv of G.survivors) {
    const c = pt(sv.x, sv.y);
    if (Math.hypot(c.x - cxx, c.y - cyy) > w / 2 - 8) continue;
    rctx.globalAlpha = sv.life < 20 ? 0.35 + 0.65 * Math.abs(Math.sin(G.t * 5)) : 0.9;
    rctx.fillStyle = '#ffd98a';
    rctx.fillRect(c.x - 1, c.y - 1, 2, 2);
  }
  for (const dr of G.drops) {
    const c = pt(dr.x, dr.y);
    if (Math.hypot(c.x - cxx, c.y - cyy) > w / 2 - 8) continue;
    rctx.globalAlpha = dr.life < 30 ? 0.35 + 0.65 * Math.abs(Math.sin(G.t * 5)) : 1;
    rctx.strokeStyle = '#ffb43c'; rctx.lineWidth = 1.4;
    rctx.strokeRect(c.x - 2.5, c.y - 2.5, 5, 5);
  }
  rctx.globalAlpha = 1;
  for (const s of G.ships) {
    if (!s.alive) continue;
    const known = s === p || s.side === 'friend' ||
      dist2(s.x, s.y, p.x, p.y) < (s.dive > 0.55 ? (p.detectSub || 0) : p.detect + 1200);
    if (!known) continue;
    const q = pt(s.x, s.y);
    if (Math.hypot(q.x - cxx, q.y - cyy) > w / 2 - 8) continue;
    rctx.fillStyle = s === p ? '#5fe3a1' : s.side === 'enemy' ? (s.superweapon ? '#ff3a2a' : '#ff7a62')
      : s.side === 'civil' ? '#8fa6b2' : '#7fd4ff';
    const sz = s.len > 200 ? 6 : s.len > 120 ? 5 : 4;
    rctx.save(); rctx.translate(q.x, q.y); rctx.rotate(s.hdg + Math.PI / 2);
    rctx.globalAlpha = s.dive > 0.55 ? 0.5 : 1;
    rctx.beginPath(); rctx.moveTo(0, -sz); rctx.lineTo(sz * 0.6, sz * 0.8); rctx.lineTo(-sz * 0.6, sz * 0.8);
    rctx.closePath(); rctx.fill(); rctx.globalAlpha = 1;
    rctx.restore();
  }
  for (const t of G.torps) {
    const q = pt(t.x, t.y);
    rctx.fillStyle = t.side === 'player' ? '#7fd4b0' : '#ff5a47';
    rctx.fillRect(q.x - 1.5, q.y - 1.5, 3, 3);
  }
  for (const m of G.missiles) {
    const q = pt(m.x, m.y);
    rctx.fillStyle = m.side === 'player' ? '#ffb43c' : '#ff5a47';
    rctx.beginPath(); rctx.arc(q.x, q.y, 2.4, 0, TAU); rctx.fill();
  }
  for (const d of G.drops) {
    const q = pt(d.x, d.y);
    rctx.fillStyle = '#ffb43c'; rctx.fillRect(q.x - 2, q.y - 2, 4, 4);
  }
  if (G.survivors.length) {
    rctx.fillStyle = 'rgba(255,217,138,.7)';
    for (const s of G.survivors) { const q = pt(s.x, s.y); rctx.fillRect(q.x - 1, q.y - 1, 2, 2); }
  }
  const z = G.stage && G.stage.zone;
  if (z) {
    const q = pt(z.x, z.y);
    rctx.strokeStyle = G.extractReady ? 'rgba(95,227,161,.7)' : 'rgba(255,90,71,.5)';
    rctx.lineWidth = 2; rctx.setLineDash([5, 5]);
    rctx.beginPath(); rctx.arc(q.x, q.y, Math.max(6, z.r * sc), 0, TAU); rctx.stroke(); rctx.setLineDash([]);
  }
  $('radarRange').textContent = 'RANGE ' + (R / 1000).toFixed(1) + 'km';
}

   入力
   ====================================================================== */
const keys = {};
let mouse = { x: 0, y: 0, pan: false, px: 0, py: 0 };
function updateAim() {
  const w = unproject(mouse.x, mouse.y, cam, cam.zoom, W, H);
  G.aim.x = w.x; G.aim.y = w.y;
}
cv.addEventListener('mousemove', e => {
  mouse.x = e.clientX; mouse.y = e.clientY;
  updateAim();
  if (mouse.pan) {
    const dx = e.clientX - mouse.px, dy = e.clientY - mouse.py;
    cam.ox -= (dx / (ISO_SX * cam.zoom) + dy / (ISO_SY * cam.zoom)) / 2;
    cam.oy -= (dy / (ISO_SY * cam.zoom) - dx / (ISO_SX * cam.zoom)) / 2;
    mouse.px = e.clientX; mouse.py = e.clientY;
  }
});
cv.addEventListener('mousedown', e => {
  audio();
  if (G.state !== 'battle') return;
  if (e.button === 0) G.fire = true;                       // 左: 照準位置へ射撃
  else if (e.button === 2) {                               // 右: 転舵
    const p = G.player;
    if (p && p.alive) {
      p.course = angTo(p.x, p.y, G.aim.x, G.aim.y);
      fx({ k: 'ring', x: G.aim.x, y: G.aim.y, r: 8, max: 60, life: 0.7, col: '#5fe3a1' });
      SFX.sel();
    }
  } else if (e.button === 1) { mouse.pan = true; mouse.px = e.clientX; mouse.py = e.clientY; }
});
addEventListener('mouseup', e => {
  if (e.button === 0) G.fire = false;
  if (e.button === 1) mouse.pan = false;
});
cv.addEventListener('contextmenu', e => e.preventDefault());
cv.addEventListener('wheel', e => {
  cam.tzoom = clamp(cam.tzoom * (e.deltaY > 0 ? 0.88 : 1.14), ZOOM_MIN, ZOOM_MAX);
  e.preventDefault();
}, { passive: false });
cv.addEventListener('dblclick', () => { cam.ox = 0; cam.oy = 0; });

addEventListener('keydown', e => {
  audio();
  const k = e.key.toLowerCase();
  keys[k] = true;
  /* 押しっぱなしの自動リピートで操作音が鳴り続けるのを止める */
  if (e.repeat) return;
  if ([' ', 'tab', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright'].includes(k)) e.preventDefault();
  if (G.state !== 'battle') {
    if (k === 'enter') { const b = document.querySelector('#ovbtns .btn'); if (b) b.click(); }
    return;
  }
  const p = G.player; if (!p) return;
  /* 値が変わったときだけ鳴らす。端で押し続けても無音 */
  const chg = (get, set) => { const v = get(); set(); if (get() !== v) SFX.sel(); else SFX.ng(); };
  if (k === 'arrowup' || k === 'w') chg(() => p.tele, () => p.tele = clamp(p.tele + 1, 0, TELEGRAPH.length - 1));
  if (k === 'arrowdown' || k === 's') chg(() => p.tele, () => p.tele = clamp(p.tele - 1, 0, TELEGRAPH.length - 1));
  if (k === 'arrowleft' || k === 'a') chg(() => p.rudder, () => { p.course = null; p.rudder = clamp(p.rudder - 1, -2, 2); });
  if (k === 'arrowright' || k === 'd') chg(() => p.rudder, () => { p.course = null; p.rudder = clamp(p.rudder + 1, -2, 2); });
  if (k === 'x') chg(() => p.rudder, () => { p.course = null; p.rudder = 0; });
  if (k >= '1' && k <= '8') cycleMode(+k - 1);   // 兵装は 8 種まで（WEAPON_SLOT_MAX）
  if (k === '0') setAllModes('auto');
  if (k === 'q') setAllModes('manual');
  if (k === 'e') setAllModes('hold');
  if (k === 'r') doRepair();
  if (k === 'f') launchPlanes(p);
  if (k === 'g') recallPlanes(p);
  if (k === ' ') G.fire = true;
  if (k === 't') cycleTimeScale();
  if (k === 'p') togglePause();
  if (k === 'm') { muted = !muted; pushLog(muted ? '音声 OFF' : '音声 ON'); }
  if (k === 'escape') showPause();
});
addEventListener('keyup', e => {
  const k = e.key.toLowerCase();
  keys[k] = false;
  if (k === ' ') G.fire = false;
});
function togglePause() {
  G.paused = !G.paused;
  $('pauseTag').style.display = G.paused ? 'block' : 'none';
  SFX.sel();
}

/* 船影の外に取る余白（グリッドの幅・高さに対する比）。射界の扇形はここに出る */
const SIL_PADX = 0.10, SIL_PADY = 0.34;

/** 船影をグリッドに実寸で重ねる。はみ出し量は甲板の被覆率と射界の余白から決まる */
function layoutDeck() {
  const svg = $('dkSil'), g = $('dkGrid'), deck = $('dkDeck');
  if (!svg || !g || !deck || !deck.offsetParent) return;
  const a = g.getBoundingClientRect();
  const ow = a.width * (1 / (2 * DECK_L) - 0.5 + SIL_PADX);
  const oh = a.height * (1 / (2 * DECK_W) - 0.5 + SIL_PADY);
  /* 船首楼と船尾の張り出しぶんの余白を確保してから重ねる */
  $('dkZones').style.marginBottom = (oh + 6) + 'px';
  deck.style.paddingBottom = (oh + 10) + 'px';
  const b = deck.getBoundingClientRect(), r = g.getBoundingClientRect();
  svg.style.left = (r.left - b.left - ow) + 'px';
  svg.style.top = (r.top - b.top - oh) + 'px';
  svg.style.width = (r.width + ow * 2) + 'px';
  svg.style.height = (r.height + oh * 2) + 'px';
}

/* 分類ごとの色と絵柄。甲板に置いたときのセル色と同じ系統にして、
   パレットで見た絵がそのまま甲板に並ぶようにする。
   これが読めていれば、説明文を読まなくてもだいたい選べる */
const CAT_COLOR = {
  gun: '#9dc0d6', sec: '#7f9fb2', rocket: '#d8845c', aa: '#7fb0c6', torp: '#4fbf95',

  bridge: '#a8bac6', boiler: '#c8a95f', turbine: '#e0c070',
  radar: '#74a8c6', sonar: '#7492c6', catapult: '#96a6b0', hangar: '#aebcc6',
  armor: '#b6c2ce', dc: '#5fc8a4', bulge: '#8fb0c0', cargo: '#c88a58'
};
/* viewBox 0 0 24 24 / currentColor。外部画像もフォントも使わない */
const CAT_ICON = {
  gun: '<rect x="3" y="12" width="11" height="8" rx="2"/><rect x="12" y="7.6" width="10" height="2.6" rx="1.3"/><rect x="12" y="11.4" width="10" height="2.6" rx="1.3"/>',

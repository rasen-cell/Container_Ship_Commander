<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CONTAINER WARS ～コンテナシップコマンダー～</title>
<style>:root{
--ink:#04090c; --steel:#111a20; --line:#25404c; --line2:#1a2c35;
--hull:#cdd6db; --dim:#6f8a96; --dim2:#48606c;
--sonar:#5fe3a1; --amber:#ffb43c; --warn:#ff5a47; --ice:#7fd4ff; --trp:#7fd4b0;
--panel:linear-gradient(180deg,rgba(15,23,29,.92),rgba(8,13,17,.94));
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:#04090c;color:var(--hull);
font-family:'Oxanium','Rajdhani','Chakra Petch',system-ui,-apple-system,'Hiragino Sans','Noto Sans JP',sans-serif;
user-select:none;-webkit-user-select:none;cursor:crosshair}
canvas{display:block}
#view{position:fixed;inset:0;width:100%;height:100%;background:#04121a}
.mono{font-family:'Share Tech Mono',ui-monospace,'DejaVu Sans Mono',monospace}
#hud{position:fixed;inset:0;pointer-events:none;display:none;
font-family:'Share Tech Mono',ui-monospace,'DejaVu Sans Mono',monospace}
.panel{position:absolute;background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:9px 11px}
.lbl{font-size:9px;letter-spacing:.2em;color:var(--dim);text-transform:uppercase}
#leftCol{position:absolute;left:12px;top:12px;bottom:12px;width:300px;
display:flex;flex-direction:column;gap:9px;pointer-events:none}
#leftCol > .panel{position:static;width:auto;flex:none}
#shipPanel{width:270px}
#shipName{font-family:'Oxanium';font-weight:800;font-size:15px}
#shipClass{font-size:9px;color:var(--dim);letter-spacing:.12em;margin-bottom:8px}
.navGrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.navCell{background:#0a1216;border:1px solid var(--line2);border-radius:4px;padding:4px 5px;text-align:center}
.navCell .n{font-family:'Oxanium';font-weight:800;font-size:15px;line-height:1.1}
.navCell .u{font-size:8px;color:var(--dim);letter-spacing:.1em}
.navCell .n #navSpdMax{font-size:10px;font-weight:600;color:var(--dim)}
#spdWhy{margin-top:4px;font-size:9px;letter-spacing:.04em;color:var(--dim);min-height:11px}
#spdWhy.hurt{color:var(--warn)}
#tele{display:flex;gap:2px;margin-top:8px}
#tele div{flex:1;height:16px;border:1px solid var(--line2);border-radius:2px;background:#0a1216;
font-size:8px;display:flex;align-items:center;justify-content:center;color:var(--dim2)}
#tele div.on{background:rgba(95,227,161,.16);border-color:var(--sonar);color:var(--sonar)}
#tele div.astern.on{background:rgba(255,90,71,.16);border-color:var(--warn);color:var(--warn)}
#rudRow{display:flex;align-items:center;gap:6px;margin-top:7px}
#rudTrack{flex:1;height:10px;background:#0a1216;border:1px solid var(--line2);border-radius:5px;position:relative}
#rudTrack::before{content:'';position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--line)}
#rudKnob{position:absolute;top:1px;width:8px;height:6px;border-radius:2px;background:var(--amber);left:50%;margin-left:-4px;transition:left .12s}
#rudTxt{font-size:9px;color:var(--dim);width:64px;text-align:right}
#quadPanel{width:214px}
#quadWrap{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px;margin-top:6px;
grid-template-areas:'. bow .' 'port . star' '. stern .'}
#q_bow{grid-area:bow}#q_port{grid-area:port}#q_star{grid-area:star}#q_stern{grid-area:stern}
.quad{cursor:pointer;background:#0a1216;border:1px solid var(--line2);border-radius:4px;padding:4px 6px}
.quad:hover{border-color:var(--sonar)}
.quad .qn{font-size:9px;color:var(--dim);letter-spacing:.1em}
.quad b{font-family:'Oxanium';font-weight:800;font-size:15px;display:block;line-height:1.2}
.quad .qb{height:5px;border-radius:3px;background:#060c10;border:1px solid var(--line2);overflow:hidden;margin-top:3px}
.quad .qb i{display:block;height:100%;background:var(--sonar);transition:width .15s}
.quad.crit{border-color:var(--warn);box-shadow:0 0 12px rgba(255,90,71,.18) inset}
.quad.fire{background:linear-gradient(180deg,rgba(255,120,50,.14),#0a1216)}
.quad.flood{background:linear-gradient(0deg,rgba(90,180,255,.16),#0a1216)}
.quad.regen .qb i{background:repeating-linear-gradient(90deg,var(--sonar) 0 6px,#2b6b52 6px 12px)}
.quad.regen .qn::after{content:' ▲';color:var(--sonar)}
#dcPanel{width:270px}
#quadPanel .lbl{display:block;margin-bottom:2px}
.dcrow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:5px;font-size:11px;color:var(--dim)}
.dcrow b{color:var(--hull);font-family:'Oxanium';font-size:14px}
.repbtn{border:1px solid var(--line2);border-radius:4px;padding:3px 10px;font-size:10px;color:var(--dim2);
pointer-events:auto;cursor:pointer;background:#0a1216}
.repbtn.on{border-color:var(--sonar);color:var(--sonar)}
.repbtn.on:hover{background:rgba(95,227,161,.12)}
#leftCol > #wpnPanel{width:auto;flex:1 1 auto;min-height:0;display:flex;flex-direction:column;
overflow:hidden;pointer-events:auto}
#wpnList{flex:1;display:flex;flex-direction:column;gap:3px;margin-top:4px;min-height:0;overflow:auto}
.wrow{display:grid;grid-template-columns:14px 18px 1fr auto auto auto;gap:5px;align-items:center;
padding:4px 6px;border:1px solid var(--line2);border-radius:4px;background:#0a1216;
position:relative;overflow:hidden;cursor:pointer;font-size:11px}
.wrow .ic{display:block}
.wrow .ic svg{width:14px;height:14px;display:block}
.wrow .k{color:var(--dim2);font-size:9px}
.wrow .nm{color:var(--hull);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wrow .am{color:var(--dim);font-size:10px}
.wrow .st{font-size:9.5px;color:var(--dim2);white-space:nowrap}
.wrow .st.go{color:var(--sonar)}
.wrow .st.wait{color:var(--amber)}
.wrow .md{font-size:10px;padding:1px 6px;border-radius:3px;border:1px solid var(--line2);color:var(--dim2)}
.wrow .rl{position:absolute;left:0;bottom:0;height:2px;background:var(--amber);width:0}
.wrow.manual{border-color:#7a5a1e}.wrow.manual .md{color:var(--amber);border-color:#7a5a1e}
.wrow.auto{border-color:#1e5a42}.wrow.auto .md{color:var(--sonar);border-color:#1e5a42}
.wrow.hold{opacity:.55}.wrow.hold .md{color:var(--warn);border-color:#6a2a24}
.wrow.dead{opacity:.35;filter:grayscale(1)}
.wrow.sel{box-shadow:0 0 0 1px var(--amber) inset}
#opsPanel{top:12px;right:12px;width:186px}
#opsTop{display:flex;justify-content:space-between;align-items:baseline}
#opsTop b{font-family:'Oxanium';font-weight:800;font-size:16px;color:var(--hull)}
#opsSub{font-size:9px;color:var(--dim2);margin-top:2px}
#opsGo{font-size:10px;color:var(--amber);margin-top:3px;min-height:13px}
#objList{margin-top:6px;font-size:11.5px;line-height:1.8}
.obj{color:var(--dim)}
.obj.done{color:var(--sonar);text-decoration:line-through;opacity:.75}
.obj.go{color:var(--amber)}
.obj.subobj{color:#7f96a2;font-size:10px}
.obj.subobj.done{color:var(--ice)}
.objhead{font-size:9px;letter-spacing:.16em;color:var(--dim2);margin-top:6px;padding-top:5px;border-top:1px dotted var(--line2)}
.obj i{font-style:normal;color:var(--hull)}
#opsFoot{display:flex;justify-content:space-between;margin-top:8px;padding-top:7px;border-top:1px solid var(--line2);font-size:10px;color:var(--dim)}
#opsFoot b{font-family:'Oxanium';font-size:13px;color:var(--hull)}
#radarPanel{bottom:12px;right:12px;padding:7px}
#radar{width:190px;height:190px;display:block}
#radarFoot{display:flex;justify-content:space-between;font-size:9px;color:var(--dim2);margin-top:4px}
#warnWrap{position:absolute;top:42%;left:50%;transform:translate(-50%,-50%);text-align:center;width:560px}
.wmsg{font-family:'Oxanium';font-weight:800;font-size:22px;letter-spacing:.14em;color:var(--warn);
text-shadow:0 0 20px rgba(255,90,71,.5);opacity:0;transition:opacity .25s}
.wsub{font-size:12px;letter-spacing:.1em;color:var(--amber);opacity:0;transition:opacity .25s;margin-top:4px}
#extract{position:absolute;top:56%;left:50%;transform:translateX(-50%);font-family:'Oxanium';font-weight:800;
font-size:20px;letter-spacing:.1em;display:none}
#log{position:absolute;left:322px;bottom:12px;width:320px;font-size:10px;line-height:1.6;color:var(--dim)}
#log b{font-weight:400;color:var(--hull)}
#escHint{position:absolute;right:220px;bottom:16px;font-size:9.5px;letter-spacing:.14em;color:rgba(72,96,108,.85)}
#escHint b{color:var(--dim);font-family:'Oxanium'}
.keys{display:grid;grid-template-columns:1fr 1fr;gap:0 22px;font-size:11.5px;line-height:1.7}
.keys div{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dotted var(--line2);padding:2px 0}
.keys b{color:var(--amber);font-family:'Oxanium';font-weight:700;white-space:nowrap}
.keys span{color:var(--dim)}
#vign{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .4s;
box-shadow:inset 0 0 180px rgba(255,60,40,.34)}
#timeTag{position:absolute;top:12px;left:50%;transform:translateX(-50%);font-family:'Oxanium';
font-weight:800;font-size:13px;letter-spacing:.14em;color:var(--sonar);
background:rgba(6,18,24,.72);border:1px solid #1e5a42;border-radius:4px;padding:3px 12px;display:none}
#timeTag.held{color:var(--amber);border-color:#7a5a1e}
#pauseTag{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-family:'Oxanium';
font-weight:800;font-size:40px;letter-spacing:.3em;color:rgba(205,214,219,.18);display:none}
#dock{position:fixed;inset:0;background:linear-gradient(180deg,#070d12,#04080b);display:none;
flex-direction:column;z-index:15;cursor:default}
#dkTop{display:flex;align-items:center;gap:14px;padding:12px 18px;border-bottom:1px solid var(--line)}
#dkTitle{font-family:'Oxanium';font-weight:800;font-size:16px;letter-spacing:.04em;cursor:pointer}
#dkTitle:hover{color:var(--sonar)}
#dkTabs{display:flex;gap:6px;margin-left:10px}
#dkTabs button{font-family:'Oxanium';font-weight:700;font-size:12px;padding:6px 16px;border-radius:4px;
border:1px solid var(--line2);background:#0a1216;color:var(--dim);cursor:pointer}
#dkTabs button.on{border-color:var(--amber);color:var(--amber);background:rgba(255,180,60,.08)}
#dkInfo{margin-left:auto;display:flex;gap:18px;font-family:'Share Tech Mono',monospace;font-size:12px;color:var(--dim)}
#dkInfo b{color:var(--hull);font-size:14px}
#dkBody{flex:1;overflow:hidden;position:relative}
#dkDesign{display:flex;height:100%;gap:14px;padding:14px 18px}
.dkCol{display:flex;flex-direction:column;gap:10px;min-height:0}
#dkLeft{width:250px}
#dkCenter{flex:1;min-width:0}
#dkRight{width:330px}
.dkBox{background:rgba(12,19,25,.8);border:1px solid var(--line2);border-radius:6px;padding:10px 12px}
.dkBox h4{font-family:'Oxanium';font-size:11px;letter-spacing:.18em;color:var(--dim);font-weight:700;
text-transform:uppercase;margin-bottom:8px}
#dkDesigns{display:flex;flex-direction:column;gap:4px;max-height:132px;overflow:auto}
.dsRow{display:flex;align-items:center;gap:6px;border:1px solid var(--line2);border-radius:4px;
padding:5px 8px;background:#0a1216;cursor:pointer;font-size:11px}
.dsRow:hover{border-color:var(--sonar)}
.dsRow.on{border-color:var(--amber);background:rgba(255,180,60,.08)}
.dsRow .dn{flex:1;font-family:'Oxanium';font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dsRow .dh{font-size:9px;color:var(--dim2)}
.dsRow .dw{font-size:9px;color:var(--dim)}
.dsRow.bad .dw{color:var(--warn)}
#dkDesignBtns{display:flex;gap:4px;margin-top:7px}
#dkDesignBtns .btn{flex:1;padding:5px 0;font-size:10px;letter-spacing:.04em}
#dkHulls{display:flex;flex-direction:column;gap:6px}
.hullPick{border:1px solid var(--line2);border-radius:4px;padding:7px 9px;cursor:pointer;background:#0a1216}
.hullPick:hover{border-color:var(--sonar)}
.hullPick.on{border-color:var(--amber);background:rgba(255,180,60,.08)}
.hullPick.lock{opacity:.4;cursor:not-allowed}
.hullPick .t{font-family:'Oxanium';font-weight:700;font-size:12px}
.hullPick .d{font-size:9.5px;color:var(--dim);margin-top:2px}
.hullPick .d2{font-size:9.5px;color:var(--amber);margin-top:2px}
#dkStats{font-family:'Share Tech Mono',monospace;font-size:11px}
#dkEvalBox{flex:0 0 auto;display:flex;flex-direction:column;min-height:186px;max-height:32vh}
#dkEval{font-size:12px;display:flex;flex-direction:column;gap:9px;flex:1;min-height:0}
.evbars{display:flex;gap:6px;flex:none}
.evlist{flex:1;overflow:auto;min-height:0}
.evrow{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
background:#0a1216;border:1px solid var(--line2);border-radius:4px;padding:5px 2px}
.evrow span{font-size:10px;letter-spacing:.1em;color:var(--dim)}
.evrow .evb{width:100%;height:5px;background:#060c10;border:1px solid var(--line2);border-radius:3px;overflow:hidden}
.evrow .evb i{display:block;height:100%;background:var(--sonar)}
.evrow .evb.lo i{background:var(--warn)}
.evrow .evb.mid i{background:var(--amber)}
.evrow b{font-family:'Oxanium';font-weight:800;font-size:17px;color:var(--hull);line-height:1}
.evrow.lo b{color:var(--warn)}.evrow.mid b{color:var(--amber)}
.adv{display:flex;gap:7px;padding:5px 0;border-top:1px dotted var(--line2);line-height:1.6}
.adv:first-child{border-top:none}
.adv i{font-style:normal;flex:none;font-weight:700}
.adv.bad i{color:var(--warn)}.adv.warn i{color:var(--amber)}.adv.tip i{color:var(--dim2)}
.adv.good i{color:var(--sonar)}
.adv.bad{color:#e8b6ae}.adv.warn{color:#d8c39a}.adv.tip{color:var(--dim)}
.adv.good{color:#9fdcbe}
.advok{color:var(--sonar);padding:5px 0}
.srow{display:flex;justify-content:space-between;padding:2px 0;color:var(--dim)}
.srow b{color:var(--hull);font-weight:400}
.srow b.bad{color:var(--warn)}
.sbar{height:6px;background:#060c10;border:1px solid var(--line2);border-radius:3px;overflow:hidden;margin:3px 0 6px}
.sbar i{display:block;height:100%}
#dkGridWrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:0}
#dkDeck{position:relative;width:100%;max-width:820px;padding:0 10%}
#dkSil{position:absolute;z-index:0;pointer-events:none;overflow:hidden}
#dkZones{display:grid;gap:3px;width:100%;margin-bottom:4px;position:relative;z-index:1}
.zband{border-radius:3px 3px 0 0;font-size:9px;letter-spacing:.08em;text-align:center;
padding:2px 0 3px;border:1px solid;border-bottom:none;white-space:nowrap;overflow:hidden}
.zband.z-C{color:#c98a5c;border-color:#5c4330;background:rgba(160,96,48,.10)}
.zband.z-B{color:#9fb6c4;border-color:#3f5563;background:rgba(120,168,200,.10)}
.zband.z-E{color:#c0a870;border-color:#5a4f3d;background:rgba(176,144,72,.10)}
.zband.z-M{color:#a8b0bc;border-color:#4c545f;background:rgba(150,160,180,.10)}
#dkGrid{display:grid;gap:3px;width:100%;aspect-ratio:auto;position:relative}
#dkGrid .cell{position:relative;z-index:1}
#dkGrid .cell.void{background:transparent;border:1px solid transparent;pointer-events:none}
#dkTrim{display:flex;align-items:center;gap:8px;width:100%;max-width:820px;font-size:10px;color:var(--dim)}
#dkTrim .tbar{flex:1;height:8px;background:#0a1216;border:1px solid var(--line2);border-radius:4px;position:relative}
#dkTrim .tbar i{position:absolute;left:50%;top:-2px;width:1px;height:10px;background:var(--dim2)}
#dkTrim .tbar b{position:absolute;top:-3px;width:8px;height:12px;margin-left:-4px;border-radius:2px;
background:var(--sonar);transition:left .12s}
#dkTrim.warn .tbar b{background:var(--amber)}
#dkTrim.bad .tbar b{background:var(--warn)}
#dkTrim .tv{min-width:150px;text-align:right;font-family:'Share Tech Mono',monospace}
.cell.z-C{background:#120e0b}
.cell.z-B,.cell.z-M{background:#0c1319}
.cell.z-E{background:#131108}
.cell{background:#0b1318;border:1px dashed #1e2f38;border-radius:3px;min-height:44px;
display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
cursor:pointer;transition:.08s;overflow:hidden;
font-size:10px;color:var(--dim);text-align:center;padding:2px;line-height:1.2}
.cell .ci{display:block;flex:none}
.cell .ci svg{width:17px;height:17px;display:block}
.cell .cn{font-size:9px;color:var(--dim);max-width:100%;overflow:hidden;
text-overflow:ellipsis;white-space:nowrap}
.cell:hover{border-color:var(--dim2)}
.cell.ok{border-color:var(--sonar);background:rgba(95,227,161,.10)}
.cell.no{border-color:var(--warn);background:rgba(255,90,71,.08)}
.cell.used{border-style:solid;border-color:var(--line);background:#16222a;color:var(--hull)}
.cell.cat-gun,.cell.cat-sec{background:#243039;border-color:#3d5563}
.cell.cat-aa{background:#22303a}
.cell.cat-torp{background:#1c332c;border-color:#2f6a55}
.cell.cat-rocket{background:#33241c;border-color:#7a4a30}
.cell.cat-bulge{background:#22303a;border-color:#4a6a7c}
.cell.cat-missile{background:#332c1c;border-color:#6a5a2f}
.cell.cat-sam{background:#1f2c36;border-color:#4a6a80}
.cell.cat-laser{background:#1c2c38;border-color:#3f7fa0}
.cell.cat-bridge{background:#2a333a;border-color:#5b6b74}
.cell.cat-boiler,.cell.cat-turbine{background:#2e2a22;border-color:#5a4f3d}
.cell.cat-cargo{background:#3a2a20;border-color:#6b4a33}
.cell.cat-armor{background:#2c3238;border-color:#6c7a86}
.cell.cat-dc{background:#1e2f2a;border-color:#4a7a68}
.cell.cat-radar,.cell.cat-sonar{background:#1f2c34;border-color:#3d6070}
.cell.cat-catapult,.cell.cat-hangar{background:#252d33;border-color:#48575f}
.zmap{display:flex;gap:1px;margin-top:3px}
.zmap i{flex:1;height:5px;border-radius:1px}
.zmap i.z-C{background:#8a5535}.zmap i.z-B{background:#4d6c80}
.zmap i.z-E{background:#7d6a3a}.zmap i.z-M{background:#5f6a78}
#dkAxis{display:flex;justify-content:space-between;width:100%;max-width:820px;font-size:10px;color:var(--dim2)}
#dkLayout{position:relative;z-index:1;width:100%;max-width:820px;font-size:9.5px;color:var(--dim);line-height:1.5}
#dkQuadArm{display:flex;gap:6px;width:100%;max-width:820px;font-size:10px}
#dkQuadArm .qa{flex:1;background:#0a1216;border:1px solid var(--line2);border-radius:4px;padding:4px 6px}
#dkQuadArm .qa .n{color:var(--dim2);font-size:9px;letter-spacing:.08em}
#dkQuadArm .qa .v{font-family:'Share Tech Mono',monospace;color:var(--hull);font-size:12px}
#dkQuadArm .qa.bare .v{color:var(--warn)}
#dkQuadArm .qa .hp{color:var(--dim);font-size:9px}
#dkPalTabs{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}
.ptab{font-family:'Oxanium';font-size:10px;font-weight:700;letter-spacing:.04em;
background:#0a1216;color:var(--dim);border:1px solid var(--line2);border-radius:3px;
padding:4px 7px;cursor:pointer;display:flex;align-items:center;gap:4px}
.ptab:hover{border-color:var(--dim2);color:var(--hull)}
.ptab.on{background:rgba(255,180,60,.10);border-color:var(--amber);color:var(--amber)}
.ptab i{font-style:normal;font-size:9px;opacity:.6}
.phead{font-family:'Oxanium';font-size:10px;font-weight:700;letter-spacing:.14em;
color:var(--sonar);border-bottom:1px solid var(--line2);padding-bottom:3px;margin:6px 0 -1px}
.phead:first-child{margin-top:0}
#dkPalette{flex:1;overflow:auto;display:flex;flex-direction:column;gap:3px;padding-right:4px}
.pitem{border:1px solid var(--line2);border-radius:5px;background:#0a1216;cursor:pointer}
.pitem:hover{border-color:var(--dim2)}
.pitem.sel{border-color:var(--amber);background:rgba(255,180,60,.08)}
.pitem.lock{cursor:not-allowed}
.pitem.dim{opacity:.5}
.pitem.lock .pn{color:var(--dim2);letter-spacing:.2em}
.prow{display:flex;align-items:center;gap:8px;padding:5px 8px}
.pic{flex:none;width:26px;height:26px;display:flex;align-items:center;justify-content:center;
border:1px solid currentColor;border-radius:4px;background:rgba(255,255,255,.045)}
.pitem.lock .pic{color:#3d4d57;background:transparent}
.pic svg{width:18px;height:18px;display:block}
.pfp{flex:none;display:grid;gap:1px}
.pfp i{width:4px;height:4px;background:currentColor;border-radius:1px;opacity:.75}
.pn{font-family:'Oxanium';font-weight:700;font-size:12px;flex:1;
white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pwt{font-family:'Share Tech Mono',monospace;font-size:9.5px;color:var(--dim2);flex:none}
.pown{font-family:'Share Tech Mono',monospace;font-size:9.5px;color:var(--sonar);flex:none;min-width:20px;text-align:right}
.plack{font-size:9.5px;color:var(--dim2);flex:none}
.pdet{padding:0 9px 8px 42px;border-top:1px dotted var(--line2);margin-top:-1px}
.pd{font-size:10.5px;color:var(--dim);margin-top:6px;line-height:1.55}
.pstat{font-family:'Share Tech Mono',monospace;font-size:10px;color:#8fa6b2;margin-top:4px}
.pfoot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:7px;
font-size:9.5px;color:var(--dim2)}
.pinfo{flex:1;min-width:0}
.pbtns{flex:none;display:grid;grid-template-columns:auto auto;gap:6px;align-items:center}
.psell.off{opacity:.28;cursor:not-allowed;pointer-events:none}
.psell{background:#12201a;border:1px solid #2f6a55;color:var(--sonar);border-radius:3px;
font-family:'Oxanium';font-weight:700;font-size:9px;padding:3px 8px;cursor:pointer;white-space:nowrap}
.psell:hover{background:#1a3128;border-color:var(--sonar)}
.pbuy{font-family:'Oxanium';font-weight:700;font-size:10px;padding:3px 10px;border-radius:3px;
border:1px solid var(--sonar);background:transparent;color:var(--sonar);cursor:pointer;white-space:nowrap}
.pbuy:hover{background:rgba(95,227,161,.12)}
.pbuy.off{border-color:var(--line2);color:var(--dim2);cursor:not-allowed}
.pbuy.rare{border-color:var(--ice);color:var(--ice);cursor:default}
#dkErr{font-size:11px;line-height:1.7}
#dkErr .e{color:var(--warn)}
#dkErr .okmsg{color:var(--sonar)}
#dkFoot{display:flex;gap:10px;align-items:center;padding:10px 18px;border-top:1px solid var(--line)}
#dkToast{margin-left:auto;font-size:11px;color:var(--amber);opacity:0;transition:opacity .3s}
#dkTech{padding:20px 24px;overflow:auto;height:100%}
.techHead{font-size:12px;color:var(--dim);margin-bottom:14px}
.techRow{display:flex;align-items:center;gap:16px;padding:12px 14px;border:1px solid var(--line2);
border-radius:5px;margin-bottom:8px;background:#0a1216}
.tn{font-family:'Oxanium';font-weight:700;font-size:14px;width:200px}
.td{display:block;font-family:'Share Tech Mono',monospace;font-size:10px;color:var(--dim);font-weight:400}
.tpips{display:flex;gap:5px;flex:1}
.tpips i{width:34px;height:9px;border-radius:2px;background:#141d23;border:1px solid var(--line2)}
.tpips i.on{background:var(--amber);border-color:var(--amber)}
.techFoot{font-size:11px;color:var(--dim);margin-top:14px;line-height:1.7}
#dkUnlock{margin-top:12px;padding:10px 14px;border:1px solid var(--sonar);border-radius:5px;
background:rgba(95,227,161,.08);font-size:12px;color:#bfe8d4;line-height:1.7}
#dkUnlock b{color:var(--sonar)}
#dkOps{padding:20px 24px;overflow:auto;height:100%}
.areaBlock{margin-bottom:18px}
.areaBlock.lock{opacity:.4}
.areaName{font-family:'Oxanium';font-weight:800;font-size:14px;letter-spacing:.06em;color:var(--sonar);margin-bottom:8px}
.stageRow{display:flex;align-items:center;gap:14px;padding:10px 14px;border:1px solid var(--line2);
border-radius:5px;margin-bottom:6px;background:#0a1216;cursor:pointer}
.stageRow:hover{border-color:var(--amber)}
.stageRow.lock{opacity:.35;cursor:not-allowed}
.stageRow.done{border-color:#1e5a42}
.sn{font-family:'Oxanium';font-weight:700;font-size:13px;width:170px}
.ss{flex:1;font-size:11px;color:var(--dim)}
.sb{font-size:11px;color:var(--amber)}
.stageRow.done .sb{color:var(--sonar)}
.spay{font-family:'Share Tech Mono',monospace;font-size:11px;color:var(--amber);text-align:right;flex:none}
.spay i{display:block;font-style:normal;font-size:9px;color:var(--dim2)}
.stageRow.done .spay{color:var(--dim)}
#ov{position:fixed;inset:0;background:rgba(3,7,10,.94);display:none;align-items:center;justify-content:center;
z-index:20;cursor:default}
#ovcard{width:min(720px,94vw);max-height:92vh;overflow:auto;border:1px solid var(--line);border-radius:8px;
background:linear-gradient(180deg,#0e161c,#070c10);padding:26px 30px}
#ovcard.wide{width:min(980px,96vw)}
#ovkick{font-size:10px;letter-spacing:.3em;color:var(--amber);text-transform:uppercase}
#ovtitle{font-family:'Oxanium';font-weight:800;font-size:26px;margin:6px 0 2px}
#ovsub{font-size:11px;color:var(--dim);letter-spacing:.1em;font-family:'Share Tech Mono',monospace}
#ovbody{margin-top:18px;font-size:12.5px;line-height:1.95;color:#a9bcc6;font-family:'Share Tech Mono',monospace}
#ovShip{display:block;width:100%;height:210px;border:1px solid var(--line2);border-radius:5px;
background:#050f16;margin:2px 0 10px}
#ovbody h3{font-family:'Oxanium';font-size:12px;letter-spacing:.18em;color:var(--sonar);margin:16px 0 6px;
text-transform:uppercase;font-weight:700}
#ovbody .row{display:flex;justify-content:space-between;border-bottom:1px dotted var(--line2);padding:3px 0}
#ovbody .row b{color:var(--hull);font-weight:400}
#ovbody p{margin-bottom:8px}
.opline{padding-left:14px;position:relative;color:#9fb4bf}
.warnbox{border:1px solid #6a2a24;background:rgba(255,90,71,.08);border-radius:4px;padding:8px 10px;margin-top:10px;color:#ffab9a}
.pickGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.pick{border:1px solid var(--line2);border-radius:6px;padding:12px 14px;cursor:pointer;background:#0a1216}
.pick:hover{border-color:var(--sonar);background:rgba(95,227,161,.06)}
.pick .t{font-family:'Oxanium';font-weight:800;font-size:15px}
.pick .d{font-size:11px;color:var(--dim);margin-top:4px;line-height:1.5}
.pick .mods{font-size:9.5px;color:var(--dim2);margin-top:6px}
#ovbtns{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}
.btn{font-family:'Oxanium';font-weight:700;letter-spacing:.1em;font-size:12px;padding:10px 22px;
border:1px solid var(--sonar);border-radius:5px;background:transparent;color:var(--sonar);cursor:pointer}
.btn:hover{background:rgba(95,227,161,.12)}
.btn.alt{border-color:var(--line);color:var(--dim)}
.btn.alt:hover{background:rgba(120,150,165,.08);color:var(--hull)}
.btn.danger{border-color:var(--warn);color:var(--warn)}
.btn.danger:hover{background:rgba(255,90,71,.12)}
.btn.small{padding:6px 14px;font-size:11px}
.btn.off{opacity:.4;cursor:not-allowed}</style>
</head>

</div>
</div>

</div>
</div>

</div>

</div>

</div>
</div>

  missile: '<path d="M2 10h11l4 2-4 2H2z"/><path d="M17 12l5-2.6v5.2z"/><path d="M4 6h3l-1 4H4zM4 18h3l-1-4H4z"/>',
  sam: '<path d="M14 22V11l-2-4-2 4v11z"/><path d="M12 2l3 6H9z"/><path d="M6 22l3-5v5zM18 22l-3-5v5z"/>',
  laser: '<circle cx="9" cy="12" r="5"/><rect x="14" y="11" width="9" height="2" rx="1"/><rect x="14" y="6.5" width="6" height="1.6" rx=".8"/><rect x="14" y="15.9" width="6" height="1.6" rx=".8"/>',
  bridge: '<path d="M4 21h16v-4H4zM7 17h10v-4H7zM10 13h5V8h-5z"/><rect x="11.2" y="2" width="1.6" height="6"/>',
  boiler: '<rect x="4" y="7" width="16" height="13" rx="2.5"/><path d="M12 9.5c2 2 3 3.3 3 4.7a3 3 0 0 1-6 0c0-1.4 1-2.7 3-4.7z" fill="#0a1216"/>',
  turbine: '<circle cx="12" cy="12" r="4"/><path d="M11 2h2v6h-2zM11 16h2v6h-2zM2 11h6v2H2zM16 11h6v2h-6z"/>',
  radar: '<path d="M12 20a9 9 0 0 1 0-16v3.2a5.8 5.8 0 0 0 0 9.6z"/><rect x="11" y="10" width="2" height="12"/><rect x="6" y="20" width="12" height="2" rx="1"/>',
  sonar: '<circle cx="12" cy="5" r="2.4"/><path d="M12 9.5a7 7 0 0 1 7 7h-2.6a4.4 4.4 0 0 0-8.8 0H5a7 7 0 0 1 7-7z"/><path d="M12 15a4 4 0 0 1 4 4h-8a4 4 0 0 1 4-4z" opacity=".55"/>',
  catapult: '<path d="M2 20h20v2H2z"/><path d="M3 18L21 6v3L6 18z"/><circle cx="19" cy="6" r="2.6"/>',
  hangar: '<path d="M3 21V12a9 9 0 0 1 18 0v9h-4v-9a5 5 0 0 0-10 0v9z"/><rect x="10" y="15" width="4" height="6"/>',
  armor: '<path d="M12 2l9 3.4v6.2c0 5.2-3.7 9.3-9 10.4-5.3-1.1-9-5.2-9-10.4V5.4z"/>',
  dc: '<rect x="9.6" y="3" width="4.8" height="18" rx="1.4"/><rect x="3" y="9.6" width="18" height="4.8" rx="1.4"/>',
  cargo: '<rect x="2" y="6" width="20" height="12" rx="1.6"/><path d="M6 6v12M10 6v12M14 6v12M18 6v12" stroke="#0a1216" stroke-width="1.4"/>'
};
/** パレットと凡例で使う小アイコン */
const partIcon = cat =>
  `<svg viewBox="0 0 24 24" fill="currentColor">${CAT_ICON[cat] || CAT_ICON.cargo}</svg>`;
/** 占有マスをそのまま点で描く。何マス取るかは絵で分かるべきもの */
const partFootprint = def =>
  `<span class="pfp" style="grid-template-columns:repeat(${def.w},4px)">`
  + '<i></i>'.repeat(def.w * def.h) + '</span>';

/* パーツ表の分類。見出しはカテゴリ単位、タブはそれをまとめた単位 */
/* 分類は「何を撃つか」で切る。誘導するものは全部ミサイル、
   誘導しない噴進弾は噴進砲。同じ「噴進」が二か所に散っていて紛らわしかった */
const PALETTE_CATS = [['bridge', '艦橋'], ['boiler', '機関 — ディーゼル'], ['turbine', '機関 — タービン'],
  ['gun', '主砲'], ['sec', '副砲'], ['rocket', '噴進砲（無誘導）'], ['torp', '雷装'],
  ['missile', '対艦ミサイル（誘導）'],
  ['aa', '機銃・近接防空'], ['sam', '対空ミサイル'], ['laser', '特殊兵装'],
  ['radar', '電装 — レーダー'], ['sonar', '電装 — ソナー'], ['catapult', '航空 — 射出機'], ['hangar', '航空 — 格納庫'],
  ['armor', '防御 — 装甲'], ['dc', '防御 — 応急'], ['bulge', '防御 — 船体'], ['cargo', '貨物']];
const PALETTE_GROUPS = [
  { id: 'all', name: 'すべて', cats: null },
  { id: 'hull', name: '構造・機関', cats: ['bridge', 'boiler', 'turbine'] },
  { id: 'gun', name: '対艦 — 砲', cats: ['gun', 'sec', 'rocket'] },
  { id: 'tor', name: '対艦 — 雷装・ミサイル', cats: ['torp', 'missile'] },
  { id: 'air', name: '対空', cats: ['aa', 'sam'] },
  { id: 'elec', name: '電装・航空', cats: ['radar', 'sonar', 'catapult', 'hangar'] },
  { id: 'sp', name: '特殊', cats: ['laser'] },
  { id: 'def', name: '防御・貨物', cats: ['armor', 'dc', 'bulge', 'cargo'] }
];
let paletteTab = 'all';

function renderDock() {
  const d = SAVE.design, hull = HULLS[d.hull], st = designStats(d), errs = validateDesign(d);
  $('dkMoney').textContent = '￥' + SAVE.money.toLocaleString();
  $('dkRank').textContent = rankOf(SAVE.merit).name + ' / 功績 ' + SAVE.merit;

  /* --- タブ --- */
  [...$('dkTabs').children].forEach(b => b.classList.toggle('on', b.dataset.tab === dockTab));
  $('dkDesign').style.display = dockTab === 'design' ? 'flex' : 'none';
  $('dkTech').style.display = dockTab === 'tech' ? 'block' : 'none';
  $('dkOps').style.display = dockTab === 'ops' ? 'block' : 'none';
  if (dockTab === 'tech') return renderTech();
  if (dockTab === 'ops') return renderOps();

  /* --- 設計図の一覧 --- */
  $('dkDesigns').innerHTML = SAVE.designs.map((d, i) => {
    const st2 = designStats(d), bad = st2.over || validateDesign(d).length > 0;
    return `<div class="dsRow ${i === SAVE.designIdx ? 'on' : ''} ${bad ? 'bad' : ''}" data-i="${i}">
      <span class="dn">${d.name || '無題'}</span>
      <span class="dh">${HULLS[d.hull].name}</span>
      <span class="dw">${bad ? '要修正' : st2.speed.toFixed(0) + 'kt'}</span></div>`;
  }).join('');
  $('dkDesigns').querySelectorAll('.dsRow').forEach(el => {
    el.onclick = () => { SAVE.designIdx = +el.dataset.i; dockSel = null; storeSave(); SFX.sel(); renderDock(); };
  });

  /* --- 船体 --- */
  $('dkHulls').innerHTML = Object.values(HULLS).map(h => {
    const owned = SAVE.hulls.includes(h.id);
    const ok = techOk(h, SAVE.tech);
    return `<div class="hullPick ${d.hull === h.id ? 'on' : ''} ${owned ? '' : ok ? 'buy' : 'lock'}" data-h="${h.id}">
      <div class="t">${h.name}</div>
      <div class="d">${h.sub} ・ 積載 ${deckCells(h)}ベイ ・ ${h.maxWeight.toLocaleString()}t</div>
      <div class="d zmap">${[...h.zones].map(z => `<i class="z-${z}"></i>`).join('')}</div>
      <div class="d2">${owned ? '保有' : ok ? '￥' + h.cost.toLocaleString() : '鋼材 Lv' + h.tech.hull + ' が必要'}</div>
    </div>`;
  }).join('');
  $('dkHulls').querySelectorAll('.hullPick').forEach(el => el.onclick = () => pickHull(el.dataset.h));

  /* --- 甲板グリッド --- */
  const runs = zoneRuns(hull);
  /* 区画の帯 */
  const zb = $('dkZones');
  zb.style.gridTemplateColumns = `repeat(${hull.cols}, 1fr)`;
  zb.innerHTML = runs.map(r =>
    `<div class="zband z-${r.z}" style="grid-column:${r.a + 1} / span ${r.b - r.a + 1}">${ZONE_JA[r.z]}</div>`).join('');
  /* 甲板の下は 1 行だけ。規則は帯の色とセルの可否が語る */
  $('dkLayout').innerHTML =
    `<b style="color:var(--hull)">${hull.sub}</b>　積載 ${deckCells(hull)} ベイ`
    + (hull.bridgeless ? `　艦橋なし（船体が射撃指揮 ${hull.fc.toFixed(2)}）` : '')
    + `<span title="${hull.desc}">　ⓘ</span>`;

  /* 積付けの釣合い */
  {
    const t = clamp(st.trim, -1, 1);
    const el = $('dkTrim');
    el.className = st.trimSpd < 0.93 ? 'bad' : st.trimSpd < 1 ? 'warn' : '';
    el.querySelector('.tbar b').style.left = (50 + t * 50) + '%';
    el.querySelector('.tv').textContent = Math.abs(t) < 0.02 ? '釣合い良好'
      : (t > 0 ? '艦首' : '艦尾') + 'トリム ' + Math.round(Math.abs(t) * 100) + '%'
        + (st.trimSpd < 1 ? '　速力 −' + Math.round((1 - st.trimSpd) * 100) + '%' : '');
  }

  const g = $('dkGrid');
  g.style.gridTemplateColumns = `repeat(${hull.cols}, 1fr)`;
  g.style.gridTemplateRows = `repeat(${hull.rows}, 1fr)`;
  g.innerHTML = '';
  /* 船影 — 戦闘画面と同じ船型を、同じ縮尺でグリッドの下に敷く */
  {
    const cellL = hull.len * DECK_L / hull.cols, cellW = hull.beam * DECK_W / hull.rows;
    const gx = x => hull.cols / 2 + x / cellL, gy = y => hull.rows / 2 + y / cellW;
    const pts = hullOutline(hull.len, hull.beam).map(q => gx(q.x).toFixed(3) + ',' + gy(q.y).toFixed(3)).join(' ');
    const x0 = gx(-hull.len / 2) - hull.cols * SIL_PADX, x1 = gx(hull.len / 2) + hull.cols * SIL_PADX;
    const y0 = gy(-hull.beam / 2) - hull.rows * SIL_PADY, y1 = gy(hull.beam / 2) + hull.rows * SIL_PADY;
    const cy = hull.rows / 2, sw = (x1 - x0) / 420;
    const prev = $('dkSil'); if (prev) prev.remove();
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.id = 'dkSil'; svg.setAttribute('preserveAspectRatio', 'none');
    g.parentNode.appendChild(svg);
    svg.setAttribute('viewBox', `${x0} ${y0} ${x1 - x0} ${y1 - y0}`);
    svg.innerHTML =
      `<polygon points="${pts}" fill="#0c161c" stroke="#2f4854" stroke-width="${sw * 3}"/>` +
      `<line x1="${x0 + 0.1}" y1="${cy}" x2="${x1 - 0.1}" y2="${cy}"
             stroke="#1d2e38" stroke-width="${sw * 2}" stroke-dasharray="${sw * 26} ${sw * 20}"/>` +
      runs.filter(r => r.z !== 'C').map(r =>
        `<rect x="${r.a}" y="${y0}" width="${r.b - r.a + 1}" height="${y1 - y0}"
               fill="rgba(130,160,190,.08)"/>`).join('')
      /* 射界 — 船楼に遮られた分がそのまま扇形の欠けになる */
      + d.parts.filter(q => PARTS[q.id].range && PARTS[q.id].cat !== 'aa').map(q => {
        const def = PARTS[q.id], arc = arcOfPart(d, q), loc = cellToLocal(d, q);
        const ox = gx(loc.px), oy = gy(loc.py), R = hull.rows * 0.78, N = 24;
        const pts = [ox.toFixed(3) + ',' + oy.toFixed(3)];
        for (let i = 0; i <= N; i++) {
          /* 甲板図は縦横で縮尺が違う。向きはこの図の上での向きに直して描く */
          const th = arc.c - arc.h + (arc.h * 2) * i / N;
          const vx = Math.cos(th) / cellL, vy = Math.sin(th) / cellW;
          const m = Math.hypot(vx, vy) || 1;
          pts.push((ox + vx / m * R).toFixed(3) + ',' + (oy + vy / m * R).toFixed(3));
        }
        const col = def.cat === 'torp' ? '127,212,176' : def.cat === 'missile' ? '255,180,60'
          : def.cat === 'sam' ? '159,216,255' : '255,217,138';
        return `<polygon points="${pts.join(' ')}" fill="rgba(${col},.038)"
                  stroke="rgba(${col},.20)" stroke-width="${sw * 1.6}"/>`;
      }).join('');
  }

  for (let y = 0; y < hull.rows; y++) for (let x = 0; x < hull.cols; x++) {
    const cell = document.createElement('div');
    cell.className = 'cell z-' + zoneAt(hull, x);
    cell.dataset.x = x; cell.dataset.y = y;
    if (!cellUsable(hull, x, y)) {                       // 船首の絞りにかかる行は存在しない
      cell.className = 'cell void';
      cell.style.gridColumn = `${x + 1}`; cell.style.gridRow = `${y + 1}`;
      g.appendChild(cell); continue;
    }
    const p = partAt(d, x, y);
    if (p) {
      if (p.x !== x || p.y !== y) continue;              // 占有セルは先頭だけ描く
      const def = PARTS[p.id];
      cell.classList.add('used', 'cat-' + def.cat);
      cell.style.gridColumn = `${x + 1} / span ${def.w}`;
      cell.style.gridRow = `${y + 1} / span ${def.h}`;
      /* 絵柄はパレットと同じもの。並べた甲板を見れば、名前を読まなくても
         どこに何を積んだかが分かる */
      cell.innerHTML = `<span class="ci" style="color:${CAT_COLOR[def.cat] || '#8fa6b2'}">${partIcon(def.cat)}</span>`
        + `<span class="cn">${def.name}</span>`;
      cell.title = def.name + ' / ' + def.weight + 't';
      cell.onclick = () => { removePart(p); };
    } else {
      cell.style.gridColumn = `${x + 1}`;
      cell.style.gridRow = `${y + 1}`;
      cell.onclick = () => placeAt(x, y);
      if (dockSel) {
        const err = canPlace(d, dockSel, x, y);
        cell.classList.add(err ? 'no' : 'ok');
      }
    }
    g.appendChild(cell);
  }
  /* 艦首/艦尾の表示 */
  $('dkBow').textContent = '← 艦尾' ; $('dkStern').textContent = '艦首 →';
  layoutDeck();

  /* --- パレット — 分類で絞り、見出しで区切る --- */
  const grp = PALETTE_GROUPS.find(x => x.id === paletteTab) || PALETTE_GROUPS[0];
  $('dkPalTabs').innerHTML = PALETTE_GROUPS.map(x => {
    const cs = x.cats || PALETTE_CATS.map(c => c[0]);
    const all = Object.values(PARTS).filter(d => cs.includes(d.cat));
    const nn = all.filter(d => techOk(d, SAVE.tech)).length;
    /* 解禁済み / 全体。0 なら「まだ何も解禁されていない分類」だと分かる */
    return `<button class="ptab ${x.id === grp.id ? 'on' : ''}" data-g="${x.id}">${x.name}<i>${nn}/${all.length}</i></button>`;
  }).join('');
  $('dkPalTabs').querySelectorAll('.ptab').forEach(el => {
    el.onclick = () => { paletteTab = el.dataset.g; SFX.sel(); renderDock(); };
  });

  let html = '';
  for (const [cat, label] of PALETTE_CATS) {
    if (grp.cats && !grp.cats.includes(cat)) continue;
    const list = Object.values(PARTS).filter(x => x.cat === cat);
    if (!list.length) continue;
    html += `<div class="phead">${label}</div>`;
    for (const def of list) {
      const own = stockOf(def.id), used = usedOf(def.id), avail = own - used;
      /* 持っている物は名前が出る。鹵獲で手に入れたのに ？？？ のままでは、
         何を拾ったのかも積めるのかも分からない */
      const ok = techOk(def, SAVE.tech) || own > 0;
      const rare = def.rare, sel = dockSel === def.id;
      /* 鹵獲品は在庫が無ければ持っていないのと同じ。明るく出すと買えるように見える */
      const dim = rare && own === 0;
      const canBuy = ok && !rare && SAVE.money >= def.cost;
      const col = CAT_COLOR[def.cat] || '#8fa6b2';
      /* 未解禁は名前を伏せる。何の分類かは絵で分かるので、
         「まだ見ぬ何か」がそこにあることだけ伝わればよい */
      html += `<div class="pitem ${sel ? 'sel' : ''} ${ok ? '' : 'lock'} ${dim ? 'dim' : ''}" data-p="${def.id}">
        <div class="prow">
          <span class="pic" style="color:${ok ? col : ''}">${partIcon(def.cat)}</span>
          <span style="color:${ok ? col : '#3d4d57'}">${partFootprint(def)}</span>
          <span class="pn">${ok ? def.name : '？？？'}</span>
          ${ok ? `<span class="pwt">${def.weight}t</span>
                 <span class="pown">${own || ''}</span>`
               : `<span class="plack">${techLack(def, SAVE.tech).join(' / ')}</span>`}
        </div>${sel && ok ? `
        <div class="pdet">
          <div class="pd">${def.desc || ''}</div>
          <div class="pstat">${partStatLine(def)}</div>
          <div class="pfoot">
            <span class="pinfo">${def.w}×${def.h} マス ・ ${def.weight}t ・ 保有 ${own}${used ? '（使用 ' + used + '）' : ''}</span>
            <span class="pbtns">${rare
              ? `<span class="pbuy rare">非売品</span>`
              : `<button class="pbuy ${canBuy ? '' : 'off'}" data-buy="${def.id}">￥${def.cost.toLocaleString()}</button>`}
            <button class="psell ${!rare && avail > 0 ? '' : 'off'}" ${!rare && avail > 0 ? `data-sell="${def.id}"` : ''}
              title="使っていない在庫を 1 個売る">売却 +￥${rare ? 0 : sellValue(def).toLocaleString()}</button></span>
          </div>
        </div>` : ''}</div>`;
    }
  }
  $('dkPalette').innerHTML = html || '<div class="phead">該当なし</div>';
  $('dkPalette').querySelectorAll('.pitem').forEach(el => {
    el.onclick = ev => {
      if (ev.target.dataset.buy || ev.target.dataset.sell) return;
      const id = el.dataset.p;
      if (!techOk(PARTS[id], SAVE.tech)) { SFX.ng(); return; }
      dockSel = dockSel === id ? null : id;
      SFX.sel(); renderDock();
    };
  });
  $('dkPalette').querySelectorAll('[data-buy]').forEach(el => {
    el.onclick = ev => { ev.stopPropagation(); buyPart(el.dataset.buy); };
  });
  $('dkPalette').querySelectorAll('[data-sell]').forEach(el => {
    el.onclick = ev => { ev.stopPropagation(); sellPart(el.dataset.sell); };
  });

  /* --- 装甲 / VP --- */
  /* 防御 — 装甲は艦全体で 1 つ。区画耐久は 4 区画とも同じ */
  $('dkQuadArm').innerHTML =
    `<div class="qa ${st.armor ? '' : 'bare'}"><div class="n">装甲</div>
       <div class="v">${st.armor} mm</div><div class="hp">徹甲弾を止める厚み</div></div>
     <div class="qa"><div class="n">区画耐久 ×4</div>
       <div class="v">${st.quadHP.toLocaleString()}</div><div class="hp">1 区画でも 0 で沈没</div></div>
     <div class="qa"><div class="n">装甲重量</div>
       <div class="v">${st.armorWeight.toLocaleString()} t</div>
       <div class="hp">排水量の ${Math.round(st.armorWeight / Math.max(1, st.weight) * 100)}%</div></div>`;

  /* --- 性能 --- */
  const wpct = clamp(st.weight / st.maxWeight, 0, 1.3);
  $('dkStats').innerHTML = `

    }).join('');

    /* 直すべきことを先に、効いていることを後に。読む順がそのまま作業の順になる */
    const rank = { bad: 0, warn: 1, tip: 2, good: 3 };
    const sorted = adv.slice().sort((a, b) => rank[a.level] - rank[b.level]);
    const list = sorted.length
      ? sorted.map(a => `<div class="adv ${a.level}"><i>${mark[a.level]}</i><span>${a.text}</span></div>`).join('')

    : '<div class="okmsg">✔ 出撃可能</div>';

}
function partStatLine(def) {
  const out = [];
  if (def.dmg) out.push('威力 ' + def.dmg + (def.barrels > 1 ? '×' + def.barrels : ''));
  if (def.pen && def.pen < 900) out.push('貫通 ' + def.pen);
  if (def.range) out.push('射程 ' + (def.range / 1000).toFixed(1) + 'km');
  if (def.reload) out.push('装填 ' + def.reload + 's');
  if (def.power) out.push('出力 ' + def.power.toLocaleString());
  if (def.armor) out.push('装甲 +' + def.armor + 'mm');
  if (def.intercept) out.push('迎撃 ' + Math.round(def.intercept * 100) + '%');
  if (def.repairCut) out.push('応急再編成 −' + Math.round(def.repairCut * 100) + '%');
  if (def.dcMult) out.push('鎮火 ×' + def.dcMult);
  if (def.repairPlus) out.push('応急修理 +' + def.repairPlus + ' 回');
  if (def.plateHP) out.push('区画耐久 +' + def.plateHP);
  if (def.fc) out.push('射撃指揮 +' + def.fc);
  if (def.detect) out.push('索敵 ' + (def.detect / 1000).toFixed(1) + 'km');
  if (def.detectSub) out.push('対潜 ' + (def.detectSub / 1000).toFixed(1) + 'km');
  if (def.planes) out.push('搭載 ' + def.planes + '機');
  return out.join(' ・ ');
}
/** 使っていない在庫を売る。非売品は手放せない（二度と手に入らないため） */
function sellPart(id) {
  const def = PARTS[id];
  if (!def || def.rare) { SFX.ng(); return toast('非売品は売却できない'); }
  const free = stockOf(id) - usedOf(id);
  if (free <= 0) { SFX.ng(); return toast('使用中のパーツは売れない'); }
  SAVE.stock[id] = stockOf(id) - 1;
  SAVE.money += sellValue(def);
  storeSave(); SFX.ok(); renderDock();
  toast(def.name + ' を売却　+￥' + sellValue(def).toLocaleString());
}

function pickHull(id) {
  const h = HULLS[id];
  const d = SAVE.design;
  if (d.hull === id) return;
  if (!SAVE.hulls.includes(id)) {
    if (!techOk(h, SAVE.tech)) { SFX.ng(); return toast('鋼材 Lv' + h.tech.hull + ' が要る'); }
    if (SAVE.money < h.cost) { SFX.ng(); return toast('資金が足りない'); }
  }
  /* 換装すると積荷が全部降りる。組み上げた配置が消えるので、黙って実行しない */
  if (d.parts.length) {
    const buy = !SAVE.hulls.includes(id);
    ov('CONFIRM', '船体を換装する', HULLS[d.hull].name + ' → ' + h.name,
      `<p>いま積んでいる <b>${d.parts.length} 個</b>のパーツは<b>すべて降ろされる</b>。
         降ろしたパーツは在庫に戻るので、積み直しは自由にできる。</p>
       <p style="color:var(--dim2)">配置そのものは残らない。別の船型で試すなら、
         先に「複製」で設計図を取っておくとよい。</p>
       ${buy ? `<div class="row"><span>船体の購入費</span><b>￥${h.cost.toLocaleString()}</b></div>` : ''}`,
      [{ label: '換装する', danger: true, fn: () => { hideOv(); applyHull(id); } },
       { label: 'やめる', alt: true, fn: () => { hideOv(); renderDock(); } }]);
    return;
  }
  applyHull(id);
}
function applyHull(id) {
  const h = HULLS[id];
  if (!SAVE.hulls.includes(id)) { SAVE.money -= h.cost; SAVE.hulls.push(id); }
  SAVE.design.hull = id;
  /* 船体を替えたら積荷はいったん全部降ろす(在庫に戻る) */
  SAVE.design.parts = [];
  storeSave(); SFX.ok(); renderDock();
  toast(h.name + ' に換装した（積荷は降ろした）');
}
function buyPart(id) {
  const def = PARTS[id];
  if (def.rare) { SFX.ng(); return toast('非売品 — 敵から奪うしかない'); }
  if (!techOk(def, SAVE.tech)) { SFX.ng(); return toast('技術が足りない'); }
  if (SAVE.money < def.cost) { SFX.ng(); return toast('資金が足りない'); }
  SAVE.money -= def.cost;
  SAVE.stock[id] = stockOf(id) + 1;
  storeSave(); SFX.ok(); renderDock();
}
function placeAt(x, y) {
  if (!dockSel) return;
  const d = SAVE.design;
  if (stockOf(dockSel) - usedOf(dockSel) <= 0) { SFX.ng(); return toast('在庫がない — 先に購入せよ'); }

  if (err) { SFX.ng(); return toast(err); }
  d.parts.push({ id: dockSel, x, y });
  storeSave(); SFX.ok(); renderDock();
}
function removePart(p) {

/* --- 技術 --- */
function renderTech() {
  $('dkTech').innerHTML = `<div class="techHead">報奨金を技術に投じると、新しいパーツと船体が解禁される。</div>` +
    Object.values(TECH).map(t => {
      const lv = SAVE.tech[t.id], max = lv >= TECH_MAX;
      const cost = techCost(lv);
      return `<div class="techRow">
        <div class="tn">${t.name}<span class="td">${t.desc}</span></div>
        <div class="tpips">${Array.from({ length: TECH_MAX }, (_, i) => `<i class="${i < lv ? 'on' : ''}"></i>`).join('')}</div>
        <button class="btn small ${max || SAVE.money < cost ? 'off' : ''}" data-t="${t.id}">
          ${max ? 'MAX' : '￥' + cost.toLocaleString()}</button></div>`;
    }).join('') +
    `<div id="dkUnlock" style="display:none"></div>` +
    `<div class="techFoot">解禁されるもの: ${unlockPreview()}</div>`;
  $('dkTech').querySelectorAll('[data-t]').forEach(el => {
    el.onclick = () => {
      const id = el.dataset.t, lv = SAVE.tech[id];
      if (lv >= TECH_MAX) return SFX.ng();
      const c = techCost(lv);
      if (SAVE.money < c) { SFX.ng(); return toast('資金が足りない'); }
      const before = Object.values(PARTS).filter(x => techOk(x, SAVE.tech)).map(x => x.id);
      const hullBefore = Object.values(HULLS).filter(x => techOk(x, SAVE.tech)).map(x => x.id);
      SAVE.money -= c; SAVE.tech[id]++;
      const gained = Object.values(PARTS).filter(x => techOk(x, SAVE.tech) && !before.includes(x.id));
      const hullGained = Object.values(HULLS).filter(x => techOk(x, SAVE.tech) && !hullBefore.includes(x.id));
      const capBefore = autoSlotCap(SAVE.tech[id] - 1), capAfter = autoSlotCap(SAVE.tech[id]);
      const notes = [];
      for (const g of hullGained) notes.push('船体 ' + g.name);
      for (const g of gained) notes.push(g.name);
      if (id === 'elec' && capAfter > capBefore) notes.push('自動枠 ' + capBefore + ' → ' + capAfter);
      storeSave(); SFX.ok(); renderDock();
      /* 投資して何が変わったかを必ず見せる。分からない強化はメタループを殺す */
      $('dkUnlock').innerHTML = notes.length
        ? `<b>${TECH[id].name} Lv${SAVE.tech[id]}</b> — 解禁: ${notes.join(' / ')}`
        : `<b>${TECH[id].name} Lv${SAVE.tech[id]}</b> — この投資では新規解禁なし。${unlockNext(id)}`;
      $('dkUnlock').style.display = 'block';
      toast(TECH[id].name + ' Lv' + SAVE.tech[id] + (notes.length ? ' — ' + notes.length + ' 件 解禁' : ''));
    };
  });
}
/** その分野をあと何段上げれば何が出るか */
function unlockNext(id) {
  let best = null;
  for (const p of Object.values(PARTS)) {
    if (p.rare || techOk(p, SAVE.tech)) continue;
    const need = (p.tech || {})[id];
    if (need === undefined || need <= SAVE.tech[id]) continue;
    if (!best || need < best.need) best = { need, name: p.name };
  }
  return best ? best.name + ' は Lv' + best.need + ' から' : 'この分野の解禁はこれ以上できない';
}
function unlockPreview() {
  const locked = Object.values(PARTS).filter(p => !techOk(p, SAVE.tech) && !p.rare);
  if (!locked.length) return 'すべて解禁済み';
  return locked.slice(0, 4).map(p => p.name + '(' + techLack(p, SAVE.tech).join('+') + ')').join('、');
}

/** 基礎報酬 — 敵を全部沈めて帰投したときの、副目標と貨物を除いた額。
    実際の清算（endBattle）と同じ式で出す */
function stagePay(st) {
  spawnTally = { money: 0, merit: 0 };
  try { st.setup(); } catch (e) { /* 数えられない分は 0 のまま */ }
  const t = spawnTally; spawnTally = null;
  const repeat = SAVE.cleared.includes(st.id);
  /* 帰投時の区画耐久ぶん(最大 2000)は無傷を前提に入れておく */
  const money = t.money + 2000 + (st.boss ? 6000 : 0) + 2000;
  const merit = t.merit + (st.boss ? 60 : 20);
  return {
    money: Math.round(money * (repeat ? REPEAT_MONEY : 1)),
    merit: Math.round(merit * (repeat ? REPEAT_MERIT : 1)), repeat
  };
}

/* --- 出撃先 --- */
function renderOps() {
  let html = '';
  AREAS.forEach((area, ai) => {
    const open = ai === 0 || area.stages.every((s, si) => true) && AREAS[ai - 1].stages.every(s => SAVE.cleared.includes(s.id));
    html += `<div class="areaBlock ${open ? '' : 'lock'}"><div class="areaName">${area.name}${open ? '' : ' — 未解放'}</div>`;
    area.stages.forEach((st, si) => {
      const done = SAVE.cleared.includes(st.id);
      const prev = si === 0 ? true : SAVE.cleared.includes(area.stages[si - 1].id);
      const can = open && (prev || done);
      /* 解放されたエリアなら、先の作戦の実入りも見せる。どこを目指すかの材料になる */
      const pay = open ? stagePay(st) : null;
      html += `<div class="stageRow ${can ? '' : 'lock'} ${done ? 'done' : ''}" data-s="${st.id}">
        <span class="sn">${st.no} ${st.name}</span>
        <span class="ss">${st.short}</span>
        ${pay ? `<span class="spay">￥${pay.money.toLocaleString()}<i>功績 ${pay.merit}${pay.repeat ? ' ・再走' : ''}</i></span>` : ''}
        <span class="sb">${done ? '達成' : can ? '出撃' : '—'}</span></div>`;
    });
    html += '</div>';
  });
  $('dkOps').innerHTML = html;
  $('dkOps').querySelectorAll('.stageRow:not(.lock)').forEach(el => {
    el.onclick = () => showBrief(el.dataset.s);
  });
}

const hullPct = () => G.player ? Math.round(quadHealth(G.player) * 100) : 0;
/* 「〜%以上で帰投」は維持条件。達成判定は離脱の瞬間に行う（hold） */
const intact = pct => ({
  text: () => `区画耐久 ${pct}% 以上で帰投 <i>${hullPct()}%</i>`,
  test: () => hullPct() >= pct, sub: true, hold: true
});

function ring(n, cls, cx, cy, r, opt) {

    spawnEnemy(cls, cx + Math.cos(a) * r * rnd(0.6, 1), cy + Math.sin(a) * r * rnd(0.6, 1), a + Math.PI, opt);
  }
}

/** 自艦がたどるであろう航路。出発点 → 各目標 → 離脱海域 を結ぶ線分の列 */
function routeLegs(st) {
  const start = { x: 0, y: 0 };
  /* 敵をいくつかの塊にまとめる。塊ごとに 1 度は寄ることになる */
  const spots = [];
  for (const o of G.ships) {
    if (o.side !== 'enemy' && o.side !== 'civil') continue;
    const near = spots.find(q => dist2(q.x, q.y, o.x, o.y) < 1400);
    if (near) { near.x = (near.x + o.x) / 2; near.y = (near.y + o.y) / 2; }
    else spots.push({ x: o.x, y: o.y });
  }
  const legs = [];
  for (const q of spots) legs.push([start, q]);
  if (st.zone) {
    for (const q of spots) legs.push([q, st.zone]);
    legs.push([start, st.zone]);
  }
  return legs.length ? legs : [[start, { x: 2500, y: 0 }]];
}

/** 海図に目印を撒く。ランダムに散らすと視界の外に落ちるので、
    自艦がたどる航路のそばに置く。出発点・離脱海域・敵の初期位置だけは空ける */
function scatterIslands(st) {
  G.islands = [];
  const zone = st.zone;
  let seed = 0;
  for (const c of st.id) seed = seed * 31 + c.charCodeAt(0);
  const rand = () => { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; };
  /* 生成時点の航路を残す。敵は動くので、あとから引き直すと別物になる */
  const legs = G.routeLegs = routeLegs(st);
  const want = 4 + Math.floor(rand() * 3);
  const free = (x, y, r) =>
    dist2(x, y, 0, 0) > r + 650                                        // 出発点
    && (!zone || dist2(x, y, zone.x, zone.y) > r + zone.r + 300)       // 離脱海域
    && !G.ships.some(o => dist2(x, y, o.x, o.y) < r + 520)             // 敵の初期位置
    && !G.islands.some(o => dist2(x, y, o.x, o.y) < r + o.r + 420);
  /* 航路に沿った位置 t と、そこからの横距離 off で置く。
     off が半径を下回ると航路そのものが島にかかり、避けて回る必要が出る */
  const place = (offLo, offHi, tLo, tHi, tries, cap) => {
    const limit = Math.min(want, G.islands.length + (cap || want));
    for (let k = 0; k < tries && G.islands.length < limit; k++) {
      const leg = legs[Math.floor(rand() * legs.length) % legs.length];
      const a = leg[0], b = leg[1];
      const len = Math.max(1, dist2(a.x, a.y, b.x, b.y));
      if (len < 700) continue;
      const ux = (b.x - a.x) / len, uy = (b.y - a.y) / len;
      const r = 190 + rand() * 400;
      const t = (tLo + rand() * (tHi - tLo)) * len;
      const off = r * (offLo + rand() * (offHi - offLo)) * (rand() < 0.5 ? -1 : 1);
      const x = a.x + ux * t - uy * off, y = a.y + uy * t + ux * off;
      if (!free(x, y, r)) continue;
      G.islands.push(mkIsland(x, y, r, Math.floor(rand() * 9999)));
    }
  };
  place(0.10, 0.85, 0.22, 0.95, 700, 1);      // 1 個は航路にかける
  place(0.50, 2.20, 0.30, 1.08, 500);         // 航路のすぐ脇
  place(1.00, 3.40, 0.10, 1.25, 500);         // 少し外。ここまでで届かなければ諦める

  /* どの作戦にも「避けて回る島」が必ず 1 つある状態にする。
     棄却抽選で当たらなかったときは、航路にいちばん近い島を航路の上へ寄せる */
  if (G.islands.length && !G.islands.some(i => blocksRoute(i, legs))) {
    const gap = i => Math.min(...legs.map(l => segDist(i.x, i.y, l[0], l[1]))) - i.r;
    for (const isl of G.islands.slice().sort((a, b) => gap(a) - gap(b))) {
      /* いちばん近い脚の、いちばん近い点へ寄せる */
      let best = null;
      for (const l of legs) {
        const dx = l[1].x - l[0].x, dy = l[1].y - l[0].y, L = dx * dx + dy * dy || 1;
        const t = clamp(((isl.x - l[0].x) * dx + (isl.y - l[0].y) * dy) / L, 0.15, 0.85);
        const px = l[0].x + dx * t, py = l[0].y + dy * t;
        const d = dist2(isl.x, isl.y, px, py);
        if (!best || d < best.d) best = { d, px, py, ux: dx / Math.sqrt(L), uy: dy / Math.sqrt(L) };
      }
      const off = isl.r * 0.4 * (isl.seed % 2 ? 1 : -1);
      const x = best.px - best.uy * off, y = best.py + best.ux * off;
      if (dist2(x, y, 0, 0) < isl.r + 650) continue;
      if (zone && dist2(x, y, zone.x, zone.y) < isl.r + zone.r + 250) continue;
      if (G.islands.some(o => o !== isl && dist2(x, y, o.x, o.y) < isl.r + o.r + 200)) continue;
      isl.x = x; isl.y = y;
      break;
    }
  }
}

function checkObjectives(dt) {
  for (const o of G.objectives) {
    if (o.done) continue;
    /* 「〜%以上で帰投」のような維持条件は達成扱いにせず、離脱時に判定する */
    if (o.hold) continue;
    if (o.test()) {
      o.done = true; SFX.ok();
      pushLog((o.sub ? '✔ 副目標 達成' : '✔ 主目標 達成'), '#5fe3a1');
    }
  }
  const main = G.objectives.filter(o => !o.sub);
  if (main.every(o => o.done) && !G.extractReady) {
    G.extractReady = true;
    G.mainT = G.t;
    warn('主目標 達成', '離脱海域へ向かえ');
    pushLog('◆ 主目標達成 — 離脱海域へ', '#ffb43c');
  }
  /* 離脱判定 */
  const z = G.stage.zone, p = G.player;
  if (p && p.alive && dist2(p.x, p.y, z.x, z.y) < z.r) {
    G.extractT = (G.extractT || 0) + dt;
    if (G.extractT > 3) endBattle(G.extractReady);
  } else if (G.extractT > 0) G.extractT = Math.max(0, G.extractT - dt * 2);
  if (p && !p.alive) endBattle(false, '本艦 沈没');
}

function endBattle(win, why) {
  if (G.state !== 'battle') return;
  G.state = 'result';
  MUSIC.on = false;
  const st = G.stage;
  let bonus = 0, meritB = 0;
  let subDone = 0;
  /* 帰投した瞬間の状態で副目標を締める（耐久維持系はここで決まる）。
     離脱海域からでも、目標達成後の中断メニューからでも同じ扱い */
  if (win) for (const o of G.objectives) if (o.sub && !o.done && o.test()) o.done = true;
  if (win) {
    bonus = 2000 + (st.boss ? 6000 : 0);
    bonus += Math.round(quadHealth(G.player) * 2000);
    bonus += G.player.cargo * 260;                      // 積んだ貨物を無事に持ち帰った
    meritB = st.boss ? 60 : 20;
    subDone = G.objectives.filter(o => o.sub && o.done).length;
    bonus += subDone * (st.boss ? 3000 : 1500);
    meritB += subDone * (st.boss ? 25 : 12);
  }
  /* 制圧済みステージの再走は稼ぎ切れない（周回で難易度を溶かさない） */
  const repeat = SAVE.cleared.includes(st.id);
  const money = Math.round((G.money + bonus) * (repeat ? REPEAT_MONEY : 1));
  const merit = Math.round((G.merit + meritB) * (repeat ? REPEAT_MERIT : 1));
  SAVE.money += money; SAVE.merit += merit; SAVE.missions++;
  const rankBefore = rankOf(SAVE.merit - merit).name, rankAfter = rankOf(SAVE.merit).name;
  for (const id of G.gotParts) SAVE.stock[id] = stockOf(id) + 1;
  if (win && !SAVE.cleared.includes(st.id)) SAVE.cleared.push(st.id);
  SAVE.best = Math.max(SAVE.best, money);
  storeSave();
  G.endInfo = { win, why, money, merit, bonus, repeat, subDone, rankUp: rankBefore !== rankAfter ? rankAfter : null, parts: G.gotParts.slice() };
  setTimeout(showResult, 1200);
}

     <div class="row"><span>階級</span><b>${rankOf(SAVE.merit).name}${e.rankUp ? ' ★昇進' : ''}</b></div>
     <h3>目標</h3>
     ${G.objectives.map(o => `<div class="row"><span>${o.sub ? '◇ ' : '▫ '}${o.text().replace(/<[^>]+>/g, '')}</span><b>${o.done ? '達成' : '未達'}</b></div>`).join('')}
     ${e.parts.length ? '<h3>鹵獲</h3>' + e.parts.map(p => `<div class="row"><span>${PARTS[p].name}</span><b>非売品</b></div>`).join('') : ''}
     <div class="row"><span>残存 保有資金</span><b>￥${SAVE.money.toLocaleString()}</b></div>`,
    [
      ...(e.win && next ? [{ label: '次の作戦へ', fn: () => showBrief(next) }] : []),
      ...(!e.win ? [{ label: '再出撃', fn: () => startBattle(st.id) }] : []),
      { label: 'ドックへ', alt: !e.win, fn: showDock }
    ]);
}
function nextStageAfter(id) {
  const list = allStages();
  const i = list.findIndex(s => s.id === id);
  return i >= 0 && i + 1 < list.length ? list[i + 1].id : null;
}
function showPause() {
  if (G.state !== 'battle') return;
  G.state = 'menu';
  /* 主目標を達成済みなら、離脱海域まで戻らなくてもここから帰投できる */
  const done = G.extractReady;
  ov('PAUSED', '作戦中断', G.stage.no + ' ' + G.stage.name,
    `<h3>作戦目標</h3><div id="objList">${objectivesHTML()}</div>
     <div class="row" style="margin-top:10px"><span>撃沈</span><b>${G.kills}</b></div>
     <div class="row"><span>収入(暫定)</span><b>￥${G.money.toLocaleString()}</b></div>
     <p style="margin-top:12px">${done
      ? '主目標は達成済み。ここから帰投すれば<b>作戦成功</b>となる。<br>'
        + '副目標が残っているなら、戦い続けてから帰投してもよい。'
      : '主目標が未達成のまま撤退すると<b>作戦失敗</b>になる。'}</p>
     <h3>操作</h3>${keysHTML()}`,
    [{ label: '再開', fn: () => { G.state = 'battle'; hideOv(); } },
     { label: 'やり直す', alt: true, fn: () => startBattle(G.stage.id) },
     done
       ? { label: '帰投する（作戦成功）', fn: () => { G.state = 'battle'; hideOv(); endBattle(true, '目標達成のうえ帰投した'); } }
       : { label: '撤退する', danger: true, fn: () => { G.state = 'battle'; hideOv(); endBattle(false, '作戦を中止した'); } }]);
}

/* ======================================================================
   メインループ
   ====================================================================== */
function step(dt) {
  G.t += dt; G.seaPhase += dt;
  for (const s of G.ships) {
    if (!s.alive) { s.deathT -= dt; continue; }
    if (s !== G.player) updateAI(s, dt);
    updateShipPhysics(s, dt);
    updateBatteries(s, dt);
  }
  updateShells(dt); updateMissiles(dt); updateTorps(dt); updatePlanes(dt); updatePickups(dt);
  updateMusic(dt);
  for (const f of G.fx) {
    f.life -= dt;
    if (f.vx !== undefined) {
      f.x += f.vx * dt; f.y += f.vy * dt;
      if (f.vz !== undefined) { f.z += f.vz * dt; f.vz -= (f.k === 'smoke' ? -2 : 42) * dt; if (f.z < 0) { f.z = 0; f.vz *= -0.3; } }
      f.vx *= Math.pow(0.35, dt); f.vy *= Math.pow(0.35, dt);
    }
  }
  G.fx = G.fx.filter(f => f.life > 0);
  for (const w of G.wakes) w.life -= dt;
  G.wakes = G.wakes.filter(w => w.life > 0);
  for (const x of G.texts) x.life -= dt;
  G.texts = G.texts.filter(x => x.life > 0);
  for (const l of G.log) l.life -= dt;
  G.ships = G.ships.filter(s => s.alive || s.deathT > 0);
  checkObjectives(dt);
}

function render() {
  ctx.clearRect(0, 0, W, H);
  const p = G.player;
  if (p) {
    cam.x += ((p.x + cam.ox) - cam.x) * clamp(3.4 * dtReal, 0, 1);
    cam.y += ((p.y + cam.oy) - cam.y) * clamp(3.4 * dtReal, 0, 1);
  }
  cam.zoom += (cam.tzoom - cam.zoom) * clamp(9 * dtReal, 0, 1);
  ctx.save();
  if (shake > 0) {
    ctx.translate(rnd(-shake, shake), rnd(-shake, shake));
    shake *= Math.pow(0.004, dtReal);
    if (shake < 0.25) shake = 0;
  }
  drawSea();
  drawWakes();
  drawGroundOverlay();
  const items = G.ships.map(s => ({ d: depthKey(s.x, s.y), f: () => drawShip(s) }))
    .concat(G.islands.map(i => ({ d: depthKey(i.x, i.y), f: () => drawIsland(i) })));
  items.sort((a, b) => a.d - b.d);
  for (const it of items) it.f();
  drawPickups();
  drawPlanes();
  drawMarkers();
  drawProjectiles();
  drawFX();
  drawTexts();
  ctx.restore();
}

/* ---------- 航行速度（時間圧縮） ----------
   速力は実寸のまま、時間のほうを進める。交戦距離に入れば自動で実時間へ戻る。
   ------------------------------------------------------------------ */
const TIME_SCALES = [1, 2, 4];
const COMBAT_R = 4200;                 // この距離に敵が入ると圧縮を解く
function timeScaleNow() {
  const p = G.player;
  if (!p || !p.alive || (G.tScale || 1) === 1) return 1;
  if (G.fire) return 1;
  for (const o of G.ships) {
    if (!o.alive || o.side !== 'enemy') continue;
    if (dist2(o.x, o.y, p.x, p.y) < COMBAT_R) return 1;
  }
  for (const sh of G.shells) if (sh.side !== 'player') return 1;
  return G.tScale;
}
function cycleTimeScale() {
  const i = TIME_SCALES.indexOf(G.tScale || 1);
  G.tScale = TIME_SCALES[(i + 1) % TIME_SCALES.length];
  SFX.sel();
  pushLog('航行速度 ×' + G.tScale + (G.tScale > 1 ? '（交戦距離で自動解除）' : ''), '#5fe3a1');
}

let last = performance.now(), dtReal = 0.016;
function frame(now) {
  dtReal = Math.min((now - last) / 1000, 0.05); last = now;
  G.__fps = G.__fps ? G.__fps * 0.92 + (1 / Math.max(0.001, dtReal)) * 0.08 : 60;
  if ((G.state === 'battle' || G.state === 'result') && !G.paused) {
    const total = dtReal * timeScaleNow();
    const steps = Math.max(1, Math.min(12, Math.ceil(total / 0.02)));
    for (let i = 0; i < steps; i++) step(total / steps);
  }
  const inBattle = G.state === 'battle' || G.state === 'result' || G.state === 'menu';
  $('hud').style.display = inBattle ? 'block' : 'none';
  cv.style.display = inBattle ? 'block' : 'none';
  if (inBattle && G.player) { render(); updateHUD(); drawRadar(); }
  if (warnT > 0) {
    warnT -= dtReal;
    if (warnT <= 0) { $('wmsg').style.opacity = 0; $('wsub').style.opacity = 0; }
  }
  requestAnimationFrame(frame);
}

/* ======================================================================
   起動
   ====================================================================== */
function boot() {
  buildTelegraph();
  [...$('dkTabs').children].forEach(b => b.onclick = () => { dockTab = b.dataset.tab; SFX.sel(); renderDock(); });
  $('dkNew').onclick = () => {
    if (SAVE.designs.length >= 8) { SFX.ng(); return toast('設計図は 8 枚まで'); }
    const d = defaultDesign();
    d.name = '設計 ' + (SAVE.designs.length + 1);
    d.parts = [];
    SAVE.designs.push(d); SAVE.designIdx = SAVE.designs.length - 1;
    storeSave(); SFX.ok(); renderDock(); toast('新しい設計図を起こした');
  };
  $('dkCopy').onclick = () => {
    if (SAVE.designs.length >= 8) { SFX.ng(); return toast('設計図は 8 枚まで'); }
    const d = JSON.parse(JSON.stringify(SAVE.design));
    d.name = (d.name || '無題') + ' 改';
    SAVE.designs.push(d); SAVE.designIdx = SAVE.designs.length - 1;
    storeSave(); SFX.ok(); renderDock(); toast('複製した');
  };
  $('dkRename').onclick = () => {
    const n = prompt('設計図の名称', SAVE.design.name || '');
    if (n === null) return;
    SAVE.design.name = n.slice(0, 20) || '無題';
    storeSave(); SFX.ok(); renderDock();
  };
  $('dkDel').onclick = () => {
    if (SAVE.designs.length <= 1) { SFX.ng(); return toast('最後の 1 枚は消せない'); }
    SAVE.designs.splice(SAVE.designIdx, 1);
    SAVE.designIdx = clamp(SAVE.designIdx, 0, SAVE.designs.length - 1);
    storeSave(); SFX.ok(); renderDock(); toast('破棄した');
  };
  $('dkSortie').onclick = () => { dockTab = 'ops'; renderDock(); };
  $('dkTitle').onclick = () => { closeDock(); showTitle(); };
  showTitle();
  requestAnimationFrame(frame);
}
boot();

</script>

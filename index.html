
<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CONTAINER WARS ～コンテナシップコマンダー～</title>
<style>
/* 外部リソースは一切読まない。端末にあれば使い、無ければ近い系統に落ちる */
:root{
  --ink:#04090c; --steel:#111a20; --line:#25404c; --line2:#1a2c35;
  --hull:#cdd6db; --dim:#6f8a96; --dim2:#48606c;
  --sonar:#5fe3a1; --amber:#ffb43c; --warn:#ff5a47; --ice:#7fd4ff; --trp:#7fd4b0;
  --panel:linear-gradient(180deg,rgba(15,23,29,.92),rgba(8,13,17,.94));
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:#04090c;color:var(--hull);
  font-family:'Oxanium','Rajdhani','Chakra Petch',system-ui,-apple-system,'Hiragino Sans','Noto Sans JP',sans-serif;
  user-select:none;-webkit-user-select:none;cursor:crosshair}
canvas{display:block}
#view{position:fixed;inset:0;width:100%;height:100%;background:#04121a}
.mono{font-family:'Share Tech Mono',ui-monospace,'DejaVu Sans Mono',monospace}

/* ---------------- 戦闘 HUD ---------------- */
#hud{position:fixed;inset:0;pointer-events:none;display:none;
  font-family:'Share Tech Mono',ui-monospace,'DejaVu Sans Mono',monospace}
.panel{position:absolute;background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:9px 11px}
.lbl{font-size:9px;letter-spacing:.2em;color:var(--dim);text-transform:uppercase}

/* 左列 — 上から 航行 / 区画 / 応急 / 兵装。縦に積むので重ならない。
   絶対座標で並べていた頃は、画面が低いと兵装リストが応急パネルに重なっていた */
#leftCol{position:absolute;left:12px;top:12px;bottom:12px;width:300px;
  display:flex;flex-direction:column;gap:9px;pointer-events:none}
#leftCol > .panel{position:static;width:auto;flex:none}
#shipPanel{width:270px}
#shipName{font-family:'Oxanium';font-weight:800;font-size:15px}
#shipClass{font-size:9px;color:var(--dim);letter-spacing:.12em;margin-bottom:8px}
.navGrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.navCell{background:#0a1216;border:1px solid var(--line2);border-radius:4px;padding:4px 5px;text-align:center}
.navCell .n{font-family:'Oxanium';font-weight:800;font-size:15px;line-height:1.1}
.navCell .u{font-size:8px;color:var(--dim);letter-spacing:.1em}
.navCell .n #navSpdMax{font-size:10px;font-weight:600;color:var(--dim)}
#spdWhy{margin-top:4px;font-size:9px;letter-spacing:.04em;color:var(--dim);min-height:11px}
#spdWhy.hurt{color:var(--warn)}
#tele{display:flex;gap:2px;margin-top:8px}
#tele div{flex:1;height:16px;border:1px solid var(--line2);border-radius:2px;background:#0a1216;
  font-size:8px;display:flex;align-items:center;justify-content:center;color:var(--dim2)}
#tele div.on{background:rgba(95,227,161,.16);border-color:var(--sonar);color:var(--sonar)}
#tele div.astern.on{background:rgba(255,90,71,.16);border-color:var(--warn);color:var(--warn)}
#rudRow{display:flex;align-items:center;gap:6px;margin-top:7px}
#rudTrack{flex:1;height:10px;background:#0a1216;border:1px solid var(--line2);border-radius:5px;position:relative}
#rudTrack::before{content:'';position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--line)}
#rudKnob{position:absolute;top:1px;width:8px;height:6px;border-radius:2px;background:var(--amber);left:50%;margin-left:-4px;transition:left .12s}
#rudTxt{font-size:9px;color:var(--dim);width:64px;text-align:right}

/* 4区画ダメージ盤 */
#quadPanel{width:214px}
/* 艦の向きどおりに並べる — 上が艦首、下が艦尾、左右が舷。
   4 区画は同じ重みなので、バーの長さも 4 枚とも揃える（十字の空きは中央列で作る） */
#quadWrap{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px;margin-top:6px;
  grid-template-areas:'. bow .' 'port . star' '. stern .'}
#q_bow{grid-area:bow}#q_port{grid-area:port}#q_star{grid-area:star}#q_stern{grid-area:stern}
.quad{cursor:pointer;background:#0a1216;border:1px solid var(--line2);border-radius:4px;padding:4px 6px}
.quad:hover{border-color:var(--sonar)}
.quad .qn{font-size:9px;color:var(--dim);letter-spacing:.1em}
.quad b{font-family:'Oxanium';font-weight:800;font-size:15px;display:block;line-height:1.2}
.quad .qb{height:5px;border-radius:3px;background:#060c10;border:1px solid var(--line2);overflow:hidden;margin-top:3px}
.quad .qb i{display:block;height:100%;background:var(--sonar);transition:width .15s}
.quad.crit{border-color:var(--warn);box-shadow:0 0 12px rgba(255,90,71,.18) inset}
.quad.fire{background:linear-gradient(180deg,rgba(255,120,50,.14),#0a1216)}
.quad.flood{background:linear-gradient(0deg,rgba(90,180,255,.16),#0a1216)}
/* 応急班が戻している最中。放っておけば少しは戻る、が伝わればよい */
.quad.regen .qb i{background:repeating-linear-gradient(90deg,var(--sonar) 0 6px,#2b6b52 6px 12px)}
.quad.regen .qn::after{content:' ▲';color:var(--sonar)}

/* 応急修理 / 艦載機 */
#dcPanel{width:270px}
#quadPanel .lbl{display:block;margin-bottom:2px}
.dcrow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:5px;font-size:11px;color:var(--dim)}
.dcrow b{color:var(--hull);font-family:'Oxanium';font-size:14px}
.repbtn{border:1px solid var(--line2);border-radius:4px;padding:3px 10px;font-size:10px;color:var(--dim2);
  pointer-events:auto;cursor:pointer;background:#0a1216}
.repbtn.on{border-color:var(--sonar);color:var(--sonar)}
.repbtn.on:hover{background:rgba(95,227,161,.12)}

/* 兵装リスト */
/* 兵装は 8 種までと決めてあるので、8 行ぶん置ける高さがあれば足りる。
   縦列の残りを全部もらい、どうしても足りない画面でだけ内側が送られる */
/* `#leftCol > .panel` より詳しく書かないと flex:none に負けて縮まない */
#leftCol > #wpnPanel{width:auto;flex:1 1 auto;min-height:0;display:flex;flex-direction:column;
  overflow:hidden;pointer-events:auto}
#wpnList{flex:1;display:flex;flex-direction:column;gap:3px;margin-top:4px;min-height:0;overflow:auto}
.wrow{display:grid;grid-template-columns:14px 18px 1fr auto auto auto;gap:5px;align-items:center;
  padding:4px 6px;border:1px solid var(--line2);border-radius:4px;background:#0a1216;
  position:relative;overflow:hidden;cursor:pointer;font-size:11px}
.wrow .ic{display:block}
.wrow .ic svg{width:14px;height:14px;display:block}
.wrow .k{color:var(--dim2);font-size:9px}
.wrow .nm{color:var(--hull);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wrow .am{color:var(--dim);font-size:10px}
/* 撃てない理由。なぜ黙っているのかが分からないのが一番よくない */
.wrow .st{font-size:9.5px;color:var(--dim2);white-space:nowrap}
.wrow .st.go{color:var(--sonar)}
.wrow .st.wait{color:var(--amber)}
.wrow .md{font-size:10px;padding:1px 6px;border-radius:3px;border:1px solid var(--line2);color:var(--dim2)}
.wrow .rl{position:absolute;left:0;bottom:0;height:2px;background:var(--amber);width:0}
.wrow.manual{border-color:#7a5a1e}.wrow.manual .md{color:var(--amber);border-color:#7a5a1e}
.wrow.auto{border-color:#1e5a42}.wrow.auto .md{color:var(--sonar);border-color:#1e5a42}
.wrow.hold{opacity:.55}.wrow.hold .md{color:var(--warn);border-color:#6a2a24}
.wrow.dead{opacity:.35;filter:grayscale(1)}
.wrow.sel{box-shadow:0 0 0 1px var(--amber) inset}

#opsPanel{top:12px;right:12px;width:186px}
#opsTop{display:flex;justify-content:space-between;align-items:baseline}
#opsTop b{font-family:'Oxanium';font-weight:800;font-size:16px;color:var(--hull)}
#opsSub{font-size:9px;color:var(--dim2);margin-top:2px}
#opsGo{font-size:10px;color:var(--amber);margin-top:3px;min-height:13px}
#objList{margin-top:6px;font-size:11.5px;line-height:1.8}
.obj{color:var(--dim)}
.obj.done{color:var(--sonar);text-decoration:line-through;opacity:.75}
.obj.go{color:var(--amber)}
.obj.subobj{color:#7f96a2;font-size:10px}
.obj.subobj.done{color:var(--ice)}
.objhead{font-size:9px;letter-spacing:.16em;color:var(--dim2);margin-top:6px;padding-top:5px;border-top:1px dotted var(--line2)}
.obj i{font-style:normal;color:var(--hull)}
#opsFoot{display:flex;justify-content:space-between;margin-top:8px;padding-top:7px;border-top:1px solid var(--line2);font-size:10px;color:var(--dim)}
#opsFoot b{font-family:'Oxanium';font-size:13px;color:var(--hull)}

#radarPanel{bottom:12px;right:12px;padding:7px}
#radar{width:190px;height:190px;display:block}
#radarFoot{display:flex;justify-content:space-between;font-size:9px;color:var(--dim2);margin-top:4px}

#warnWrap{position:absolute;top:42%;left:50%;transform:translate(-50%,-50%);text-align:center;width:560px}
.wmsg{font-family:'Oxanium';font-weight:800;font-size:22px;letter-spacing:.14em;color:var(--warn);
  text-shadow:0 0 20px rgba(255,90,71,.5);opacity:0;transition:opacity .25s}
.wsub{font-size:12px;letter-spacing:.1em;color:var(--amber);opacity:0;transition:opacity .25s;margin-top:4px}
#extract{position:absolute;top:56%;left:50%;transform:translateX(-50%);font-family:'Oxanium';font-weight:800;
  font-size:20px;letter-spacing:.1em;display:none}
#log{position:absolute;left:322px;bottom:12px;width:320px;font-size:10px;line-height:1.6;color:var(--dim)}
#log b{font-weight:400;color:var(--hull)}
#escHint{position:absolute;right:220px;bottom:16px;font-size:9.5px;letter-spacing:.14em;color:rgba(72,96,108,.85)}
#escHint b{color:var(--dim);font-family:'Oxanium'}
/* ポーズ画面のキー一覧 */
.keys{display:grid;grid-template-columns:1fr 1fr;gap:0 22px;font-size:11.5px;line-height:1.7}
.keys div{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dotted var(--line2);padding:2px 0}
.keys b{color:var(--amber);font-family:'Oxanium';font-weight:700;white-space:nowrap}
.keys span{color:var(--dim)}
#vign{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .4s;
  box-shadow:inset 0 0 180px rgba(255,60,40,.34)}
#timeTag{position:absolute;top:12px;left:50%;transform:translateX(-50%);font-family:'Oxanium';
  font-weight:800;font-size:13px;letter-spacing:.14em;color:var(--sonar);
  background:rgba(6,18,24,.72);border:1px solid #1e5a42;border-radius:4px;padding:3px 12px;display:none}
#timeTag.held{color:var(--amber);border-color:#7a5a1e}
#pauseTag{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-family:'Oxanium';
  font-weight:800;font-size:40px;letter-spacing:.3em;color:rgba(205,214,219,.18);display:none}

/* ---------------- ドック ---------------- */
#dock{position:fixed;inset:0;background:linear-gradient(180deg,#070d12,#04080b);display:none;
  flex-direction:column;z-index:15;cursor:default}
#dkTop{display:flex;align-items:center;gap:14px;padding:12px 18px;border-bottom:1px solid var(--line)}
#dkTitle{font-family:'Oxanium';font-weight:800;font-size:16px;letter-spacing:.04em;cursor:pointer}
#dkTitle:hover{color:var(--sonar)}
#dkTabs{display:flex;gap:6px;margin-left:10px}
#dkTabs button{font-family:'Oxanium';font-weight:700;font-size:12px;padding:6px 16px;border-radius:4px;
  border:1px solid var(--line2);background:#0a1216;color:var(--dim);cursor:pointer}
#dkTabs button.on{border-color:var(--amber);color:var(--amber);background:rgba(255,180,60,.08)}
#dkInfo{margin-left:auto;display:flex;gap:18px;font-family:'Share Tech Mono',monospace;font-size:12px;color:var(--dim)}
#dkInfo b{color:var(--hull);font-size:14px}
#dkBody{flex:1;overflow:hidden;position:relative}
#dkDesign{display:flex;height:100%;gap:14px;padding:14px 18px}
.dkCol{display:flex;flex-direction:column;gap:10px;min-height:0}
#dkLeft{width:250px}
#dkCenter{flex:1;min-width:0}
#dkRight{width:330px}
.dkBox{background:rgba(12,19,25,.8);border:1px solid var(--line2);border-radius:6px;padding:10px 12px}
.dkBox h4{font-family:'Oxanium';font-size:11px;letter-spacing:.18em;color:var(--dim);font-weight:700;
  text-transform:uppercase;margin-bottom:8px}
#dkDesigns{display:flex;flex-direction:column;gap:4px;max-height:132px;overflow:auto}
.dsRow{display:flex;align-items:center;gap:6px;border:1px solid var(--line2);border-radius:4px;
  padding:5px 8px;background:#0a1216;cursor:pointer;font-size:11px}
.dsRow:hover{border-color:var(--sonar)}
.dsRow.on{border-color:var(--amber);background:rgba(255,180,60,.08)}
.dsRow .dn{flex:1;font-family:'Oxanium';font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dsRow .dh{font-size:9px;color:var(--dim2)}
.dsRow .dw{font-size:9px;color:var(--dim)}
.dsRow.bad .dw{color:var(--warn)}
#dkDesignBtns{display:flex;gap:4px;margin-top:7px}
#dkDesignBtns .btn{flex:1;padding:5px 0;font-size:10px;letter-spacing:.04em}
#dkHulls{display:flex;flex-direction:column;gap:6px}
.hullPick{border:1px solid var(--line2);border-radius:4px;padding:7px 9px;cursor:pointer;background:#0a1216}
.hullPick:hover{border-color:var(--sonar)}
.hullPick.on{border-color:var(--amber);background:rgba(255,180,60,.08)}
.hullPick.lock{opacity:.4;cursor:not-allowed}
.hullPick .t{font-family:'Oxanium';font-weight:700;font-size:12px}
.hullPick .d{font-size:9.5px;color:var(--dim);margin-top:2px}
.hullPick .d2{font-size:9.5px;color:var(--amber);margin-top:2px}
#dkStats{font-family:'Share Tech Mono',monospace;font-size:11px}
/* 設計評価 — 小さすぎて読めなかったので、5 分野を横並びの柱にして所見に幅を渡す */
/* 甲板が伸びると評価が潰れて読めなくなっていた。ここは必ず場所を取る */
#dkEvalBox{flex:0 0 auto;display:flex;flex-direction:column;min-height:186px;max-height:32vh}
#dkEval{font-size:12px;display:flex;flex-direction:column;gap:9px;flex:1;min-height:0}
.evbars{display:flex;gap:6px;flex:none}
.evlist{flex:1;overflow:auto;min-height:0}
.evrow{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  background:#0a1216;border:1px solid var(--line2);border-radius:4px;padding:5px 2px}
.evrow span{font-size:10px;letter-spacing:.1em;color:var(--dim)}
.evrow .evb{width:100%;height:5px;background:#060c10;border:1px solid var(--line2);border-radius:3px;overflow:hidden}
.evrow .evb i{display:block;height:100%;background:var(--sonar)}
.evrow .evb.lo i{background:var(--warn)}
.evrow .evb.mid i{background:var(--amber)}
.evrow b{font-family:'Oxanium';font-weight:800;font-size:17px;color:var(--hull);line-height:1}
.evrow.lo b{color:var(--warn)}.evrow.mid b{color:var(--amber)}
.adv{display:flex;gap:7px;padding:5px 0;border-top:1px dotted var(--line2);line-height:1.6}
.adv:first-child{border-top:none}
.adv i{font-style:normal;flex:none;font-weight:700}
.adv.bad i{color:var(--warn)}.adv.warn i{color:var(--amber)}.adv.tip i{color:var(--dim2)}
.adv.good i{color:var(--sonar)}
.adv.bad{color:#e8b6ae}.adv.warn{color:#d8c39a}.adv.tip{color:var(--dim)}
.adv.good{color:#9fdcbe}
.advok{color:var(--sonar);padding:5px 0}
.srow{display:flex;justify-content:space-between;padding:2px 0;color:var(--dim)}
.srow b{color:var(--hull);font-weight:400}
.srow b.bad{color:var(--warn)}
.sbar{height:6px;background:#060c10;border:1px solid var(--line2);border-radius:3px;overflow:hidden;margin:3px 0 6px}
.sbar i{display:block;height:100%}
#dkGridWrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:0}
/* 甲板の縦横は船体の実寸に対応する。船影がグリッドの外へはみ出す量は
   甲板の被覆率 DECK_L / DECK_W から出す（layoutDeck） */
#dkDeck{position:relative;width:100%;max-width:820px;padding:0 10%}
#dkSil{position:absolute;z-index:0;pointer-events:none;overflow:hidden}
#dkZones{display:grid;gap:3px;width:100%;margin-bottom:4px;position:relative;z-index:1}
.zband{border-radius:3px 3px 0 0;font-size:9px;letter-spacing:.08em;text-align:center;
  padding:2px 0 3px;border:1px solid;border-bottom:none;white-space:nowrap;overflow:hidden}
.zband.z-C{color:#c98a5c;border-color:#5c4330;background:rgba(160,96,48,.10)}
.zband.z-B{color:#9fb6c4;border-color:#3f5563;background:rgba(120,168,200,.10)}
.zband.z-E{color:#c0a870;border-color:#5a4f3d;background:rgba(176,144,72,.10)}
.zband.z-M{color:#a8b0bc;border-color:#4c545f;background:rgba(150,160,180,.10)}
#dkGrid{display:grid;gap:3px;width:100%;aspect-ratio:auto;position:relative}
#dkGrid .cell{position:relative;z-index:1}
/* 船体の外に出る行は「無い」。船影の甲板がそのまま見える */
#dkGrid .cell.void{background:transparent;border:1px solid transparent;pointer-events:none}
#dkTrim{display:flex;align-items:center;gap:8px;width:100%;max-width:820px;font-size:10px;color:var(--dim)}
#dkTrim .tbar{flex:1;height:8px;background:#0a1216;border:1px solid var(--line2);border-radius:4px;position:relative}
#dkTrim .tbar i{position:absolute;left:50%;top:-2px;width:1px;height:10px;background:var(--dim2)}
#dkTrim .tbar b{position:absolute;top:-3px;width:8px;height:12px;margin-left:-4px;border-radius:2px;
  background:var(--sonar);transition:left .12s}
#dkTrim.warn .tbar b{background:var(--amber)}
#dkTrim.bad .tbar b{background:var(--warn)}
#dkTrim .tv{min-width:150px;text-align:right;font-family:'Share Tech Mono',monospace}
.cell.z-C{background:#120e0b}
.cell.z-B,.cell.z-M{background:#0c1319}
.cell.z-E{background:#131108}
.cell{background:#0b1318;border:1px dashed #1e2f38;border-radius:3px;min-height:44px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  cursor:pointer;transition:.08s;overflow:hidden;
  font-size:10px;color:var(--dim);text-align:center;padding:2px;line-height:1.2}
.cell .ci{display:block;flex:none}
.cell .ci svg{width:17px;height:17px;display:block}
.cell .cn{font-size:9px;color:var(--dim);max-width:100%;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.cell:hover{border-color:var(--dim2)}
.cell.ok{border-color:var(--sonar);background:rgba(95,227,161,.10)}
.cell.no{border-color:var(--warn);background:rgba(255,90,71,.08)}
.cell.used{border-style:solid;border-color:var(--line);background:#16222a;color:var(--hull)}
.cell.cat-gun,.cell.cat-sec{background:#243039;border-color:#3d5563}
.cell.cat-aa{background:#22303a}
.cell.cat-torp{background:#1c332c;border-color:#2f6a55}
.cell.cat-rocket{background:#33241c;border-color:#7a4a30}
.cell.cat-bulge{background:#22303a;border-color:#4a6a7c}
.cell.cat-missile{background:#332c1c;border-color:#6a5a2f}
.cell.cat-sam{background:#1f2c36;border-color:#4a6a80}
.cell.cat-laser{background:#1c2c38;border-color:#3f7fa0}
.cell.cat-bridge{background:#2a333a;border-color:#5b6b74}
.cell.cat-boiler,.cell.cat-turbine{background:#2e2a22;border-color:#5a4f3d}
.cell.cat-cargo{background:#3a2a20;border-color:#6b4a33}
.cell.cat-armor{background:#2c3238;border-color:#6c7a86}
.cell.cat-dc{background:#1e2f2a;border-color:#4a7a68}
.cell.cat-radar,.cell.cat-sonar{background:#1f2c34;border-color:#3d6070}
.cell.cat-catapult,.cell.cat-hangar{background:#252d33;border-color:#48575f}
.zmap{display:flex;gap:1px;margin-top:3px}
.zmap i{flex:1;height:5px;border-radius:1px}
.zmap i.z-C{background:#8a5535}.zmap i.z-B{background:#4d6c80}
.zmap i.z-E{background:#7d6a3a}.zmap i.z-M{background:#5f6a78}
#dkAxis{display:flex;justify-content:space-between;width:100%;max-width:820px;font-size:10px;color:var(--dim2)}
#dkLayout{position:relative;z-index:1;width:100%;max-width:820px;font-size:9.5px;color:var(--dim);line-height:1.5}

<script>
'use strict';
/* ==========================================================================
   CONTAINER WARS ～コンテナシップコマンダー～
   クオータービュー(2D)・艦船設計 + 海戦アクション
   単一HTMLファイル / 依存なし / Canvas 2D

   『鋼鉄の咆哮 ウォーシップコマンダー』(WSC1) の骨格に沿う:
     戦略パート(ドックで設計・技術・購入) → ブリーフィング → 戦闘(リアルタイム)
     → 目標達成 → 離脱ポイントへ → リザルト(報奨金・功績値・ドロップ) → ループ
   ========================================================================== */

/* ===== CORE-BEGIN =====================================================
   DOM に触れない純粋部。tools/verify.mjs がこの区間だけを切り出して
   Node 上で直接検証する。
   ====================================================================== */

const TAU = Math.PI * 2;
const KT = 0.5144;
const MPS_TO_KT = 1 / KT;

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const rnd = (a, b) => a + Math.random() * (b - a);
const rint = (a, b) => Math.floor(rnd(a, b + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const dist2 = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);
const angN = a => ((a + Math.PI * 3) % TAU) - Math.PI;
const angTo = (ax, ay, bx, by) => Math.atan2(by - ay, bx - ax);
const approachAng = (cur, want, rate) => cur + clamp(angN(want - cur), -rate, rate);

function gauss() {
  let u = 0, v = 0;
  while (u === 0) u = Math.random();
  while (v === 0) v = Math.random();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(TAU * v);
}
function compass(a) {
  let d = (a * 180 / Math.PI + 90) % 360;
  if (d < 0) d += 360;
  return d;
}
const compassStr = a => String(Math.round(compass(a)) % 360).padStart(3, '0');

/* ---------- クオータービュー投影(2:1 ダイメトリック) ---------- */
const ISO_SX = 0.7071, ISO_SY = 0.3536, ISO_SZ = 0.6;
function project(x, y, z, cam, zoom, W, H) {
  const dx = x - cam.x, dy = y - cam.y;
  return {
    x: (dx - dy) * ISO_SX * zoom + W / 2,
    y: (dx + dy) * ISO_SY * zoom - z * ISO_SZ * zoom + H / 2
  };
}
function unproject(sx, sy, cam, zoom, W, H) {
  const a = (sx - W / 2) / (ISO_SX * zoom);
  const b = (sy - H / 2) / (ISO_SY * zoom);
  return { x: cam.x + (b + a) / 2, y: cam.y + (b - a) / 2 };
}
const depthKey = (x, y) => x + y;

/* ---------- 操艦 ---------- */
const TELEGRAPH = [
  { name: '後進', short: 'AST', f: -0.35 },
  { name: '停止', short: 'STOP', f: 0.00 },
  { name: '微速', short: '1/3', f: 0.30 },
  { name: '半速', short: '1/2', f: 0.55 },
  { name: '原速', short: '3/4', f: 0.78 },
  { name: '全速', short: 'FULL', f: 1.00 }
];
const TELE_STOP = 1;

/* 機関出力の残存率。艦尾を抜かれる・浸水するほど足が落ちる。
   平方根を噛ませてあるのは、半分傷んだだけで足が半分になると
   「立て直す前に置き去りにされる」ためで、効くのは末期だけにしてある。
   区画が 0 になった時点で沈没するので、下限の 0.40 は実際には踏まない */
const engineFactor = (sternRatio, flood) =>
  clamp(0.40 + 0.60 * Math.sqrt(clamp(sternRatio, 0, 1)), 0, 1)
  * clamp(1 - clamp(flood, 0, 1) * 0.35, 0.55, 1);
/** 艦首損傷による造波抵抗。潰れた艦首は水を押しのけられない */
const bowDragFactor = bowRatio => clamp(0.72 + 0.28 * Math.sqrt(clamp(bowRatio, 0, 1)), 0.72, 1);
/** 舵の効き。機関と同じ理由で、中程度の損傷では大きく落とさない */
const rudderFactor = sternRatio => clamp(0.45 + 0.55 * Math.sqrt(clamp(sternRatio, 0, 1)), 0.45, 1);

function turnRate(speedMps, rudder, maxSpeedMps, agility) {
  const v = Math.abs(speedMps);
  const eff = Math.min(1, v / Math.max(0.1, maxSpeedMps * 0.45));
  /* 全速に近いほど舵が効かない。その場で回れる高速艦は撃ちようがない。
     速度を落とせば回頭が戻るので、旋回戦では減速に意味が出る */
  const fast = clamp(1.15 - 0.45 * Math.pow(v / Math.max(1, maxSpeedMps), 2), 0.62, 1);
  return (rudder / 2) * agility * eff * fast;
}
function leadPoint(sx, sy, tx, ty, tvx, tvy, sp, iter) {
  let t = 0;
  for (let i = 0; i < (iter || 4); i++) {
    const px = tx + tvx * t, py = ty + tvy * t;
    t = Math.hypot(px - sx, py - sy) / sp;
  }
  return { x: tx + tvx * t, y: ty + tvy * t, t };
}
function dispersion(rangeM, baseAt1km, fcQuality, salvos, spotted) {
  const corr = 1 / (1 + Math.min(salvos, 4) * 0.16);
  const spot = spotted ? 0.66 : 1;
  return baseAt1km * (rangeM / 1000) * corr * spot / Math.max(0.35, fcQuality);
}
function penetrate(pen, armor, impactAngle) {
  const eff = armor / Math.max(0.35, Math.cos(clamp(Math.abs(impactAngle), 0, 1.3)));
  if (pen >= eff) return { mult: 1.0, kind: 'pen' };
  if (pen >= eff * 0.55) return { mult: 0.45, kind: 'part' };
  return { mult: 0.10, kind: 'ric' };
}
function hitsHull(lx, ly, len, beam) {
  const a = len / 2, b = beam / 2;
  return (lx * lx) / (a * a) + (ly * ly) / (b * b) <= 1;
}

/* ---------- 耐久区画: 艦首 / 艦尾 / 左舷 / 右舷 の4区画 ----------
   WSC1 のダメージ設計の核。全体HP制ではなく、
   いずれか1区画でも 0 になった時点で沈没する。
   ------------------------------------------------------------------ */
const QUADS = ['bow', 'stern', 'port', 'star'];
const QUAD_JA = { bow: '艦首', stern: '艦尾', port: '左舷', star: '右舷' };
/** 命中点のローカル座標から被害区画を返す。lx:前後(+が艦首) ly:左右(+が右舷) */
function quadrantAt(lx, ly, len) {
  const r = lx / (len / 2);
  /* 艦首/艦尾が前後 36% ずつ、中央 28% が左右。
     境目を狭くしすぎると被弾が舷側に集中し、片舷だけで沈む */
  if (r > 0.28) return 'bow';
  if (r < -0.28) return 'stern';
  return ly < 0 ? 'port' : 'star';
}
/** 区画が沈没条件に達しているか */
const isSunkByQuad = quads => QUADS.some(q => quads[q].hp <= 0);
/** 向かい合う区画 */
const QUAD_OPP = { bow: 'stern', stern: 'bow', port: 'star', star: 'port' };
/** 機銃弾が艦に与える被害の倍率。機銃は迎撃武器であって砲ではない */
const AA_SHIP_MULT = 0.30;
/** 艦載機の耐久。迎撃 1 発で落ちない */
const PLANE_HP = 4;
/** 命中区画の隣（＝対面以外）。被害はここへ波及する */
const adjacentQuads = q => QUADS.filter(k => k !== q && k !== QUAD_OPP[q]);
const QUAD_SPREAD = 0.18;

/* ---------- 島 ----------
   海図に目印が無いと、走っているのか止まっているのか分からない。
   島は形も判定も同じ 1 つの多角形から出る（同じ種なら必ず同じ形）。
   ------------------------------------------------------------------ */
const ISLAND_N = 16;
const hash01 = (a, b) => { const h = Math.sin(a * 127.1 + b * 311.7) * 43758.545; return h - Math.floor(h); };
/** 中心・半径・種から島を作る。pts は各方位の半径[m] */
function mkIsland(x, y, r, seed) {
  const pts = [];
  for (let i = 0; i < ISLAND_N; i++) {
    /* 隣どうしをならして、尖った星形にならないようにする */
    const a = hash01(seed, i), b = hash01(seed, (i + 1) % ISLAND_N), c = hash01(seed, (i + 2) % ISLAND_N);
    pts.push(r * (0.66 + 0.46 * (a * 0.5 + b * 0.3 + c * 0.2)));
  }
  return { x, y, r, seed, pts, h: clamp(r * 0.20, 14, 70) };
}
/** その方位における島の半径[m] */
function islandRadiusAt(isl, ang) {
  const t = (((ang % TAU) + TAU) % TAU) / TAU * ISLAND_N;
  const i = Math.floor(t), f = t - i;
  return lerp(isl.pts[i % ISLAND_N], isl.pts[(i + 1) % ISLAND_N], f);
}
/** 島に食い込んでいれば押し戻す量と向きを返す */
function islandPush(isl, x, y, margin) {
  const dx = x - isl.x, dy = y - isl.y;
  const d = Math.hypot(dx, dy) || 1e-6;
  if (d > isl.r * 1.14 + margin) return null;                 // 粗い判定で先に落とす
  const R = islandRadiusAt(isl, Math.atan2(dy, dx)) + margin;
  return d < R ? { over: R - d, nx: dx / d, ny: dy / d } : null;
}
const onLand = (islands, x, y) => islands.some(i => islandPush(i, x, y, 0));
/** 点から線分までの距離[m] */
function segDist(px, py, a, b) {
  const dx = b.x - a.x, dy = b.y - a.y, L = dx * dx + dy * dy || 1;
  const t = clamp(((px - a.x) * dx + (py - a.y) * dy) / L, 0, 1);
  return Math.hypot(px - (a.x + dx * t), py - (a.y + dy * t));
}
/** その島が航路（線分の列）にかかっているか */
const blocksRoute = (isl, legs) => legs.some(l => segDist(isl.x, isl.y, l[0], l[1]) < isl.r);

/* ---------- 装甲 ----------
   コンテナ船に舷側装甲は無い。守りたければ**装甲コンテナ**を甲板に積む。
   積んだセルの位置がそのまま守る区画になるので、装甲は必ずどこかに偏る。
   ------------------------------------------------------------------ */
/** 設計から装甲厚[mm]と区画耐久を出す。
    装甲コンテナは船体の防御そのものを厚くする — 置いた場所では区画を分けない。
    区画ごとに分けていた頃は、船型の都合で特定の区画に置けない設計が
    永久に穴を抱えることになり、配置パズルの罰が理不尽だった */
function quadDefenseOf(design) {
  const hull = HULLS[design.hull];
  let armor = 0, hp = hull.baseHP / 4;
  for (const p of design.parts) {
    const d = PARTS[p.id];
    if (d.cat !== 'armor') continue;
    armor += d.armor || 0;
    hp += d.plateHP || 0;
  }
  return { armor: Math.round(armor), hp: Math.round(hp) };
}

/* ======================================================================
   船体(艦種) — 甲板はコンテナベイのグリッドになっている
   ====================================================================== */
/* 甲板は列ごとに用途が決まる。実在のコンテナ船と同じく、
   コンテナを積む区画と、艦橋・機関を収める船楼(アイランド)は別物である。
   C 積載区画 / B 艦橋区 / E 機関区 / M 船楼区(艦橋と機関を兼ねる) */
const ZONE_JA = { C: '積載区画', B: '艦橋区', E: '機関区', M: '船楼区' };
/* 甲板は船体長の 86%・全幅の 82% を占める。船首の絞りはそのまま甲板の欠けになる */
const DECK_L = 0.86, DECK_W = 0.82;
/* 船型の折れ点（半長 a / 半幅 b に対する比）。船影も甲板もここから引く */
const HULL_FT = 0.40, HULL_FE = 0.90, HULL_FW = 0.34, HULL_SH = 0.88, HULL_SW = 0.72;
/** 位置 px[m] における片舷の幅[m] */
function hullHalfBeam(len, beam, px) {
  const a = len / 2, b = beam / 2, x = px / a;
  if (x >= HULL_FE) return Math.max(0, b * HULL_FW * (1 - (x - HULL_FE) / (1 - HULL_FE)));
  if (x >= HULL_FT) return b * (1 - (1 - HULL_FW) * (x - HULL_FT) / (HULL_FE - HULL_FT));
  if (x >= -HULL_SH) return b;
  return b * (1 - (1 - HULL_SW) * (-x - HULL_SH) / (1 - HULL_SH));
}
/** そのセルが船体の中に収まるか。船首に寄るほど外側の行が落ちる */
function cellUsable(hull, gx, gy) {
  if (gx < 0 || gy < 0 || gx >= hull.cols || gy >= hull.rows) return false;
  const cellL = hull.len * DECK_L / hull.cols, cellW = hull.beam * DECK_W / hull.rows;
  const xf = (gx + 1 - hull.cols / 2) * cellL, xa = (gx - hull.cols / 2) * cellL;
  const py = (Math.abs(gy + 0.5 - hull.rows / 2) + 0.5) * cellW;
  return py <= Math.min(hullHalfBeam(hull.len, hull.beam, xf),
                        hullHalfBeam(hull.len, hull.beam, xa));
}
const ZONE_CATS = {
  C: ['gun', 'sec', 'rocket', 'aa', 'sam', 'torp', 'missile', 'laser', 'radar', 'sonar',
      'catapult', 'hangar', 'cargo', 'armor', 'dc', 'bulge'],
  B: ['bridge', 'radar', 'sonar', 'aa', 'dc'],
  /* 機関区は機関のためにあるが、機械室に応急班と糧食庫を置くのは実船どおり。
     機関は 2 セル幅ばかりで必ず端数が出るので、その端数を殺さないための逃げでもある */
  E: ['boiler', 'turbine', 'aa', 'dc', 'cargo'],
  M: ['bridge', 'boiler', 'turbine', 'radar', 'sonar', 'aa', 'dc']
};
const zoneAt = (hull, gx) => hull.zones[clamp(gx, 0, hull.cols - 1)];
const zoneAccepts = (zone, cat) => (ZONE_CATS[zone] || []).includes(cat);
/** 区画の連なりを艦尾側から返す。描画も UI もこの区切りで考える */
function zoneRuns(hull) {
  const out = [];
  for (let c = 0; c < hull.cols; c++) {
    const z = hull.zones[c];
    const last = out[out.length - 1];
    if (last && last.z === z) last.b = c; else out.push({ z, a: c, b: c });
  }
  return out;
}
/** 積載区画の重心と長さの半分[m]。積付けの釣合いはここを基準に測る */
function deckRef(hull) {
  const cellL = hull.len * DECK_L / hull.cols;
  let sum = 0, n = 0, lo = Infinity, hi = -Infinity;
  for (let x = 0; x < hull.cols; x++) {
    if (hull.zones[x] !== 'C') continue;
    for (let y = 0; y < hull.rows; y++) {
      if (!cellUsable(hull, x, y)) continue;
      const px = (x + 0.5 - hull.cols / 2) * cellL;
      sum += px; n++; lo = Math.min(lo, px); hi = Math.max(hi, px);
    }
  }
  return n ? { px: sum / n, half: Math.max(cellL, (hi - lo) / 2) } : { px: 0, half: cellL };
}

/** 積める実セル数。船首で落ちた行は数えない */
function deckCells(hull, from, to) {
  let n = 0;
  for (let x = from === undefined ? 0 : from; x <= (to === undefined ? hull.cols - 1 : to); x++) {
    if (hull.zones[x] !== 'C') continue;
    for (let y = 0; y < hull.rows; y++) if (cellUsable(hull, x, y)) n++;
  }
  return n;
}

/* ---------- 設計の検証 ---------- */
function partAt(design, gx, gy) {
  for (const p of design.parts) {
    const d = PARTS[p.id];
    if (gx >= p.x && gx < p.x + d.w && gy >= p.y && gy < p.y + d.h) return p;
  }
  return null;
}
function canPlace(design, partId, gx, gy, ignore) {
  const hull = HULLS[design.hull], d = PARTS[partId];
  if (gx < 0 || gy < 0 || gx + d.w > hull.cols || gy + d.h > hull.rows) return '船体からはみ出す';
  /* 船首は絞られている。船体からはみ出す行はそもそも存在しない */
  for (let a = 0; a < d.w; a++) for (let b = 0; b < d.h; b++)
    if (!cellUsable(hull, gx + a, gy + b)) return '艦首の絞りにかかる';
  /* 区画の用途。コンテナと兵装は積載区画、艦橋と機関は船楼にしか収まらない */
  for (let a = 0; a < d.w; a++) {
    const z = zoneAt(hull, gx + a);
    if (!zoneAccepts(z, d.cat)) return ZONE_JA[z] + 'には置けない';
  }
  for (let a = 0; a < d.w; a++) for (let b = 0; b < d.h; b++) {
    const o = partAt(design, gx + a, gy + b);
    if (o && o !== ignore) return '他のパーツと干渉する';
  }
  if (d.arc === 'side') {
    const outer = (gy === 0) || (gy + d.h === hull.rows);
    if (!outer) return '発射管は舷側の列にしか置けない';
  }
  return null;
}
/* 応急修理は出撃時から使える。使い切っても時間で戻る */
const REPAIR_START = 2, REPAIR_MAX = 3, REPAIR_COOLDOWN = 55;
/* 応急班の地道な復旧 — 火も水も止まった区画は、時間をかけて少しずつ戻る。
   戻り切らない（REGEN_CAP）ので損傷そのものは消えないが、
   「機関不調のまま何も打てず作戦の最後まで引きずる」状態が終わる。
   REGEN_WAIT は直近の被弾からの猶予。撃たれ続けている間は復旧できない */
const REGEN_RATE = 0.010, REGEN_CAP = 0.68, REGEN_WAIT = 12;
/** その区画がいま自力で戻れるか。火災・浸水・被弾直後は戻らない */
const canRegen = (k, dt) => !(k.fire > 0.02) && !(k.flood > 0.02)
  && (k.hitT || 0) <= 0 && k.hp > 0 && k.hp < k.max * REGEN_CAP;
/** 雷撃の扇 — 的の長さの 1.1 倍を覆う角度に開く。
    一定角にすると、近い的には広すぎ、遠い大物には狭すぎる。
    覆う幅を的に合わせれば、扇の意味（どれか 1 本を当てる）が距離によらず保たれる */
const TORP_FAN_MAX = 0.22;
const torpFanHalf = (tgtLen, d) => clamp(tgtLen * 0.5 / Math.max(1, d), 0.015, TORP_FAN_MAX);
/* 漂流兵 1 人につき、次の応急修理までの待ち時間がこれだけ縮む */
const SURVIVOR_COOLDOWN_CUT = 5;
/** 応急能力。再編成の待ち時間・持てる回数・鎮火の速さ */
function dcStats(design) {
  let cut = 1, mult = 1, plus = 0;
  for (const p of design.parts) {
    const d = PARTS[p.id];
    if (d.cat !== 'dc') continue;
    cut *= (1 - (d.repairCut || 0));
    mult *= (d.dcMult || 1);
    plus += d.repairPlus || 0;
  }
  return {
    cooldown: Math.max(16, Math.round(REPAIR_COOLDOWN * cut)),
    maxRepairs: REPAIR_MAX + plus,
    dcMult: Math.min(3, mult)
  };
}

/* ---------- 設計評価 ----------
   validateDesign が「建造できるか」を見るのに対し、こちらは「戦えるか」を見る。
   出撃を止めることはせず、気づいていない穴だけを名指しする。
   ------------------------------------------------------------------ */
const SCORE_JA = { fire: '火力', armor: '防御', speed: '速力', air: '防空', eye: '索敵' };
/** 5 分野の評点（0〜1）。船体をまたいで比べられるよう、絶対値で正規化する */
function designScore(design) {
  const st = designStats(design);
  let dps = 0, aa = 0;
  for (const p of design.parts) {
    const d = PARTS[p.id];
    if (!d.range) continue;
    const rate = (d.dmg || 0) * (d.barrels || 1) / Math.max(0.1, d.reload || 1);
    if ((d.intercept || 0) > 0) aa += d.intercept * (d.range / 1000) / Math.max(0.1, d.reload || 1);
    else if (d.cat === 'torp') dps += rate * 0.35;      // 雷撃は舷と機会を選ぶぶん割り引く
    else if (d.cat === 'missile') dps += rate * 0.7;    // 迎撃される
    else dps += rate;
  }
  return {
    fire: clamp(dps / 750, 0, 1),
    armor: clamp(st.armor / 110, 0, 1) * 0.45 + clamp(st.quadHP / 9000, 0, 1) * 0.55,
    speed: clamp((st.speed - 12) / 18, 0, 1),
    air: clamp(aa / 40, 0, 1),
    eye: clamp((st.detect - 1600) / 2000, 0, 1) * 0.7 + (st.detectSub ? 0.3 : 0)
  };
}

/** 設計への助言。level は bad(穴) / warn(弱点) / tip(伸びしろ) */
function designAdvice(design) {
  const hull = HULLS[design.hull];
  const st = designStats(design);
  const sc = designScore(design);
  const out = [];
  const add = (level, text) => out.push({ level, text });
  const parts = design.parts.map(p => PARTS[p.id]);
  const has = f => parts.some(f);
  const count = f => parts.filter(f).length;

  /* --- 穴 --- */
  if (!has(d => d.range && d.cat !== 'aa' && d.cat !== 'sam'))
    add('bad', '敵艦を沈める兵装が無い。主砲か発射管を積むこと');
  if (!has(d => (d.intercept || 0) > 0))
    add('bad', '迎撃兵装が無い。艦載機と噴進弾を落とせないので、空から一方的に攻撃を受ける');
  if (st.armor === 0)
    add('bad', '装甲化コンテナが 1 つも無い。ダメージコントロールが必要');
  else if (st.armor < 40)
    add('warn', '装甲 ' + st.armor + 'mm。中口径の徹甲弾には足りない');

  /* --- 弱点 --- */
  if (st.trimSpd < 1)
    add('warn', '積付けが' + (st.trim > 0 ? '艦首' : '艦尾') + 'に寄っている。'
      + '速力 −' + Math.round((1 - st.trimSpd) * 100) + '%。反対側に貨物コンテナを積めば戻る');
  if (st.speed < hull.baseSpeed * 0.72)
    add('warn', '基準速力の ' + Math.round(st.speed / hull.baseSpeed * 100) + '% しか出ていない。'
      + '機関を強化するか、重量を減らす必要がある');
  if (st.weight > st.maxWeight * 0.94 && !st.over)
    add('warn', '排水量が上限まであと ' + (st.maxWeight - st.weight).toLocaleString() + 't。積み替えの余地が無い');
  if (!has(d => d.cat === 'radar'))
    add('warn', 'レーダーが無い。手動射撃の偏差補正が 0.15 のままで、自力で補正することになる');
  if (!has(d => d.detectSub))
    add('tip', 'ソナーが無い。潜航中の敵の位置がわからない');

  /* --- 伸びしろ --- */
  const guns = design.parts.filter(p => PARTS[p.id].range && PARTS[p.id].cat !== 'aa' && PARTS[p.id].cat !== 'sam');
  const fore = guns.filter(p => arcOfPart(design, p).c === 0).length;
  if (guns.length >= 3 && (fore === guns.length || fore === 0))
    add('tip', '主兵装の射界が' + (fore ? '前方' : '後方') + 'に偏っている。'
      + (fore ? '追われると撃ち返せない' : '追撃戦で火力が不足する'));
  /* 数えるのは種類。同型を何基積んでも操作は 1 つで済む */
  const slotN = weaponSlotsOf(design).filter(id => usesAutoSlot(PARTS[id].cat)).length;
  const cap = autoSlotCap(0);
  if (slotN > cap)
    add('tip', '射撃指揮を行う兵装が ' + slotN + ' 種。いまの電気技術で自動に回せるのは '
      + autoSlotCap(SAVE.tech.elec) + ' 種（最大 ' + autoSlotCap(TECH_MAX) + ' 種）。'
      + '残りは手動になる');
  if (slotN >= WEAPON_SLOT_MAX)
    add('warn', '兵装スロットが上限の ' + WEAPON_SLOT_MAX + ' 種。これ以上は種類を増やせない');
  const used = design.parts.reduce((a, p) => a + PARTS[p.id].w * PARTS[p.id].h, 0);
  const free = deckCells(hull) + [...hull.zones].filter(z => z !== 'C').length * hull.rows - used;
  if (free >= 3 && !st.over)
    add('tip', '空きベイが ' + free + '。貨物コンテナは軽く、持ち帰れば 1 個 260 円になる');
  if (has(d => d.cat === 'hangar') !== has(d => d.cat === 'catapult'))
    add('warn', '格納庫と射出機は、両方を揃えなければ艦載機を発進させられない');
  if (has(d => d.cat === 'torp')) {
    const port = design.parts.filter(p => PARTS[p.id].cat === 'torp' && arcOfPart(design, p).side === -1).length;
    const star = design.parts.filter(p => PARTS[p.id].cat === 'torp' && arcOfPart(design, p).side === 1).length;
    if (port === 0 || star === 0)
      add('tip', '発射管が' + (port ? '左舷' : '右舷') + 'だけにある。反対舷への積載を推奨する');
  }
  if (sc.fire > 0.55 && sc.armor < 0.30)
    add('tip', '火力に対して防御が薄い。正面戦闘には心もとない');
  if (sc.armor > 0.6 && sc.speed < 0.35)
    add('tip', '船体重量が大きすぎる。追撃戦で苦しい展開となる');

  /* --- 良いところ ---
     指摘だけを並べると、直したのかどうかが分からない。
     効いている部分は効いていると言う。オペレーターの所見とはそういうものである */
  if (sc.fire >= 0.62)
    add('good', '火力は十分。様々な任務に対応可能');
  if (st.armor >= 60)
    add('good', '装甲 ' + st.armor + 'mm。' + (st.armor >= 110 ? '主砲級の徹甲弾にも耐えられる' : '中口径程度なら耐えられる'));
  if (st.speed >= hull.baseSpeed * 0.95)
    add('good', '速力 ' + st.speed.toFixed(1) + 'kt。船体の基準どおりで、様々な任務に対応できる');
  if (sc.air >= 0.55)
    add('good', '対空能力が高い。空から一方的に攻撃されることはないだろう');
  if (st.detectSub && st.detect >= 3000)
    add('good', '索敵と対潜がそろっている。見えない相手に一方的に攻撃されることはない');
  if (Math.abs(st.trim) < 0.05 && design.parts.length > 4)
    add('good', '積付けの釣合いが良い。船速、操舵ともに良好');
  if (st.dc.maxRepairs > REPAIR_MAX || st.dc.dcMult > 1.5)
    add('good', 'ダメージコントロールが手厚い。損傷しても立て直しが利く');
  if (has(d => d.cat === 'torp')) {
    const pt = design.parts.filter(p => PARTS[p.id].cat === 'torp' && arcOfPart(design, p).side === -1).length;
    const sb = design.parts.filter(p => PARTS[p.id].cat === 'torp' && arcOfPart(design, p).side === 1).length;
    if (pt > 0 && sb > 0) add('good', '発射管が両舷にある。どちらの舷を向けても雷撃の機会がある');
  }
  const lo = Object.keys(SCORE_JA).filter(k => sc[k] < 0.30).length;
  if (!lo && out.every(o => o.level !== 'bad'))
    add('good', '5　分野に穴が無い。様々な任務に対応可能');
  return out;
}

function validateDesign(design) {
  const hull = HULLS[design.hull];
  const errs = [];
  const st = designStats(design);
  const bridges = design.parts.filter(p => PARTS[p.id].cat === 'bridge').length;
  const power = design.parts.filter(p => PARTS[p.id].power).length;
  if (hull.bridgeless) {
    if (bridges) errs.push('無人運航船体に艦橋は積めない');
  } else if (bridges !== 1) errs.push('艦橋を1基 積むこと');
  if (power < 1) errs.push('推進機関が必要');
  if (st.over) errs.push('排水量が上限を超えている');
  if (st.speed < 6) errs.push('出力不足で自力航行できない');
  const slots = weaponSlotsOf(design);
  if (slots.length > WEAPON_SLOT_MAX)
    errs.push('兵装は ' + WEAPON_SLOT_MAX + ' 種まで（いまは ' + slots.length + ' 種）。'
      + '同じ兵装は何基積んでも 1 種と数える');
  for (const p of design.parts) {
    const e = canPlace(design, p.id, p.x, p.y, p);
    if (e) errs.push(PARTS[p.id].name + ': ' + e);
  }
  return errs;
}

/* ---------- 設計 → 性能 ---------- */
/** 排水量の上限。バルジを積めば船体の値より増える */
function maxWeightOf(design) {
  const hull = HULLS[design.hull];
  return hull.maxWeight
    + design.parts.reduce((a, p) => a + (PARTS[p.id].maxWeight || 0), 0);
}
function designStats(design) {
  const hull = HULLS[design.hull];
  const maxWeight = maxWeightOf(design);
  let weight = hull.hullWeight, power = 0, fc = hull.fc || 0, planes = 0, detect = 1600, detectSub = 0, cargo = 0;
  for (const p of design.parts) {
    const d = PARTS[p.id];
    weight += d.weight;
    power += d.power || 0;
    fc += d.fc || 0;
    planes += d.planes || 0;
    if (d.detect) detect = Math.max(detect, d.detect);
    if (d.detectSub) detectSub = Math.max(detectSub, d.detectSub);
    if (d.cat === 'cargo') cargo++;
  }
  const def = quadDefenseOf(design);
  const armorWeight = design.parts.reduce((a, p) => a + (PARTS[p.id].cat === 'armor' ? PARTS[p.id].weight : 0), 0);
  /* 積付けの偏り。艦橋と機関は船体側で釣り合いを取ってあるものとし、
     積載区画に何をどこへ載せたかだけがトリムを生む（実船の積付け計画と同じ）*/
  const ref = deckRef(hull);
  let mom = 0;
  for (const p of design.parts) {
    if (zoneAt(hull, p.x) !== 'C') continue;
    mom += PARTS[p.id].weight * (cellToLocal(design, p).px - ref.px);
  }
  const lcg = mom / Math.max(1, weight);                 // 船全体を動かす腕の長さ[m]
  const trim = lcg / Math.max(1, ref.half);              // 甲板の半分を 1 とした偏り
  /* 少しの偏りはバラストで吸収できる。度を越すと船首(船尾)が沈んで足も舵も鈍る */
  const trimOver = Math.max(0, Math.abs(trim) - 0.10);
  const trimSpd = clamp(1 - trimOver * 1.6, 0.82, 1), trimAgi = clamp(1 - trimOver * 1.2, 0.85, 1);
  /* 必要出力は排水量に比例する。機関を積むほど速いが、機関自体も重い */
  const need = weight * 1.55;
  const speed = hull.baseSpeed * clamp(0.35 + 0.65 * (power / Math.max(1, need)), 0.28, 1.30) * trimSpd;
  const agility = hull.agility * clamp(1.18 - (weight / maxWeight) * 0.42, 0.55, 1.2) * trimAgi;
  const hasCatapult = design.parts.some(p => PARTS[p.id].cat === 'catapult');
  const dc = dcStats(design);
  return {
    weight: Math.round(weight), maxWeight, power, armorWeight: Math.round(armorWeight),
    speed, agility, quadHP: def.hp, armor: def.armor, dc,
    fc: (fc || 0.4), planes: hasCatapult ? planes : 0,
    detect, detectSub, cargo, over: weight > maxWeight,
    lcg, trim, trimSpd, trimAgi
  };
}

/* ---------- パーツの解禁判定 ---------- */
function techOk(def, tech) {
  for (const k in (def.tech || {})) if ((tech[k] || 0) < def.tech[k]) return false;
  return true;
}
function techLack(def, tech) {
  const out = [];
  for (const k in (def.tech || {})) if ((tech[k] || 0) < def.tech[k]) out.push(TECH[k].name + ' Lv' + def.tech[k]);
  return out;
}

/* ---------- 射界: 配置位置から決まる ---------- */
/** 砲の向いた端 px から、その向きの船楼が塞ぐ半角[rad]。船楼が無ければ 0。
    船楼は全幅を占めるので、隙間が狭いほど大きく視界を食う */
function islandBlock(hull, px, dir) {
  const cellL = hull.len * DECK_L / hull.cols;
  let near = null;
  for (let c = 0; c < hull.cols; c++) {
    if (hull.zones[c] === 'C') continue;
    const dx = ((dir > 0 ? c : c + 1) - hull.cols / 2) * cellL - px;   // 砲に向いた面まで
    if (dir * dx <= 1e-6) continue;                                     // 砲より手前・同列は見ない
    if (near === null || Math.abs(dx) < near) near = Math.abs(dx);
  }
  if (near === null) return 0;
  return Math.atan2(hullHalfBeam(hull.len, hull.beam, px + dir * near), Math.max(cellL * 0.25, near));
}
const ARC_MAX = 2.62;                                    // 遮る物が無いときの半角 (150°)
function arcOfPart(design, p) {
  const hull = HULLS[design.hull], d = PARTS[p.id];
  const cx = p.x + d.w / 2, cy = p.y + d.h / 2;
  if (d.arc === 'all') return { c: 0, h: Math.PI };
  if (d.arc === 'side') {
    const port = cy < hull.rows / 2;
    return { c: port ? -Math.PI / 2 : Math.PI / 2, h: 0.95, side: port ? -1 : 1 };
  }
  /* 船楼は射線を遮る。抜けているほうへ向き、塞がれた側のぶん射界が削れる。
     隙間は砲の「向いた端」から測る — 船楼のすぐ隣に置けば視界はほとんど残らない */
  const cellL = hull.len * DECK_L / hull.cols;
  const bf = islandBlock(hull, (p.x + d.w - hull.cols / 2) * cellL, 1);
  const ba = islandBlock(hull, (p.x - hull.cols / 2) * cellL, -1);
  if (!bf && !ba) return cx >= hull.cols / 2 ? { c: 0, h: ARC_MAX } : { c: Math.PI, h: ARC_MAX };
  if (bf && !ba) return { c: Math.PI, h: clamp(Math.PI - bf, 0.9, ARC_MAX) };
  if (!bf && ba) return { c: 0, h: clamp(Math.PI - ba, 0.9, ARC_MAX) };
  /* 前後を船楼に挟まれた位置。舷側しか抜けていない */
  return { c: bf <= ba ? 0 : Math.PI, h: clamp(Math.PI - bf - ba, 0.9, ARC_MAX) };
}
/** グリッド座標 → 艦上のローカル座標[m] */
function cellToLocal(design, p) {
  const hull = HULLS[design.hull], d = PARTS[p.id];
  const cellL = hull.len * DECK_L / hull.cols, cellW = hull.beam * DECK_W / hull.rows;
  const cx = p.x + d.w / 2, cy = p.y + d.h / 2;
  return { px: (cx - hull.cols / 2) * cellL, py: (cy - hull.rows / 2) * cellW, cellL, cellW };
}
function inArc(want, shipHdg, arcCenter, arcHalf) {
  return Math.abs(angN(want - (shipHdg + arcCenter))) <= arcHalf;
}

let AC = null, muted = false;
function audio() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { } }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(f, d, type, v, slide, delay) {
  if (muted) return;
  const a = audio(); if (!a) return;
  try {
    const t0 = a.currentTime + (delay || 0);
    const o = a.createOscillator(), g = a.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(f, t0);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(24, f + slide), t0 + d);
    g.gain.setValueAtTime(v || 0.05, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
    o.connect(g); g.connect(a.destination); o.start(t0); o.stop(t0 + d + 0.02);
  } catch (e) { }
}
function noise(d, v, hp, delay) {
  if (muted) return;
  const a = audio(); if (!a) return;
  try {
    const n = Math.floor(a.sampleRate * d);
    const buf = a.createBuffer(1, n, a.sampleRate), ch = buf.getChannelData(0);
    for (let i = 0; i < n; i++) ch[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 2);
    const src = a.createBufferSource(); src.buffer = buf;
    const f = a.createBiquadFilter(); f.type = hp ? 'highpass' : 'lowpass'; f.frequency.value = hp || 420;
    const g = a.createGain(); g.gain.value = v || 0.1;
    src.connect(f); f.connect(g); g.connect(a.destination);
    src.start(a.currentTime + (delay || 0));
  } catch (e) { }
}

const MUSIC = {
  beat: 0.30, t: 0, step: 0, on: false,
  bass: [0, 0, 7, 0, 5, 0, 3, 0, 0, 0, 7, 0, 10, 0, 8, 7],   // 半音オフセット
  lead: [null, null, 12, null, null, 15, null, 19, null, null, 12, null, 22, null, 19, null]

const semitone = (base, n) => base * Math.pow(2, n / 12);
function updateMusic(dt) {
  const boss = G.ships && G.ships.find(s => s.alive && s.superweapon && s.ai && s.ai.alerted);
  if (!!boss !== MUSIC.on) {
    MUSIC.on = !!boss;
    if (MUSIC.on) { MUSIC.step = 0; MUSIC.t = 0; pushLog('◆ 交戦音楽 — 超兵器', '#ff5a47'); }
  }
  if (!MUSIC.on || muted) return;
  MUSIC.t -= dt;
  if (MUSIC.t > 0) return;
  MUSIC.t = MUSIC.beat;
  const i = MUSIC.step % 16;
  tone(semitone(55, MUSIC.bass[i]), 0.26, 'sawtooth', 0.045, -4);          // 低音の刻み
  if (i % 4 === 0) noise(0.06, 0.035, 2600);                                // 拍頭
  const l = MUSIC.lead[i];
  if (l !== null) tone(semitone(220, l), 0.22, 'square', 0.022, 0);         // 上物
  if (i === 15) tone(semitone(110, 0), 0.5, 'triangle', 0.03, -10);
  MUSIC.step++;
}

      s.designs = s.designs.filter(d => d && HULLS[d.hull]);

/* 揺れは「当たった」ことが分かれば足りる。長く強く揺らすと画面が読めない */

/** hp は数値でも、区画ごとの表でもよい */
function mkQuads(hp) {
  const q = {};
  for (const k of QUADS) {
    const v = typeof hp === 'object' ? hp[k] : hp;
    q[k] = { hp: v, max: v, fire: 0, flood: 0, fireT: 0, floodT: 0 };
  }
  return q;
}
function mkShip(o) {

    alive: true, deathT: 0, hitFlash: 0, wakeT: 0, list: 0, listV: 0, flood: 0,
    batteries: [], target: null, ai: null, sub: false, dive: 0, air: false
  }, o);

function mkBattery(def, o) {

function buildPlayerShip(design, x, y, hdg) {
  const hull = HULLS[design.hull], st = designStats(design);
  const s = mkShip({
    kind: 'player', side: 'player', name: '特設巡洋艦 ' + (design.name || 'KAIRYU'), cls: hull.name,
    len: hull.len, beam: hull.beam, quadHP: st.quadHP, armor: st.armor,
    speed: st.speed, agility: st.agility, fc: st.fc, detect: st.detect, detectSub: st.detectSub,
    x, y, hdg, design
  });
  for (const p of design.parts) {
    const d = PARTS[p.id];
    if (!d.range && d.cat !== 'catapult') continue;
    const loc = cellToLocal(design, p);
    const arc = arcOfPart(design, p);
    if (d.cat === 'catapult') { s.catapult = { px: loc.px, py: loc.py }; continue; }
    s.batteries.push(mkBattery(d, {
      px: loc.px, py: loc.py, pz: 9 + (d.h > 1 ? 3 : 0),
      arcC: arc.c, arcH: arc.h, side: arc.side || 0,
      dmg: d.dmg || 0, gx: p.x, gy: p.y
    }));
  }
  /* 出撃時から自動枠を守る。守らないと HUD が「自動枠 8/7」と嘘をつく。
     あふれた兵装は手動 — 何を自動に回すかは艦長が決める */
  {
    const cap = autoSlotCap(SAVE.tech.elec);
    const auto = new Set();
    for (const b of s.batteries) {
      if (!usesAutoSlot(b)) { b.mode = 'auto'; continue; }
      if (auto.has(b.def.id)) { b.mode = 'auto'; continue; }
      if (auto.size < cap) { auto.add(b.def.id); b.mode = 'auto'; } else b.mode = 'manual';
    }
  }
  s.planes = []; s.planeMax = st.planes; s.planesReady = st.planes;
  s.survivors = 0;
  s.dc = st.dc;
  s.repairs = Math.min(REPAIR_START + (st.dc.maxRepairs - REPAIR_MAX), st.dc.maxRepairs);
  s.repairT = st.dc.cooldown;
  s.cargo = st.cargo;
  return s;
}
